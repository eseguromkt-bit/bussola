    var nome = NOMES_VIEW[b.dataset.view];
    if(nome){ b.title = nome; b.setAttribute("aria-label", nome); }
  });
  // barra inferior e painel "Mais" (celular)
  var noSheet = ["grupo","franquias","parceiros","calculadora","scripts","config"];
  document.querySelectorAll(".bnav-btn").forEach(function(b){
    if(b.dataset.ic && !b.querySelector(".ico-svg")) b.insertAdjacentHTML("afterbegin", ico(b.dataset.ic,20));
    b.classList.toggle("active", b.dataset.view? b.dataset.view===ui.view
                                              : noSheet.indexOf(ui.view)>-1);
  });
  document.querySelectorAll(".sheet-item").forEach(function(b){
    if(b.dataset.ic && !b.querySelector(".ico-svg")) b.insertAdjacentHTML("afterbegin", ico(b.dataset.ic,18));
    b.classList.toggle("active", b.dataset.view===ui.view);
  });
  var mm = document.getElementById("mtopMark");
  if(mm && !mm.querySelector(".ico-svg")) mm.innerHTML = ico("bussola",17);
  var mb = document.querySelector(".mtop-btn");
  if(mb && !mb.querySelector(".ico-svg")) mb.innerHTML = ico("lupa",18);
  var mt = document.getElementById("mtopTitle");
  if(mt) mt.textContent = NOMES_VIEW[ui.view] || "Bússola";

  // itens de administração só existem para quem é admin
  var admOk = ehAdmin();
  document.querySelectorAll('[data-admin="1"]').forEach(function(b){ b.style.display = admOk? "" : "none"; });
  if(!admOk && (ui.view==="adm" || ui.view==="equipe")) ui.view = "inicio";
  var sb = document.querySelector(".sidebar-search");
  if(sb && !sb.querySelector(".ico-svg")){
    sb.insertAdjacentHTML("afterbegin", ico("lupa",15));
    sb.title = "Buscar (tecla /)"; sb.setAttribute("aria-label","Buscar");
  }
  var bm = document.getElementById("brandMark");
  if(bm && !bm.querySelector(".ico-svg")) bm.innerHTML = ico("bussola",21);
  var si = document.getElementById("searchBar");
  if(si && !si.querySelector(".ico-svg")) si.insertAdjacentHTML("afterbegin", ico("lupa",18));

  aplicarTema();
  var eu = usuarioAtual();
  document.getElementById("sidebarFoot").innerHTML = eu
    ? ('<div class="row-between" style="gap:6px;"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;">'+
       '<b style="color:var(--ink-soft);">'+esc(eu.nome)+"</b><br>"+
       '<span class="pill '+(PAPEIS[eu.papel]||PAPEIS.vendedor).pill+'">'+esc((PAPEIS[eu.papel]||PAPEIS.vendedor).nome)+"</span></span>"+
       '<button class="btn btn-sm btn-ghost" data-action="sair" title="Sair">'+ico("proibido",14)+"</button></div>")
    : "Seus dados ficam salvos neste navegador.";
  if(eu) document.getElementById("sidebarFoot").insertAdjacentHTML("beforeend", '<div class="selo" id="selo"></div>');
  atualizarSelo();

  var v = ui.view;
  if(v==="atendimento") renderAtendimento();
  else if(v==="grupo") renderGrupo();
  else if(v==="franquias") renderFranquias();
  else if(v==="ramos") renderRamos();
  else if(v==="parceiros") renderParceiros();
  else if(v==="comissoes") renderComissoes();
  else if(v==="calculadora") renderCalculadora();
  else if(v==="scripts") renderScripts();
  else if(v==="equipe") renderEquipe();
  else if(v==="adm") renderAdm();
  else if(v==="config") renderConfig();
  else renderInicio();

function handle(action, el){
  var l;
  switch(action){
    case "ir": fecharMais(); ui.view = el.dataset.view; render(); break;
    case "tema":
      ui.tema = el.dataset.tema;
      try{ localStorage.setItem("bussola_tema", ui.tema); }catch(e){}
      aplicarTema(); break;

    case "abrir-busca": fecharMais(); abrirBusca(""); break;
    case "abrir-mais": document.getElementById("sheetOverlay").hidden = false; break;
    case "fechar-mais": fecharMais(); break;
    case "busca-sugestao": abrirBusca(el.dataset.q); break;
    case "busca-abrir": abrirResultado(parseInt(el.dataset.i,10)); break;

    case "novo-lead": leadModal(null); break;
    case "editar-lead": leadModal(findLead(el.dataset.id)); break;
    case "salvar-lead": {
      var id = el.dataset.id, dados = {
        nome: (document.getElementById("mNome").value||"").trim()||"Novo candidato",
        telefone: document.getElementById("mTel").value.trim(),
        cidade: document.getElementById("mCidade").value.trim(),
        estado: document.getElementById("mUF").value.trim().toUpperCase(),
        origem: document.getElementById("mOrigem").value.trim()
      };
      if(id){ l = findLead(id); if(l){ Object.assign(l, dados); l.atualizadoEm = nowISO(); } }
      else {
        l = novoLead(dados.nome); Object.assign(l, dados);
        state.leads.push(l); state.activeLeadId = l.id;
        ui.view = "atendimento"; ui.openEtapas = {1:true};
      }
      saveStateNow(); closeModal(); render();
      toast(id? "Candidato atualizado." : "Atendimento criado.");
      break;
    }
    case "abrir-lead": {
      state.activeLeadId = el.dataset.id;
      ui.view = "atendimento"; ui.openEtapas = {}; ui.calc.roy = null;
      var al = findLead(el.dataset.id), pe = al? proximaEtapaPendente(al) : null;
      if(pe) ui.openEtapas[pe] = true;
      saveStateNow(); render(); break;
    }
    case "excluir-lead":
      if(window.confirm("Excluir este atendimento? Não dá para desfazer.")){
        state.leads = state.leads.filter(function(x){ return x.id!==el.dataset.id; });
        if(state.activeLeadId===el.dataset.id) state.activeLeadId = null;
        saveStateNow(); render();
      }
      break;
    case "mudar-status":
      l = findLead(el.dataset.id);
      if(l){ l.status = el.value; l.atualizadoEm = nowISO(); saveStateNow(); render(); }
      break;
    case "marcar-feito":
      l = findLead(el.dataset.id);
      if(l){ l.proximaFeita = true; l.atualizadoEm = nowISO(); saveStateNow(); render(); }
      break;

    case "toggle-etapa-aberta": {
      var n = el.dataset.n;
      ui.openEtapas[n] = !ui.openEtapas[n];
      var c = document.querySelector('[data-etapa="'+n+'"]');
      if(c) c.classList.toggle("open", !!ui.openEtapas[n]);
      break;
    }
    case "toggle-etapa": {
      l = activeLead(); if(!l) return;
      var nn = el.dataset.n;
      l.etapas[nn] = !l.etapas[nn]; l.atualizadoEm = nowISO();
      saveStateNow(); render(); break;
    }
    case "concluir-etapa": {
      l = activeLead(); if(!l) return;
      var ne = parseInt(el.dataset.n,10);
      if(l.etapas[ne]){ l.etapas[ne] = false; }
      else {
        l.etapas[ne] = true;
        ui.openEtapas = {};
        var seg = proximaEtapaPendente(l);
        if(seg) ui.openEtapas[seg] = true;
        if(ne>=3 && l.status==="Novo lead") l.status = "Qualificação";
        if(ne>=5 && (l.status==="Novo lead"||l.status==="Contato iniciado"||l.status==="Qualificação")) l.status = "Apresentação";
        if(ne>=9 && ["Apresentação"].indexOf(l.status)>-1) l.status = "Análise";
        if(ne>=11 && ["Análise","Apresentação"].indexOf(l.status)>-1) l.status = "Proposta";
      }
      l.atualizadoEm = nowISO(); saveStateNow(); render();
      setTimeout(function(){
        var pe = proximaEtapaPendente(l);
        var alvo = pe? document.querySelector('[data-etapa="'+pe+'"]') : null;
        if(alvo) alvo.scrollIntoView({behavior:"smooth", block:"center"});
      },60);
      break;
    }
    case "set-qualificacao":
      l = activeLead(); if(!l) return;
      l.qualificacao = (l.qualificacao===el.dataset.q)? "" : el.dataset.q;
      l.atualizadoEm = nowISO(); saveStateNow(); render(); break;
    case "toggle-ramo-lead":
      l = activeLead(); if(!l) return;
      l.ramosInteresse[el.dataset.id] = !l.ramosInteresse[el.dataset.id];
      l.atualizadoEm = nowISO(); saveStateNow(); render(); break;
    case "set-modelo":
      l = activeLead(); if(!l) return;
      l.modeloRecomendado = (l.modeloRecomendado===el.dataset.id)? "" : el.dataset.id;
      ui.calc.roy = null; l.atualizadoEm = nowISO(); saveStateNow(); render(); break;
    case "set-nota":
      l = activeLead(); if(!l) return;
      l.nota = (String(l.nota)===el.dataset.n)? "" : el.dataset.n;
      l.atualizadoEm = nowISO(); saveStateNow(); render(); break;

    case "abrir-ramo":
      ui.ramoAberto = el.dataset.id; ui.view = "ramos"; render();
      setTimeout(function(){
        var a = document.querySelector('[data-ramo-anchor="'+el.dataset.id+'"]');
        if(a) a.scrollIntoView({behavior:"smooth", block:"start"});
      },60);
      break;
    case "fechar-ramo": ui.ramoAberto = null; render(); break;

    case "script-cat": ui.scriptCat = el.dataset.cat; render(); break;
    case "ver-script": {
      var s = scriptById(el.dataset.id);
      if(s) openTexto(s.titulo, preencher(s.texto));
      break;
    }
    case "ver-objecao": {
      var o = OBJECOES().filter(function(x){ return x.ch===el.dataset.ch; })[0];
      if(o) openTexto("Objeção — "+o.t, o.r+"\n\nPergunta de retorno:\n"+o.q);
      break;
    }
    case "registrar-objecao": {
      l = activeLead();
      if(!l){ toast("Abra um atendimento primeiro."); return; }
      var ch = el.dataset.ch;
      if(l.objecoes.some(function(x){ return x.ch===ch; })) toast("Já estava registrada.");
      else {
        var ob = OBJECOES().filter(function(x){ return x.ch===ch; })[0];
        l.objecoes.push({ch:ch, t:ob.t, quando:nowISO()});
        toast("Objeção registrada.");
      }
      l.atualizadoEm = nowISO(); saveStateNow(); render(); break;
    }

    case "toggle-acc": {
      var k = el.dataset.key;
      ui.openAcc[k] = !ui.openAcc[k];
      var acc = el.closest(".acc");
      if(acc) acc.classList.toggle("open", !!ui.openAcc[k]);
      break;
    }
    case "copiar-texto": tryCopy(el.dataset.txt); break;
    case "copy-preview": { var ta=document.getElementById("previewText"); if(ta) tryCopy(ta.value); break; }
    case "close-modal": closeModal(); break;

    case "calc-produto": {
      ui.calc.produto = el.value; ui.calc.base=""; ui.calc.preco=""; ui.calc.qtd="1";
      var w = el.closest(".calc-wrap");
      if(w) w.outerHTML = renderCalcWidget();
      break;
    }
    case "copiar-simulacao": tryCopy(textoSimulacao()); break;

    case "exportar": {
      var payload = {tipo:"bussola-grupo-e", versao:3, exportadoEm:new Date().toISOString(),
                     consultorNome:state.consultorNome, leads:state.leads};
      var txt = JSON.stringify(payload,null,2);
      if(downloadsCap){
        downloadsCap.save({filename:"bussola-backup.json", data:txt}).then(function(){ toast("Backup salvo."); })
          .catch(function(err){ if(!err||err.code!=="declined") openTexto("Backup (copie e salve)", txt); });
      } else openTexto("Backup — copie e salve num arquivo .json", txt);
      break;
    }
    /* ---------- Administração ---------- */
    case "adm-aba": ui.admAba = el.dataset.k; render(); break;
    case "adm-ramo": ui.admRamo = el.dataset.id; render(); break;
    case "restaurar-colecao":
      if(window.confirm("Descartar suas edições e voltar ao conteúdo original?")){
        db.restaurar(el.dataset.c); render(); toast("Conteúdo original restaurado.");
      }
      break;
    case "sair": if(window.confirm("Sair da sua conta?")) sair(); break;

    case "recarregar-equipe":
      if(!naNuvem()) return;
      el.disabled = true;
      nuvem.carregarPerfis(nuvem.perfil.id)
        .then(nuvem.carregarLeads)
        .then(function(){ render(); toast("Números atualizados."); })
        .catch(function(err){ el.disabled = false; toast("Não consegui atualizar: "+((err&&err.message)||"erro")); });
      break;

    /* parceiros */
    case "filtrar-parceiros":
      ui.pcRamo = el.dataset.id || null;
      render(); break;

    case "novo-parceiro": {
      var pre = {ramos: el.dataset.ramo? [el.dataset.ramo] : [], destaques:""};
      abrirForm("Novo parceiro", camposParceiro(), pre, "salvar-parceiro", 'data-id=""');
      break;
    }
    case "editar-parceiro": {
      var pcE = porId(PARCEIROS(), el.dataset.id);
      if(!pcE) return;
      abrirForm("Editar parceiro", camposParceiro(), {
        nome:pcE.nome, categoria:pcE.categoria, logo:pcE.logo, ramos:pcE.ramos||[],
        resumo:pcE.resumo, destaques:(pcE.destaques||[]).join("\n"),
        site:pcE.site, observacao:pcE.observacao
      }, "salvar-parceiro", 'data-id="'+pcE.id+'"');
      break;
    }
    case "salvar-parceiro": {
      var pcId = el.dataset.id;
      var nomeP = fmVal("nome");
      if(!nomeP) return toast("Informe o nome do parceiro.");
      var antigo = pcId? porId(PARCEIROS(), pcId) : null;
      var logoNova = fmImagem("logo");
      // logo trocada: a antiga sai do armazenamento para não virar lixo
      if(antigo && antigo.logo && antigo.logo !== logoNova) nuvem.apagarLogo(antigo.logo);
      db.upsertItem("parceiros", {
        id: pcId || uid(),
        nome: nomeP,
        categoria: fmVal("categoria"),
        logo: logoNova,
        ramos: fmMarcas("ramos"),
        resumo: fmVal("resumo"),
        destaques: fmLista("destaques"),
        site: fmVal("site"),
        observacao: fmVal("observacao")
      });
      closeModal(); render(); toast(pcId? "Parceiro atualizado." : "Parceiro cadastrado.");
      break;
    }
    case "excluir-parceiro": {
      var pcX = porId(PARCEIROS(), el.dataset.id);
      if(!pcX) return;
      if(!window.confirm("Excluir o parceiro "+pcX.nome+"?")) return;
      if(pcX.logo) nuvem.apagarLogo(pcX.logo);
      db.removerItem("parceiros", pcX.id);
      render(); toast("Parceiro excluído.");
      break;
    }
    case "fm-marca":
      el.classList.toggle("active");
      el.setAttribute("aria-pressed", el.classList.contains("active"));
      break;
    case "remover-logo": {
      var boxL = document.getElementById("fm_"+el.dataset.campo+"_box");
      if(!boxL) return;
      boxL.dataset.url = "";
      boxL.querySelector(".pc-logo").outerHTML = previewLogo("");
      el.hidden = true;
      break;
    }

    /* detalhes livres do segmento */
    case "editar-detalhes": {
      var rD = ramoById(el.dataset.id);
      if(!rD) return;
      ui.detalhesRamo = rD.id;
      modalDetalhes(rD);
      break;
    }
    case "detalhe-novo": {
      var rN = ramoById(ui.detalhesRamo); if(!rN) return;
      lerDetalhesDoForm(rN);
      // relê depois de gravar: senão o clone é da versão anterior e apaga
      // o que a pessoa acabou de digitar
      var copiaN = clonar(ramoById(rN.id));
      copiaN.detalhes = (copiaN.detalhes||[]).concat([{titulo:"", texto:"", icone:"livro"}]);
      db.upsertItem("ramos", copiaN);
      modalDetalhes(ramoById(rN.id));
      break;
    }
    case "detalhe-remover": {
      var rR = ramoById(ui.detalhesRamo); if(!rR) return;
      lerDetalhesDoForm(rR);
      var copiaR = clonar(ramoById(rR.id));
      copiaR.detalhes = (copiaR.detalhes||[]).filter(function(_,i){ return i !== parseInt(el.dataset.i,10); });
      db.upsertItem("ramos", copiaR);
      modalDetalhes(ramoById(rR.id));
      break;
    }
    case "salvar-detalhes": {
      var rS = ramoById(ui.detalhesRamo); if(!rS) return;
      lerDetalhesDoForm(rS);
      closeModal(); render(); toast("Detalhes do segmento salvos.");
      break;
    }

    case "acesso-modo":
      ui.acessoModo = el.dataset.m;
      mostrarAcesso();
      break;

    case "continuar-offline":
      state.sessaoId = state.ultimaSessaoNuvem || state.sessaoId;
      saveStateNow();
      entrarApp();
      toast("Modo sem conexão. O que você fizer sobe quando a internet voltar.");
      break;

    case "migrar-nuvem": {
      var m = state.migrar || {};
      var qtd = (m.leads||[]).length;
      if(!window.confirm("Enviar "+qtd+" atendimento(s) deste navegador para a nuvem?")) return;
      el.disabled = true; el.textContent = "Enviando…";
      nuvem.migrar().then(function(){
        render(); toast("Pronto. Seus dados agora estão na nuvem.");
      }).catch(function(err){
        el.disabled = false; el.textContent = "Enviar para a nuvem";
        toast("Não consegui enviar: "+((err&&err.message)||"erro"));
      });
      break;
    }
    case "descartar-migracao":
      if(window.confirm("Descartar os dados antigos deste navegador? Os que já estão na nuvem continuam.")){
        delete state.migrar; state.migrouEm = nowISO(); saveStateNow(); render();
      }
      break;

    /* usuários */
    case "novo-usuario":
      if(naNuvem()){
        openModal("Como entra um novo consultor",
          '<p class="muted" style="margin:0 0 12px;">Na nuvem, cada pessoa cria a própria conta — assim ninguém precisa combinar senha por mensagem.</p>'+
          '<ol style="margin:0 0 14px;padding-left:20px;line-height:1.9;font-size:14px;">'+
          "<li>Envie o endereço do site e a <b>senha da equipe</b> (a que abre a ferramenta).</li>"+
          '<li>Na tela de acesso, a pessoa clica em <b>“Ainda não tenho conta — criar”</b>.</li>'+
          "<li>Ela entra como <b>Vendedor</b>. Aqui você muda o perfil ou desativa quando precisar.</li></ol>"+
          '<p class="faint" style="margin:0;">Só a primeira conta criada no sistema vira administradora.</p>');
        break;
      }
      abrirForm("Novo usuário", CAMPOS_USUARIO, {papel:"vendedor", ativo:"1"}, "salvar-usuario", 'data-id=""');
      break;
    case "editar-usuario": {
      var uAlvo = porId(state.usuarios, el.dataset.id);

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  if(el.matches("input[type=checkbox], select")) return;
  handle(el.dataset.action, el);
});
document.addEventListener("change", function(e){
  var el = e.target.closest("[data-action]");
  if(el && el.matches("select")) handle(el.dataset.action, el);
});

function onBind(e){
  var el = e.target.closest("[data-bind]");
  if(!el) return;
  var l = activeLead(); if(!l) return;
  setPath(l, el.dataset.bind, el.value);
  l.atualizadoEm = nowISO(); scheduleSave();
}
document.addEventListener("input", onBind);
document.addEventListener("change", onBind);

document.addEventListener("input", function(e){
  if(e.target.closest("[data-calc]")) atualizarCalc();
  var c = e.target.closest('[data-action-input="consultor"]');
  if(c){
    state.consultorNome = c.value;
    var eu = usuarioAtual();
    if(eu){ eu.nome = c.value; }
    scheduleSave();
  }
});
document.addEventListener("change", function(e){ if(e.target.closest("[data-calc]")) atualizarCalc(); });

document.getElementById("searchInput").addEventListener("input", function(){ ui.buscaSel=0; renderBusca(); });
document.getElementById("searchInput").addEventListener("keydown", function(e){
  if(e.key==="ArrowDown"){ e.preventDefault(); navBusca(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); navBusca(-1); }
  else if(e.key==="Enter"){ e.preventDefault(); abrirResultado(ui.buscaSel); }
});
document.getElementById("searchOverlay").addEventListener("click", function(e){
  if(e.target.id==="searchOverlay") fecharBusca();
});
document.getElementById("modalOverlay").addEventListener("click", function(e){
  if(e.target.id==="modalOverlay") closeModal();
});
document.getElementById("sheetOverlay").addEventListener("click", function(e){
  if(e.target.id==="sheetOverlay") fecharMais();
});

document.addEventListener("keydown", function(e){
  var emCampo = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||""));
  if(e.key==="Escape"){
    if(!document.getElementById("searchOverlay").hidden) fecharBusca();
    else if(!document.getElementById("sheetOverlay").hidden) fecharMais();
    else closeModal();
    return;
  }
  if((e.key==="k"||e.key==="K") && (e.metaKey||e.ctrlKey)){ e.preventDefault(); abrirBusca(""); return; }
  if(e.key==="/" && !emCampo){ e.preventDefault(); abrirBusca(""); }
});

// Reduz a imagem no próprio navegador antes de enviar: uma logo de banco
// não precisa de mais que 400px, e assim o arquivo sai de megabytes para
// poucos kilobytes. WebP quando o navegador sabe gerar; PNG quando não.
function reduzirImagem(arquivo, ladoMax){
  ladoMax = ladoMax || 400;
  return new Promise(function(ok, falha){
    if(!arquivo || !/^image\//.test(arquivo.type||"")) return falha(new Error("nao-imagem"));
    if(arquivo.size > 8*1024*1024) return falha(new Error("grande-demais"));
    var leitor = new FileReader();
    leitor.onerror = function(){ falha(new Error("leitura")); };
    leitor.onload = function(){
      var img = new Image();
      img.onerror = function(){ falha(new Error("formato")); };
      img.onload = function(){
        var e = Math.min(1, ladoMax/Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width*e)), a = Math.max(1, Math.round(img.height*e));
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = a;
        var ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, w, a);
        var mime = "image/webp";
        var dataUrl = cv.toDataURL(mime, .9);
        if(dataUrl.indexOf("data:image/webp") !== 0){   // navegador sem WebP
          mime = "image/png"; dataUrl = cv.toDataURL(mime);
        }
        var ext = mime === "image/webp" ? "webp" : "png";
        cv.toBlob(function(blob){
          if(!blob) return falha(new Error("conversao"));
          ok({blob:blob, dataUrl:dataUrl, mime:mime, ext:ext, largura:w, altura:a});
        }, mime, .9);
      };
      img.src = String(leitor.result);
    };
    leitor.readAsDataURL(arquivo);
  });
}

function lerJson(input, aoLer){
  var f = input.files && input.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{ aoLer(JSON.parse(String(rd.result))); }
    catch(err){ toast("Arquivo inválido."); }
  };
  rd.readAsText(f); input.value = "";
}

/* =========================================================================
   NUVEM — Supabase
   O app funciona em dois modos e sabe em qual está:

   · modo nuvem  — usuários, conteúdo e atendimentos ficam no Supabase e
                   valem para o time inteiro, em qualquer computador.
   · modo local  — se a biblioteca do Supabase não carregar (prévia do
                   Claude, rede bloqueada, servidor fora do ar), tudo segue
                   funcionando no navegador, como antes. Nada quebra.

   A troca é automática: quem usa não precisa escolher nada.
   ========================================================================= */
var BALDE_LOGOS = "parceiros";   // balde do Storage onde ficam as logos
var SUPABASE_URL = "https://yjryiizuutgqdfmnjvey.supabase.co";
var SUPABASE_KEY = "sb_publishable_QNRrZUX5OmAAsvEqsUzKmw_90eRuRtA";

// A chave acima é a "publishable": ela é feita para ficar exposta no site.
// Quem protege os dados são as regras de linha (RLS) do banco, não ela.

var CDNS = [
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
  "https://unpkg.com/@supabase/supabase-js@2"
];

function uuid4(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  var b = new Uint8Array(16);
  try{ crypto.getRandomValues(b); }
  catch(e){ for(var k=0;k<16;k++) b[k] = Math.floor(Math.random()*256); }
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  var h = []; for(var i=0;i<16;i++) h.push(("0"+b[i].toString(16)).slice(-2));
  return h.slice(0,4).join("")+"-"+h.slice(4,6).join("")+"-"+h.slice(6,8).join("")+
         "-"+h.slice(8,10).join("")+"-"+h.slice(10,16).join("");
}
function ehUuid(v){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(v||"")); }

function carregarScript(src){
  return new Promise(function(ok, falha){
    var s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = function(){ ok(); };
    s.onerror = function(){ falha(new Error("cdn")); };
    document.head.appendChild(s);
    setTimeout(function(){ falha(new Error("timeout")); }, 9000);
  });
}

var nuvem = {
  ativo: false,          // a biblioteca carregou e o cliente existe
  sb: null,
  perfil: null,          // o perfil de quem está logado, no formato do app
  perfis: [],            // todos os perfis que este usuário pode ler
  motivo: "",            // por que caiu no modo local, quando cai
  espelho: {},           // última versão de cada lead já gravada no banco
  timerLeads: null,
  sincronizando: false,

  /* ---------- conexão ---------- */
  iniciar: function(){
    if(!SUPABASE_URL || SUPABASE_URL.indexOf("http") !== 0){
      nuvem.motivo = "sem-config"; return Promise.resolve(false);
    }
    var tentativa = Promise.reject();
    CDNS.forEach(function(url){
      tentativa = tentativa.catch(function(){ return carregarScript(url); });
    });
    return tentativa.then(function(){
      if(!(window.supabase && window.supabase.createClient)) throw new Error("lib");
      nuvem.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {persistSession:true, autoRefreshToken:true, storageKey:"bussola_sessao"}
      });
      nuvem.ativo = true;
      return true;
    }).catch(function(err){
      nuvem.ativo = false;
      nuvem.motivo = (err && err.message) === "timeout" ? "rede-lenta" : "sem-rede";
      return false;
    });
  },

  /* ---------- sessão ---------- */
  sessao: function(){
    if(!nuvem.ativo) return Promise.resolve(null);
    return nuvem.sb.auth.getSession()
      .then(function(r){ return (r && r.data && r.data.session) || null; })
      .catch(function(){ return null; });
  },

  entrar: function(email, senha){
    return nuvem.sb.auth.signInWithPassword({email:email, password:senha});
  },

  criarConta: function(nome, email, senha){
    return nuvem.sb.auth.signUp({
      email: email, password: senha, options:{data:{nome:nome}}
    });
  },

  sairDaConta: function(){
    if(!nuvem.ativo) return Promise.resolve();
    return nuvem.sb.auth.signOut().catch(function(){});
  },

  /* ---------- perfil e equipe ---------- */
  // Traduz uma linha de "perfis" para o formato de usuário que o app já usa,
  // então todas as telas continuam funcionando sem saber da nuvem.
  comoUsuario: function(p){
    return {
      id: p.id, nome: p.nome || "(sem nome)",
      usuario: p.email ? String(p.email).split("@")[0] : (p.nome||"").toLowerCase().replace(/\s+/g,"."),
      email: p.email || "",
      papel: p.papel || "vendedor",
      ativo: p.ativo !== false,
      criadoEm: p.criado_em || null,
      ultimoAcesso: null
    };
  },

  carregarPerfis: function(meuId){
    return nuvem.sb.from("perfis").select("*").then(function(r){
      if(r.error) throw r.error;
      nuvem.perfis = (r.data||[]).map(nuvem.comoUsuario);
      nuvem.perfil = nuvem.perfis.filter(function(u){ return u.id===meuId; })[0] || null;
      state.usuarios = nuvem.perfis;
      state.sessaoId = meuId;
      state.ultimaSessaoNuvem = meuId;   // permite seguir offline depois
      return nuvem.perfil;
    });
  },

  salvarPerfil: function(id, campos){
    return nuvem.sb.from("perfis").update(campos).eq("id", id);
  },
  removerPerfil: function(id){
    return nuvem.sb.from("perfis").delete().eq("id", id);
  },

  /* ---------- conteúdo editado pelo admin ---------- */
  carregarConteudo: function(){
    return nuvem.sb.from("conteudo").select("*").then(function(r){
      if(r.error) throw r.error;
      var c = {};
      (r.data||[]).forEach(function(row){
        if(COLECOES[row.colecao]) c[row.colecao] = row.dados;
      });
      // banco vazio (a carga ainda não foi feita) não apaga o que já veio antes
      if(Object.keys(c).length || !(state.conteudo && Object.keys(state.conteudo).length)){
        state.conteudo = c;
      }
      var maisNovo = (r.data||[]).reduce(function(a,row){
        return (row.atualizado_em||"") > a ? row.atualizado_em : a;
      }, "");
      state.conteudoAtualizadoEm = maisNovo || null;
      INDICE = null;
      return c;
    });
  },

  salvarConteudo: function(colecao, dados){
    if(!nuvem.ativo || !nuvem.perfil) return Promise.resolve();
    return nuvem.sb.from("conteudo").upsert({
      colecao: colecao, dados: dados,
      atualizado_em: nowISO(), atualizado_por: nuvem.perfil.id
    }, {onConflict:"colecao"}).then(function(r){
      if(r.error) throw r.error;
    }).catch(function(err){
      toast("Não consegui salvar na nuvem: "+(err.message||"erro"));
    });
  },

  apagarConteudo: function(colecao){
    if(!nuvem.ativo || !nuvem.perfil) return Promise.resolve();
    return nuvem.sb.from("conteudo").delete().eq("colecao", colecao)
      .catch(function(){});
  },

  /* ---------- logos dos parceiros ---------- */
  // Sobem para o Storage do Supabase, num balde público de leitura. São
  // logos de marcas — material que já é público. O que é sigiloso são as
  // comissões, e essas continuam atrás do login, na tabela conteudo.
  // Sem nuvem, a imagem vira data URI e fica só neste navegador.
  enviarLogo: function(arquivo){
    return reduzirImagem(arquivo).then(function(img){
      if(!nuvem.ativo || !nuvem.perfil) return img.dataUrl;
      var nome = "logo-" + uuid4() + "." + img.ext;
      return nuvem.sb.storage.from(BALDE_LOGOS)
        .upload(nome, img.blob, {contentType:img.mime, upsert:false, cacheControl:"31536000"})
        .then(function(r){
          if(r.error) throw r.error;
          var pub = nuvem.sb.storage.from(BALDE_LOGOS).getPublicUrl(nome);
          return (pub && pub.data && pub.data.publicUrl) || img.dataUrl;
        });
    });
  },

  apagarLogo: function(url){
    if(!nuvem.ativo || !url || url.indexOf("http") !== 0) return Promise.resolve();
    var partes = String(url).split("/" + BALDE_LOGOS + "/");
    if(partes.length < 2) return Promise.resolve();
    return nuvem.sb.storage.from(BALDE_LOGOS).remove([partes[1]]).catch(function(){});
  },

  /* ---------- atendimentos ---------- */
  paraLinha: function(l){
    return {id:l.id, dono:l.donoId, status:l.status||"Novo lead",
            dados:l, atualizado_em:l.atualizadoEm || nowISO()};
  },
  daLinha: function(row){
    var l = row.dados || {};
    l.id = row.id; l.donoId = row.dono;
    if(row.status) l.status = row.status;
    if(row.atualizado_em) l.atualizadoEm = row.atualizado_em;
    return l;
  },

  // Junta o que veio do banco com o que está neste navegador, em vez de
  // simplesmente sobrescrever: se alguém trabalhou sem conexão, o que ele
  // fez continua valendo e sobe na próxima sincronização.
  carregarLeads: function(){
    return nuvem.sb.from("leads").select("*").order("atualizado_em",{ascending:false})
      .then(function(r){
        if(r.error) throw r.error;
        var doBanco = (r.data||[]).map(nuvem.daLinha);
        var porIdBanco = {};
        doBanco.forEach(function(l){ porIdBanco[l.id] = l; });

        var meuId = nuvem.perfil ? nuvem.perfil.id : null;
        var locais = (state.leads||[]).filter(function(l){ return l.id && ehUuid(l.id); });
        var final = doBanco.slice();

        locais.forEach(function(loc){
          var srv = porIdBanco[loc.id];
          if(!srv){
            // só existe aqui: mantém se for meu (foi criado sem conexão)
            if(loc.donoId === meuId) final.push(loc);
            return;
          }
          // existe nos dois: fica a versão mais recente
          if((loc.atualizadoEm||"") > (srv.atualizadoEm||"")){
            final[final.indexOf(srv)] = loc;
          }
        });

        // completa o nome do dono a partir dos perfis já carregados
        final.forEach(function(l){
          var p = nuvem.perfis.filter(function(u){ return u.id===l.donoId; })[0];
          if(p) l.donoNome = p.nome;
        });
        final.sort(function(a,b){ return (b.atualizadoEm||"").localeCompare(a.atualizadoEm||""); });

        state.leads = final;
        // o espelho guarda só o que o banco já tem: assim o que veio de local
        // é detectado como mudança e sobe sozinho
        nuvem.espelho = {};
        doBanco.forEach(function(l){
          if(porIdBanco[l.id] === l && final.indexOf(l) > -1) nuvem.espelho[l.id] = JSON.stringify(l);
        });
        if(state.activeLeadId && !findLead(state.activeLeadId)) state.activeLeadId = null;
        return final;
      });
  },

  // Chamado por saveStateNow(): compara o que está na tela com o que já foi
  // gravado e manda ao banco só o que mudou de verdade.
  agendarSincLeads: function(){
    if(!nuvem.ativo || !nuvem.perfil) return;
    if(nuvem.timerLeads) clearTimeout(nuvem.timerLeads);
    nuvem.timerLeads = setTimeout(nuvem.sincLeads, 700);
  },

  sincLeads: function(){
    if(!nuvem.ativo || !nuvem.perfil || nuvem.sincronizando) return;
    var novos = [], atuais = {};
    (state.leads||[]).forEach(function(l){
      if(!l.id || !ehUuid(l.id)) return;      // leads antigos só sobem na migração
      var s = JSON.stringify(l);
      atuais[l.id] = s;
      if(nuvem.espelho[l.id] !== s) novos.push(l);
    });
    var apagados = Object.keys(nuvem.espelho).filter(function(id){ return !atuais[id]; });
    if(!novos.length && !apagados.length) return;

    nuvem.sincronizando = true;
    var trabalhos = [];
    if(novos.length){
      trabalhos.push(nuvem.sb.from("leads").upsert(novos.map(nuvem.paraLinha), {onConflict:"id"}));
    }
    apagados.forEach(function(id){
      trabalhos.push(nuvem.sb.from("leads").delete().eq("id", id));
    });
    Promise.all(trabalhos).then(function(res){
      var erro = res.filter(function(r){ return r && r.error; })[0];
      if(erro) throw erro.error;
      novos.forEach(function(l){ nuvem.espelho[l.id] = atuais[l.id]; });
      apagados.forEach(function(id){ delete nuvem.espelho[id]; });
    }).catch(function(err){
      toast("Não consegui sincronizar: "+((err&&err.message)||"erro de rede"));
    }).then(function(){
      nuvem.sincronizando = false;
      atualizarSelo();
    });
    atualizarSelo(true);
  },

  /* ---------- carga completa depois do login ---------- */
  abrirSessao: function(session){
    var uid_ = session.user.id;
    return nuvem.carregarPerfis(uid_).then(function(perfil){
      if(!perfil) throw new Error("sem-perfil");
      if(perfil.ativo === false) throw new Error("inativo");
      perfil.email = session.user.email || perfil.email;
      if(!state.consultorNome) state.consultorNome = perfil.nome;
      return Promise.all([nuvem.carregarConteudo(), nuvem.carregarLeads()]);
    });
  },

  /* ---------- migração do que já existe neste navegador ---------- */
  temPendente: function(){
    var m = state.migrar;
    return !!(m && ((m.leads && m.leads.length) || (m.conteudo && Object.keys(m.conteudo).length)));
  },

  guardarParaMigrar: function(){
    // roda uma única vez, no primeiro login com a nuvem ligada
    if(state.migrouEm || state.migrar) return;
    var leads = (state.leads||[]).slice();
    var conteudo = state.conteudo && Object.keys(state.conteudo).length ? clonar(state.conteudo) : null;
    if(!leads.length && !conteudo){ state.migrouEm = nowISO(); return; }
    state.migrar = {leads:leads, conteudo:conteudo, guardadoEm:nowISO()};
  },

  migrar: function(){
    var m = state.migrar || {};
    var meus = (m.leads||[]).map(function(l){
      var c = clonar(l);
      c.id = uuid4();                       // ids antigos não são uuid
      c.donoId = nuvem.perfil.id;
      c.donoNome = nuvem.perfil.nome;
      c.atualizadoEm = c.atualizadoEm || nowISO();
      return c;
    });
    var passos = [];
    if(meus.length) passos.push(nuvem.sb.from("leads").insert(meus.map(nuvem.paraLinha)));
    if(m.conteudo && ehAdmin()){
      Object.keys(m.conteudo).forEach(function(k){
        if(!COLECOES[k]) return;
        passos.push(nuvem.sb.from("conteudo").upsert({
          colecao:k, dados:m.conteudo[k], atualizado_em:nowISO(), atualizado_por:nuvem.perfil.id
        }, {onConflict:"colecao"}));
      });
    }
    return Promise.all(passos).then(function(res){
      var erro = res.filter(function(r){ return r && r.error; })[0];
      if(erro) throw erro.error;
      delete state.migrar;
      state.migrouEm = nowISO();
      saveStateNow();
      return Promise.all([nuvem.carregarConteudo(), nuvem.carregarLeads()]);
    });
  }
};

// Selo de estado no canto da barra lateral: sincronizado, salvando, ou local.
function atualizarSelo(salvando){
  var el = document.getElementById("selo");
  if(!el) return;
  if(!nuvem.ativo){
    el.className = "selo selo-local";
    el.innerHTML = ico("aviso",13)+"<span>Só neste navegador</span>";
    el.title = "A nuvem não está acessível agora. Tudo continua salvo aqui no computador.";
    return;
  }
  el.className = "selo selo-nuvem" + (salvando? " selo-ativo" : "");
  el.innerHTML = ico(salvando?"ciclo":"escudo",13)+"<span>"+(salvando? "Salvando…" : "Sincronizado")+"</span>";
  el.title = "Conectado ao banco da equipe. O que você faz aqui aparece para o gestor.";
}

function init(){
  state = loadState();
  try{ ui.tema = localStorage.getItem("bussola_tema") || "dark"; }catch(e){ ui.tema = "dark"; }
  aplicarTema();
  // nada de tela pela metade enquanto o app decide entre nuvem e modo local
  document.getElementById("app").hidden = true;
  document.getElementById("acesso").hidden = true;
  if(window.claude && typeof window.claude.use==="function"){
    window.claude.use("downloads").then(function(d){ downloadsCap = d; }).catch(function(){ downloadsCap = null; });
  }
  // Tenta a nuvem primeiro. Se ela não responder, o app abre em modo local —
  // ninguém fica parado esperando servidor.
  nuvem.iniciar().then(function(ok){
    if(!ok) return null;
    return nuvem.sessao();
  }).then(function(sessao){
    if(!sessao) return null;
    return nuvem.abrirSessao(sessao).catch(function(err){
      // sessão válida mas sem perfil ou desativada: volta para a tela de acesso
      nuvem.perfil = null;
      return nuvem.sairDaConta().then(function(){ return null; });
    });
  }).then(function(carregou){
    if(naNuvem() && nuvem.perfil){
      nuvem.guardarParaMigrar();
      saveStateNow();
      document.getElementById("acesso").hidden = true;
      entrarApp();
      return;
    }
    if(precisaSetup() || !usuarioAtual()) mostrarAcesso();
    else { document.getElementById("acesso").hidden = true; entrarApp(); }
  }).catch(function(){
    if(precisaSetup() || !usuarioAtual()) mostrarAcesso();
    else { document.getElementById("acesso").hidden = true; entrarApp(); }
  });
}
document.getElementById("acessoForm").addEventListener("submit", submeterAcesso);
init();

})();
</script>

</body>
</html>
