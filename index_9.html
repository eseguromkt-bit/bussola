<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bússola Grupo É</title>
<meta name="description" content="Ferramenta interna da equipe de expansão do Grupo É Franchising.">
<meta name="theme-color" content="#0B1437">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230075FF'/%3E%3Cstop offset='1' stop-color='%237551FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23ffffff' stroke-opacity='.4' stroke-width='4'/%3E%3Cpath d='M67 33 45 45l-12 22 22-12z' fill='%23ffffff'/%3E%3Cpath d='M67 33 55 55 45 45z' fill='%2301B574'/%3E%3C/svg%3E">

<body>
<title>Bússola Grupo É</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* =======================================================================
     SISTEMA VISUAL

     Escuro por padrão — azul-marinho profundo, cards de vidro sobre um
     brilho azul/violeta — na linha do Vision UI. O tema claro é uma
     tradução do mesmo sistema, não uma inversão automática: os mesmos
     tokens, valores pensados um a um.

     Toda cor vive em :root. Nenhum componente declara cor literal, então
     trocar de tema nunca deixa texto de um tema sobre fundo do outro.
     ======================================================================= */
  :root{
    /* --- claro --- */
    --paper:#F4F7FE;
    --glow-1:rgba(0,117,255,.10); --glow-2:rgba(117,81,255,.10);
    --card-bg:linear-gradient(127deg,rgba(255,255,255,.98) 20%,rgba(255,255,255,.92) 100%);
    --paper-raised:#FFFFFF;
    --paper-sunken:#EEF2FB;
    --ink:#1B2559; --ink-soft:#4E5E88; --ink-faint:#5D6C93;
    --border:#E2E8F5; --border-soft:#EDF1F9;
    --accent:#0075FF; --accent-2:#7551FF; --accent-strong:#0057C2;
    --accent-soft:#E4EEFF;
    --on-accent:#FFFFFF;
    --grad:linear-gradient(135deg,#0075FF 0%,#7551FF 100%);
    --grad-soft:linear-gradient(135deg,rgba(0,117,255,.12),rgba(117,81,255,.12));
    --gold:#A96A00; --gold-soft:#FFF1DC;
    --success:#048C5C; --success-soft:#DFF6EC;
    --warning:#9A6100; --warning-soft:#FFF1DC;
    --danger:#C42222; --danger-soft:#FDE6E6;
    --info:#5B3FD6; --info-soft:#EDE8FF;
    --shadow-sm:0 1px 2px rgba(27,37,89,.06);
    --shadow-md:0 12px 30px rgba(27,37,89,.10);
    --shadow-lg:0 24px 60px rgba(27,37,89,.18);
    --ring:0 0 0 3px rgba(0,117,255,.22);
    --radius-sm:12px; --radius-md:18px; --radius-lg:24px;
    --font-display:'Plus Jakarta Sans',"Segoe UI",system-ui,sans-serif;
    --font-body:'Plus Jakarta Sans',"Segoe UI",system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',"Consolas",monospace;
  }

  /* --- escuro: o padrão do projeto --- */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0B1437;
      --glow-1:rgba(0,117,255,.30); --glow-2:rgba(117,81,255,.26);
      --card-bg:linear-gradient(127deg,rgba(17,28,68,.86) 20%,rgba(11,20,55,.72) 100%);
      --paper-raised:#111C44;
      --paper-sunken:rgba(255,255,255,.06);
      --ink:#FFFFFF; --ink-soft:#B3BFDC; --ink-faint:#95A2C6;
      --border:rgba(226,232,240,.16); --border-soft:rgba(226,232,240,.09);
      --accent:#3E8BFF; --accent-2:#9A80FF; --accent-strong:#7FB4FF;
      --accent-soft:rgba(62,139,255,.18);
      --on-accent:#FFFFFF;
      --grad:linear-gradient(135deg,#0075FF 0%,#7551FF 100%);
      --grad-soft:linear-gradient(135deg,rgba(0,117,255,.24),rgba(117,81,255,.22));
      --gold:#FFB547; --gold-soft:rgba(255,181,71,.16);
      --success:#2CD99A; --success-soft:rgba(1,181,116,.18);
      --warning:#FFB547; --warning-soft:rgba(255,181,71,.15);
      --danger:#FF6B6B; --danger-soft:rgba(255,107,107,.16);
      --info:#9A80FF; --info-soft:rgba(117,81,255,.20);
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
      --shadow-md:0 14px 34px rgba(3,7,26,.5);
      --shadow-lg:0 28px 70px rgba(3,7,26,.7);
      --ring:0 0 0 3px rgba(62,139,255,.30);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B1437;
    --glow-1:rgba(0,117,255,.30); --glow-2:rgba(117,81,255,.26);
    --card-bg:linear-gradient(127deg,rgba(17,28,68,.86) 20%,rgba(11,20,55,.72) 100%);
    --paper-raised:#111C44;
    --paper-sunken:rgba(255,255,255,.06);
    --ink:#FFFFFF; --ink-soft:#B3BFDC; --ink-faint:#95A2C6;
    --border:rgba(226,232,240,.16); --border-soft:rgba(226,232,240,.09);
    --accent:#3E8BFF; --accent-2:#9A80FF; --accent-strong:#7FB4FF;
    --accent-soft:rgba(62,139,255,.18);
    --on-accent:#FFFFFF;
    --grad:linear-gradient(135deg,#0075FF 0%,#7551FF 100%);
    --grad-soft:linear-gradient(135deg,rgba(0,117,255,.24),rgba(117,81,255,.22));
    --gold:#FFB547; --gold-soft:rgba(255,181,71,.16);
    --success:#2CD99A; --success-soft:rgba(1,181,116,.18);
    --warning:#FFB547; --warning-soft:rgba(255,181,71,.15);
    --danger:#FF6B6B; --danger-soft:rgba(255,107,107,.16);
    --info:#9A80FF; --info-soft:rgba(117,81,255,.20);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 14px 34px rgba(3,7,26,.5);
    --shadow-lg:0 28px 70px rgba(3,7,26,.7);
    --ring:0 0 0 3px rgba(62,139,255,.30);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;line-height:1.55;letter-spacing:-.005em;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  /* o brilho de fundo: dois halos fixos, atrás de tudo */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(58vw 46vh at 8% -6%, var(--glow-1), transparent 70%),
      radial-gradient(52vw 44vh at 96% 2%, var(--glow-2), transparent 68%);
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;color:var(--ink);text-wrap:balance;margin:0 0 .4em;letter-spacing:-.02em;}
  p{margin:0 0 .8em;}
  a{color:var(--accent-strong);}
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--on-accent);}
  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  mark{background:var(--gold-soft);color:var(--gold);border-radius:4px;padding:0 3px;font-weight:700;}

  /* ============ Estrutura ============ */
  .app{display:flex;min-height:100vh;gap:0;}
  .sidebar{
    width:250px;flex:0 0 250px;display:flex;flex-direction:column;gap:14px;
    padding:20px 14px;position:sticky;top:0;height:100vh;
    background:var(--card-bg);
    border-right:1px solid var(--border-soft);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    /* com muitos itens de menu, em tela baixa o rodapé sairia da vista:
       a barra rola por dentro, sem arrastar a página junto */
    overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  }
  .sidebar::-webkit-scrollbar{width:6px;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
  .sidebar::-webkit-scrollbar-track{background:transparent;}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 2px;}
  .brand-mark{
    width:40px;height:40px;border-radius:13px;flex:0 0 auto;background:var(--grad);
    display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:0 6px 18px rgba(0,117,255,.35);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.2;}
  .brand-text strong{font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .brand-text span{font-size:10.5px;color:var(--ink-faint);letter-spacing:.12em;text-transform:uppercase;font-weight:700;}

  .nav{display:flex;flex-direction:column;gap:3px;}
  .nav-btn{
    display:flex;align-items:center;gap:11px;padding:7px 11px;border:none;background:transparent;
    border-radius:14px;color:var(--ink-soft);font-size:14px;font-weight:600;text-align:left;
    cursor:pointer;width:100%;transition:background .14s,color .14s;
  }
  /* o ícone mora num quadradinho: é ele que ganha o gradiente quando ativo */
  .nav-btn .ico-svg{
    flex:0 0 auto;width:30px;height:30px;padding:6px;border-radius:10px;
    background:var(--paper-sunken);color:var(--ink-faint);transition:background .14s,color .14s;
  }
  .nav-btn:hover{color:var(--ink);}
  .nav-btn:hover .ico-svg{color:var(--ink-soft);}
  .nav-btn.active{color:var(--ink);background:var(--paper-sunken);font-weight:700;}
  .nav-btn.active .ico-svg{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(0,117,255,.32);}
  .nav-sep{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:800;padding:10px 12px 3px;}

  .sidebar-search{
    display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--border);
    border-radius:999px;padding:9px 14px;background:var(--paper-sunken);color:var(--ink-faint);
    font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:border-color .14s;
  }
  .sidebar-search:hover{border-color:var(--accent);color:var(--ink-soft);}
  .sidebar-search kbd{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border);border-radius:5px;padding:1px 5px;}

  .sidebar-foot{margin-top:auto;border-top:1px solid var(--border-soft);padding-top:12px;font-size:12px;color:var(--ink-faint);}
  .selo{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.01em;line-height:1.3;}
  .selo .ico-svg{flex:none;}
  .selo-nuvem{color:var(--success);}
  .selo-local{color:var(--gold);}
  .selo-ativo{opacity:.65;}
  .theme-row{display:flex;gap:3px;background:var(--paper-sunken);border-radius:999px;padding:3px;margin-top:10px;}
  .theme-btn{flex:1;border:none;background:transparent;border-radius:999px;padding:6px 4px;font-size:11.5px;font-weight:700;color:var(--ink-faint);cursor:pointer;}
  .theme-btn.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(0,117,255,.3);}

  .main{flex:1 1 auto;min-width:0;padding:26px 32px 72px;}
  .main-inner{max-width:1180px;margin:0 auto;}
  .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .topline .row{flex-wrap:wrap;}
  .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;font-weight:800;}
  .page-title{font-size:28px;margin-bottom:4px;font-weight:800;}
  .page-sub{color:var(--ink-soft);font-size:14.5px;max-width:62ch;}

  /* ============ Botões ============ */
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;
    border:1px solid var(--border);background:var(--paper-sunken);color:var(--ink);
    font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;
    transition:border-color .14s,background .14s,transform .06s,box-shadow .14s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(0,117,255,.32);}
  .btn-primary:hover{box-shadow:0 10px 28px rgba(0,117,255,.45);border-color:transparent;}
  .btn-gold{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:9px 12px;}
  .btn-ghost:hover{background:var(--paper-sunken);color:var(--ink);}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{border-color:var(--danger);}
  .btn-sm{padding:7px 13px;font-size:12.5px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}

  /* ============ Superfícies ============ */
  .card{
    background:var(--card-bg);border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);padding:20px 22px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:var(--shadow-sm);
  }
  .grid{display:grid;gap:16px;}
  .grid-stats{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;gap:10px;align-items:center;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .section{margin-bottom:32px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .section-head h2{font-size:19px;display:flex;align-items:center;gap:9px;font-weight:800;}
  .section-head h2 .ico-svg{color:var(--accent);}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);font-size:12.5px;}
  .mono{font-family:var(--font-mono);}
  hr.sep{border:none;border-top:1px solid var(--border-soft);margin:18px 0;}

  /* ============ Números ============ */
  /* KPI: rótulo em cima, número embaixo, ícone num quadrado com gradiente */
  .kpi{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card-bg);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
    padding:16px 18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:var(--shadow-sm);
  }
  .kpi-main{min-width:0;}
  .kpi-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
  .kpi-num{font-size:27px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:3px;}
  .kpi-ico{
    width:44px;height:44px;border-radius:14px;flex:0 0 auto;background:var(--grad);color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,117,255,.3);
  }
  .kpi-ico .ico-svg{color:#fff;}

  .stat{
    background:var(--card-bg);border:1px solid var(--border-soft);border-radius:var(--radius-md);
    padding:15px 17px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  }
  .stat-num{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;display:flex;align-items:center;gap:5px;font-weight:700;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.01em;background:var(--paper-sunken);color:var(--ink-soft);}
  .pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .pill-accent{background:var(--accent-soft);color:var(--accent-strong);}
  .pill-gold{background:var(--gold-soft);color:var(--gold);}
  .pill-success{background:var(--success-soft);color:var(--success);}
  .pill-warning{background:var(--warning-soft);color:var(--warning);}
  .pill-danger{background:var(--danger-soft);color:var(--danger);}
  .pill-info{background:var(--info-soft);color:var(--info);}
  .timebadge{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap;}

  .progress-track{height:8px;border-radius:999px;background:var(--paper-sunken);overflow:hidden;}
  .progress-fill{height:100%;background:var(--grad);border-radius:999px;transition:width .3s;}
  .funnel-row{display:grid;grid-template-columns:140px 1fr 34px;align-items:center;gap:11px;font-size:13px;margin-bottom:9px;}
  .funnel-track{height:12px;border-radius:999px;background:var(--paper-sunken);overflow:hidden;}
  .funnel-fill{height:100%;border-radius:999px;background:var(--grad);}

  /* ============ Formulários ============ */
  label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=password],
  .field input[type=number],.field input[type=date],.field select,.field textarea{
    font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--ink);
    background:var(--paper-sunken);border:1px solid var(--border);border-radius:14px;
    padding:11px 14px;width:100%;transition:border-color .14s,box-shadow .14s;
  }
  .field textarea{resize:vertical;min-height:68px;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:var(--ring);outline:none;}
  .field input::placeholder,.field textarea::placeholder{color:var(--ink-faint);}
  .field .hint{font-weight:500;color:var(--ink-faint);font-size:12px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}

  .ico-svg{flex:0 0 auto;vertical-align:-.18em;}
  .seg-ico{width:36px;height:36px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;box-shadow:0 5px 14px rgba(0,117,255,.26);}
  .seg-ico .ico-svg{color:#fff;}
  .seg-ico-lg{width:48px;height:48px;border-radius:15px;}

  /* ============ Busca global ============ */
  .search-overlay{position:fixed;inset:0;z-index:80;background:rgba(4,9,30,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px 20px;}
  .search-overlay[hidden]{display:none;}
  .search-panel{width:100%;max-width:740px;background:var(--paper-raised);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:80vh;}
  .search-bar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-soft);}
  .search-bar input{flex:1;border:none;background:transparent;outline:none;font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink);min-width:0;}
  .search-bar input::placeholder{color:var(--ink-faint);font-weight:500;}
  .search-bar .ico-svg{color:var(--accent);}
  .search-esc{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);border:1px solid var(--border);border-radius:5px;padding:2px 7px;}
  .search-results{overflow-y:auto;padding:6px 0 10px;}
  .search-group{padding:12px 20px 5px;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);}
  .search-item{display:flex;align-items:flex-start;gap:12px;padding:10px 20px;cursor:pointer;border-left:3px solid transparent;}
  .search-item:hover,.search-item.sel{background:var(--paper-sunken);border-left-color:var(--accent);}
  .search-item .seg-ico{width:30px;height:30px;border-radius:10px;}
  .si-main{flex:1;min-width:0;}
  .si-title{font-weight:700;font-size:14px;line-height:1.3;}
  .si-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .si-com{font-family:var(--font-mono);font-size:12px;font-weight:600;white-space:nowrap;background:var(--gold-soft);color:var(--gold);border-radius:8px;padding:4px 9px;flex:0 0 auto;}
  .search-hint{padding:26px 20px;text-align:center;color:var(--ink-faint);font-size:13.5px;}
  .search-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px;}
  .search-foot{border-top:1px solid var(--border-soft);padding:9px 20px;font-size:11.5px;color:var(--ink-faint);display:flex;gap:16px;flex-wrap:wrap;}

  /* ============ Ramos ============ */
  .ramo-card{
    background:var(--card-bg);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
    padding:18px 20px;display:flex;flex-direction:column;gap:10px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow-sm);
  }
  .ramo-card.clickable{cursor:pointer;transition:border-color .14s,transform .12s,box-shadow .14s;}
  .ramo-card.clickable:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .ramo-top{display:flex;align-items:flex-start;gap:12px;}
  .ramo-nome{font-family:var(--font-display);font-weight:800;font-size:16.5px;line-height:1.25;letter-spacing:-.02em;}
  .ramo-marca{font-size:12.5px;color:var(--accent-strong);font-weight:700;}
  /* a comissão é o dado mais procurado: ganha destaque próprio */
  .com-badge{
    display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;
    background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;
    padding:7px 12px;flex:0 0 auto;
  }
  .cb-val{font-family:var(--font-display);font-weight:800;font-size:15.5px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .cb-lab{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);opacity:.8;font-weight:800;}
  .diff-list{display:flex;flex-wrap:wrap;gap:6px;}
  .diff-chip{background:var(--paper-sunken);color:var(--ink-soft);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;}

  /* ============ Parceiros ============ */
  .pc-card{
    background:var(--card-bg);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
    padding:18px 20px;display:flex;flex-direction:column;gap:11px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow-sm);
  }
  .pc-topo{display:flex;align-items:center;gap:13px;}
  /* fundo branco sempre: logo de marca é feita para papel, não para tela escura */
  .pc-logo{
    flex:0 0 auto;border-radius:14px;background:#FFFFFF;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:7px;
  }
  .pc-logo img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
  .pc-logo-vazia{
    background:var(--grad);color:#fff;border-color:transparent;padding:0;
    font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.02em;
  }
  .pc-nome-bloco{min-width:0;}
  .pc-nome{font-family:var(--font-display);font-weight:800;font-size:16px;line-height:1.25;letter-spacing:-.02em;}
  .pc-cat{font-size:12px;color:var(--accent-strong);font-weight:700;margin-top:2px;}
  .pc-tag{
    display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);
    background:var(--paper-sunken);color:var(--ink-soft);border-radius:999px;
    padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer;
  }
  .pc-tag:hover{border-color:var(--accent);color:var(--ink);}
  /* faixa compacta na página do segmento */
  .pc-faixa{display:flex;flex-wrap:wrap;gap:10px;}
  .pc-mini{
    display:flex;align-items:center;gap:10px;background:var(--paper-sunken);
    border:1px solid var(--border-soft);border-radius:14px;padding:8px 14px 8px 8px;
  }
  .pc-mini .pc-logo{border-radius:10px;}
  .pc-mini-nome{font-weight:700;font-size:13.5px;line-height:1.2;}
  .pc-mini-cat{font-size:11px;color:var(--ink-faint);font-weight:600;}
  /* pré-visualização do envio de logo, no formulário */
  .logo-preview{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px;}

  /* ============ Tabelas ============ */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tbl th{text-align:left;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);padding:0 8px 10px;font-weight:800;}
  .tbl td{padding:11px 8px;border-top:1px solid var(--border-soft);vertical-align:top;}
  .tbl td.num{text-align:right;font-family:var(--font-mono);white-space:nowrap;font-weight:600;color:var(--gold);}
  .tbl tr:hover td{background:var(--paper-sunken);}

  /* ============ Acordeões e blocos ============ */
  .acc{border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--card-bg);margin-bottom:10px;overflow:hidden;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
  .acc-head{display:flex;align-items:center;gap:11px;padding:14px 17px;cursor:pointer;}
  .acc-head h3{font-size:15px;margin:0;flex:1;}
  .acc-caret{color:var(--ink-faint);transition:transform .16s;}
  .acc.open .acc-caret{transform:rotate(90deg);}
  .acc-body{display:none;padding:0 19px 17px;border-top:1px solid var(--border-soft);padding-top:13px;}
  .acc.open .acc-body{display:block;}

  .script-block{background:var(--paper-sunken);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:13px 15px;font-size:13.8px;white-space:pre-wrap;color:var(--ink-soft);margin-bottom:10px;}
  .callout{display:flex;gap:10px;align-items:flex-start;padding:12px 15px;border-radius:var(--radius-sm);font-size:13.2px;line-height:1.5;margin-bottom:13px;}
  .callout .ico-svg{margin-top:2px;}
  .callout-warn{background:var(--warning-soft);color:var(--warning);}
  .callout-danger{background:var(--danger-soft);color:var(--danger);}
  .callout-info{background:var(--info-soft);color:var(--info);}
  .callout-accent{background:var(--accent-soft);color:var(--accent-strong);}

  /* ============ Etapas do atendimento ============ */
  .etapa{border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--card-bg);margin-bottom:10px;overflow:hidden;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
  .etapa.done{border-color:var(--success);}
  .etapa.atual{border-color:var(--accent);box-shadow:var(--ring);}
  .etapa-head{display:flex;align-items:center;gap:13px;padding:14px 17px;cursor:pointer;user-select:none;}
  .etapa-check{width:26px;height:26px;border-radius:9px;flex:0 0 auto;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;font-weight:700;background:var(--paper-sunken);}
  .etapa.done .etapa-check{background:var(--success);border-color:var(--success);color:#fff;}
  .etapa-num{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);flex:0 0 auto;width:18px;}
  .etapa-title{font-weight:700;font-size:14.5px;flex:1 1 auto;}
  .etapa-caret{color:var(--ink-faint);font-size:12px;transition:transform .16s;flex:0 0 auto;}
  .etapa.open .etapa-caret{transform:rotate(90deg);}
  .etapa-body{display:none;padding:0 19px 19px 56px;border-top:1px solid var(--border-soft);padding-top:15px;}
  .etapa.open .etapa-body{display:block;}
  .aqui{background:var(--grad);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 9px;}

  /* ============ Lista de candidatos ============ */
  .lead-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--card-bg);cursor:pointer;margin-bottom:8px;transition:border-color .14s,transform .1s;}
  .lead-item:hover{border-color:var(--accent);transform:translateX(2px);}
  .lead-item.active{border-color:var(--accent);background:var(--accent-soft);}
  .lead-avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:13px;color:#fff;flex:0 0 auto;}
  .lead-main{flex:1 1 auto;min-width:0;}
  .lead-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lead-meta{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ============ Modal e avisos ============ */
  .modal-overlay{position:fixed;inset:0;background:rgba(4,9,30,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:85;}
  .modal-overlay[hidden]{display:none;}
  .modal{background:var(--paper-raised);border-radius:var(--radius-lg);max-width:660px;width:100%;max-height:86vh;overflow:auto;box-shadow:var(--shadow-lg);border:1px solid var(--border);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:var(--paper-raised);z-index:2;}
  .modal-head h3{margin:0;font-size:16.5px;}
  .modal-close{background:none;border:none;font-size:22px;color:var(--ink-faint);cursor:pointer;line-height:1;padding:4px;}
  .modal-body{padding:20px 22px;}
  .modal-body #previewText{width:100%;min-height:220px;font-family:var(--font-mono);font-size:13px;padding:13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--paper-sunken);color:var(--ink);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:0 12px 32px rgba(0,117,255,.4);z-index:95;}
  .toast[hidden]{display:none;}
  .empty{text-align:center;padding:46px 22px;color:var(--ink-faint);border:1px dashed var(--border);border-radius:var(--radius-lg);background:var(--paper-sunken);}
  .empty .btn{margin-top:14px;}

  .tag-row{display:flex;gap:7px;flex-wrap:wrap;}
  .tag-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--paper-sunken);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:border-color .14s;}
  .tag-btn .ico-svg{color:var(--ink-faint);}
  .tag-btn:hover{border-color:var(--accent);}
  .tag-btn.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 5px 14px rgba(0,117,255,.3);}
  .tag-btn.active .ico-svg{color:currentColor;}

  .status-select{border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;background:var(--paper-sunken);color:var(--ink);}
  .split{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start;}
  .split > *{min-width:0;}
  .followup-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
  .followup-row:last-child{border-bottom:none;}

  /* ============ Calculadora ============ */
  .calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .calc-box{border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--grad-soft);padding:16px 18px;}
  .calc-label{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:7px;}
  .calc-big{font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.03em;}
  .calc-unit{font-size:13px;font-weight:600;color:var(--ink-faint);margin-left:4px;}
  .calc-sub{font-size:12.5px;color:var(--ink-soft);margin-top:7px;}

  .modelo-card{border:1px solid var(--border-soft);border-radius:var(--radius-lg);background:var(--card-bg);padding:20px 22px;display:flex;flex-direction:column;gap:11px;cursor:pointer;transition:border-color .14s,transform .12s;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
  .modelo-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .modelo-card.sel{border-color:var(--accent);box-shadow:var(--ring);}
  .modelo-taxa{font-family:var(--font-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;}
  .kv dt{color:var(--ink-faint);}
  .kv dd{margin:0;font-weight:700;}

  /* ============ Tela de acesso ============ */
  /* Duas colunas no desktop: o formulário à esquerda, um painel de marca à
     direita. No celular vira só o formulário. */
  .acesso{position:fixed;inset:0;z-index:92;background:var(--paper);display:flex;overflow-y:auto;}
  .acesso[hidden]{display:none;}
  .acesso-lado{
    flex:1 1 50%;display:none;position:relative;overflow:hidden;
    background:linear-gradient(150deg,#0075FF 0%,#7551FF 55%,#4B2FA8 100%);
    color:#fff;padding:48px;flex-direction:column;justify-content:center;
  }
  .acesso-lado::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(50% 50% at 78% 18%, rgba(255,255,255,.22), transparent 62%);
  }
  .acesso-lado-inner{position:relative;z-index:1;max-width:26rem;}
  .acesso-lado h2{color:#fff;font-size:32px;font-weight:800;line-height:1.2;margin-bottom:14px;}
  .acesso-lado p{color:rgba(255,255,255,.86);font-size:15px;line-height:1.6;}
  .acesso-lado ul{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:12px;}
  .acesso-lado li{display:flex;align-items:flex-start;gap:11px;font-size:14.5px;color:rgba(255,255,255,.94);}
  .acesso-lado li .ico-svg{flex:none;margin-top:2px;opacity:.9;}
  .acesso-form{flex:1 1 100%;display:flex;align-items:center;justify-content:center;padding:28px 24px;}
  .acesso-card{width:100%;max-width:400px;}
  .acesso-mark{width:52px;height:52px;border-radius:17px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:20px;box-shadow:0 10px 26px rgba(0,117,255,.4);}
  .acesso-titulo{font-size:27px;margin-bottom:6px;font-weight:800;}
  .acesso-sub{color:var(--ink-soft);font-size:14.5px;margin-bottom:22px;line-height:1.55;}
  .acesso-erro{color:var(--danger);font-size:13px;font-weight:700;margin:12px 0 0;background:var(--danger-soft);padding:10px 13px;border-radius:12px;}
  .acesso-erro[hidden]{display:none;}
  .acesso-card .field{margin-bottom:13px;}
  .acesso-aviso{margin:18px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-faint);text-align:center;}
  @media (min-width:900px){
    .acesso-lado{display:flex;}
    .acesso-form{flex:1 1 50%;padding:40px;}
  }

  /* ============ Administração ============ */
  .adm-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
  .linha-item{
    display:flex;align-items:center;gap:13px;padding:13px 16px;border:1px solid var(--border-soft);
    border-radius:var(--radius-md);background:var(--card-bg);margin-bottom:8px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  }
  .linha-main{flex:1;min-width:0;}
  .linha-tit{font-weight:700;font-size:14px;}
  .linha-sub{font-size:12.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .linha-acoes{display:flex;gap:7px;flex:0 0 auto;}
  .badge-edit{background:var(--warning-soft);color:var(--warning);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;}

  /* ============ Navegação móvel ============ */
  .mtop, .bnav, .sheet-overlay{display:none;}
  .mtop-mark{width:32px;height:32px;border-radius:10px;flex:0 0 auto;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;}
  .mtop-title{flex:1;min-width:0;font-family:var(--font-display);font-weight:800;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em;}
  .mtop-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--border);background:var(--paper-sunken);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .bnav-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:transparent;color:var(--ink-faint);font-size:10px;font-weight:700;cursor:pointer;padding:7px 2px 6px;}
  .bnav-btn .ico-svg{transition:color .14s;}
  .bnav-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .bnav-btn.active{color:var(--accent-strong);}
  .bnav-btn.active .ico-svg{color:var(--accent);}
  .sheet{background:var(--paper-raised);border-radius:26px 26px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);width:100%;max-width:560px;border-top:1px solid var(--border);}
  .sheet-grip{width:40px;height:4px;border-radius:99px;background:var(--border);margin:5px auto 12px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;}
  .sheet-list{display:flex;flex-direction:column;gap:3px;}
  .sheet-item{display:flex;align-items:center;gap:13px;width:100%;min-height:52px;padding:10px 12px;border:none;background:transparent;border-radius:14px;color:var(--ink);font-size:15px;font-weight:600;text-align:left;cursor:pointer;}
  .sheet-item .ico-svg{width:30px;height:30px;padding:6px;border-radius:10px;background:var(--paper-sunken);color:var(--ink-faint);}
  .sheet-item:hover,.sheet-item.active{background:var(--paper-sunken);}
  .sheet-item.active .ico-svg{background:var(--grad);color:#fff;}
  .sheet-tema{border-top:1px solid var(--border-soft);margin-top:12px;padding-top:14px;}

  /* ============ Desktop largo ============ */
  @media (min-width:1201px){
    .main{padding:28px 40px 72px;}
  }

  /* ============ Laptop / tablet: sidebar vira trilho de ícones ============ */
  @media (min-width:761px) and (max-width:1200px){
    .sidebar{width:80px;flex:0 0 80px;padding:18px 12px;align-items:center;}
    .brand{padding:2px 0 6px;justify-content:center;}
    .brand-text,.nav-sep,.sidebar-foot{display:none;}
    .nav{width:100%;}
    .nav-btn{justify-content:center;padding:5px 0;gap:0;}
    .nav-btn span{display:none;}
    .nav-btn.active{background:transparent;}
    .sidebar-search{justify-content:center;padding:12px 0;}
    .sidebar-search span,.sidebar-search kbd{display:none;}
    .theme-row{flex-direction:column;border-radius:16px;width:100%;}
    .theme-btn{font-size:10.5px;padding:7px 2px;}
    .main{padding:24px 24px 62px;}
    .split{grid-template-columns:260px 1fr;}
  }
  @media (max-width:1000px){ .split{grid-template-columns:1fr;} }

  /* ============ Celular ============ */
  @media (max-width:760px){
    .sidebar{display:none;}
    .app{display:block;}
    .main{padding:14px 15px calc(86px + env(safe-area-inset-bottom));}

    .mtop{
      display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;
      background:var(--card-bg);border-bottom:1px solid var(--border-soft);
      backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
      padding:10px 15px;padding-top:calc(10px + env(safe-area-inset-top));
    }
    .bnav{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
      background:var(--card-bg);border-top:1px solid var(--border-soft);
      backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
      padding:2px 4px calc(2px + env(safe-area-inset-bottom));
    }
    .sheet-overlay{
      display:flex;position:fixed;inset:0;z-index:88;background:rgba(4,9,30,.6);
      align-items:flex-end;justify-content:center;
    }
    .sheet-overlay[hidden]{display:none;}

    .topline{gap:12px;margin-bottom:18px;}
    .page-title{font-size:23px;}
    .page-sub{font-size:14px;}
    .section{margin-bottom:24px;}
    .card{padding:16px 17px;border-radius:var(--radius-md);}
    .btn{min-height:44px;padding:11px 17px;}
    .btn-sm{min-height:38px;padding:8px 13px;font-size:13px;}
    .tag-btn{min-height:38px;padding:8px 14px;}
    .status-select,.field select,.field input,.field textarea{min-height:46px;font-size:16px;} /* 16px evita o zoom do iOS */
    .modal-close{min-width:44px;min-height:44px;}

    .grid-2,.grid-3,.form-grid,.calc-out{grid-template-columns:1fr;}
    .grid-stats{grid-template-columns:1fr 1fr;gap:11px;}
    .kpi{padding:13px 14px;border-radius:var(--radius-md);}
    .kpi-label{font-size:10px;letter-spacing:.04em;white-space:nowrap;}
    .kpi-num{font-size:22px;}

function clonar(v){ return JSON.parse(JSON.stringify(v)); }

var db = {
  get:function(nome){
    if(state && state.conteudo && state.conteudo[nome] != null) return state.conteudo[nome];
    return COLECOES[nome].base();
  },
  set:function(nome, valor){
    if(!state.conteudo) state.conteudo = {};
    state.conteudo[nome] = valor;
    state.conteudoAtualizadoEm = nowISO();
    saveStateNow();
    INDICE = null;              // o índice de busca precisa ser reconstruído
    // com a nuvem ligada, a edição vale para o time inteiro na hora
    if(typeof nuvem !== "undefined" && nuvem.ativo && nuvem.perfil){
      atualizarSelo(true);
      nuvem.salvarConteudo(nome, valor).then(function(){ atualizarSelo(); });
    }
  },
  editado:function(nome){ return !!(state.conteudo && state.conteudo[nome] != null); },
  restaurar:function(nome){
    if(state.conteudo) delete state.conteudo[nome];
    saveStateNow(); INDICE = null;
    if(typeof nuvem !== "undefined" && nuvem.ativo && nuvem.perfil) nuvem.apagarConteudo(nome);
  },
  // grava dentro de uma coleção-lista, casando pelo id
  // Enquanto a coleção está mostrando dados de exemplo, a primeira edição
  // começa do zero: senão o item fictício ficaria gravado junto com o real.
  listaParaEditar:function(nome){
    if(db.editado(nome)) return clonar(db.get(nome));
    return [];
  },
  upsertItem:function(nome, item){
    var lista = db.listaParaEditar(nome);
    var i = lista.findIndex(function(x){ return x.id===item.id; });
    if(i>-1) lista[i] = item; else lista.push(item);
    db.set(nome, lista);
  },
  removerItem:function(nome, id){
    var lista = db.listaParaEditar(nome).filter(function(x){ return x.id!==id; });
    db.set(nome, lista);
  }
};

function sha256(msg){
  function rotr(n,x){ return (x>>>n)|(x<<(32-n)); }
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes=[], i;
  var t = unescape(encodeURIComponent(msg));
  for(i=0;i<t.length;i++) bytes.push(t.charCodeAt(i)&0xff);
  var bitLen = bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56) bytes.push(0);
  for(i=7;i>=0;i--) bytes.push((bitLen/Math.pow(2,i*8))&0xff);
  var w=new Array(64);
  for(var off=0; off<bytes.length; off+=64){
    for(i=0;i<16;i++) w[i]=(bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3];
    for(i=16;i<64;i++){
      var s0=rotr(7,w[i-15])^rotr(18,w[i-15])^(w[i-15]>>>3);
      var s1=rotr(17,w[i-2])^rotr(19,w[i-2])^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var S1=rotr(6,e)^rotr(11,e)^rotr(25,e), ch=(e&f)^((~e)&g);
      var t1=(h+S1+ch+K[i]+w[i])|0;
      var S0=rotr(2,a)^rotr(13,a)^rotr(22,a), maj=(a&b)^(a&c)^(b&c);
      var t2=(S0+maj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){ return ("00000000"+(x>>>0).toString(16)).slice(-8); }).join("");
}

function tryCopy(text){
  function fb(){
    try{
      var ta=document.createElement("textarea"); ta.value=text;
      ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      toast("Copiado.");
    }catch(e){ toast("Não foi possível copiar. Selecione o texto manualmente."); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("Copiado."); }).catch(fb);
  } else fb();
}

function normalizar(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9%\s.,-]/g," ");
}

var VAZIAS = ["de","da","do","das","dos","e","a","o","as","os","em","no","na","nos","nas",
              "um","uma","uns","umas","para","por","com","que","ao","aos","the"];
function termosUteis(q){
  var t = q.split(/\s+/).filter(Boolean);
  var f = t.filter(function(x){ return VAZIAS.indexOf(x) === -1; });
  return f.length ? f : t;   // se sobrou nada, usa os originais
}

         sub:"Use: "+t.usar, tags:"conformidade proibido evitar promessa "+t.usar, acao:{view:"grupo"}});
  });
  INSTITUCIONAL().fatos.forEach(function(f){
    add({tipo:"Dado", grupo:"O Grupo É", ico:"predio", titulo:f.rotulo+": "+f.valor,
         sub:f.nota||"Dado institucional do Grupo É.", tags:"institucional dado "+f.rotulo,
         acao:{view:"grupo"}});
  });
  return ix;
}

function buscar(termo){
  if(!INDICE) INDICE = construirIndice();
  var q = normalizar(termo).trim();
  if(!q) return [];
  var termos = termosUteis(q);
  var out = [];
  INDICE.forEach(function(it){
    var score = 0, tituloNorm = normalizar(it.titulo);
    for(var i=0;i<termos.length;i++){
      var t = termos[i];
      if(it.busca.indexOf(t) === -1) return;         // todos os termos precisam existir
      if(tituloNorm.indexOf(t) === 0) score += 60;   // título começa com o termo
      else if(tituloNorm.indexOf(t) > -1) score += 40;
      else score += 10;
    }
    if(it.tipo==="Ramo") score += 25;                // segmentos primeiro, como pedido
    else if(it.tipo==="Produto") score += 18;
    else if(it.tipo==="Modelo" || it.tipo==="Franquia focada") score += 12;
    it._s = score; out.push(it);
  });
  out.sort(function(a,b){ return b._s - a._s || a.titulo.localeCompare(b.titulo); });
  return out.slice(0, 40);
}

function realce(texto, termo){
  var q = normalizar(termo).trim();
  if(!q) return esc(texto);
  var termos = termosUteis(q).filter(function(t){ return t.length>1; });
  var src = String(texto), norm = normalizar(src), marcas = [];
  termos.forEach(function(t){
    var from = 0, i;
    while((i = norm.indexOf(t, from)) > -1){ marcas.push([i, i+t.length]); from = i + t.length; }
  });
  if(!marcas.length) return esc(src);
  marcas.sort(function(a,b){ return a[0]-b[0]; });
  var merged = [], cur = marcas[0];
  for(var k=1;k<marcas.length;k++){
    if(marcas[k][0] <= cur[1]) cur[1] = Math.max(cur[1], marcas[k][1]);
    else { merged.push(cur); cur = marcas[k]; }
  }
  merged.push(cur);
  var out = "", pos = 0;
  merged.forEach(function(m){
    out += esc(src.slice(pos, m[0])) + "<mark>" + esc(src.slice(m[0], m[1])) + "</mark>";
    pos = m[1];
  });
  return out + esc(src.slice(pos));
}

function abrirBusca(pre){
  var ov = document.getElementById("searchOverlay");

  ov.hidden = false;

function fecharBusca(){ document.getElementById("searchOverlay").hidden = true; }

function renderBusca(){
  var termo = document.getElementById("searchInput").value;
  ui.buscaTermo = termo;
  var box = document.getElementById("searchResults");
  var res = buscar(termo);
  if(!termo.trim()){
    box.innerHTML = '<div class="search-hint">Busque por segmento, produto, comissão, script ou objeção.'+
      '<div class="search-chips">'+SUGESTOES().map(function(s){
        return '<button class="tag-btn" data-action="busca-sugestao" data-q="'+esc(s)+'">'+esc(s)+"</button>";
      }).join("")+"</div></div>";
    return;
  }
  if(!res.length){
    box.innerHTML = '<div class="search-hint">Nada encontrado para <b>'+esc(termo)+"</b>.<br>Tente outro termo, como o nome do produto ou do segmento.</div>";
    return;
  }
  // agrupa mantendo a ordem de relevância: cada cabeçalho aparece uma única vez
  var ordemGrupos = [], porGrupo = {};
  res.forEach(function(it){
    if(!porGrupo[it.grupo]){ porGrupo[it.grupo] = []; ordemGrupos.push(it.grupo); }
    porGrupo[it.grupo].push(it);
  });
  var ordenados = [];
  ordemGrupos.forEach(function(g){ porGrupo[g].forEach(function(it){ ordenados.push(it); }); });
  if(ui.buscaSel >= ordenados.length) ui.buscaSel = 0;

  var html = "", idx = 0;
  ordemGrupos.forEach(function(g){
    html += '<div class="search-group">'+esc(g)+"</div>";
    porGrupo[g].forEach(function(it){
      html += '<div class="search-item'+(idx===ui.buscaSel?" sel":"")+'" data-action="busca-abrir" data-i="'+idx+'">'+
        '<span class="seg-ico">'+ico(it.ico||"grade",15)+"</span>"+
        '<span class="si-main"><span class="si-title">'+realce(it.titulo,termo)+"</span>"+
        '<span class="si-sub">'+realce(it.sub||"",termo)+"</span></span>"+
        (it.com? '<span class="si-com">'+esc(it.com)+"</span>" : "")+
        "</div>";
      idx++;
    });
  });
  box.innerHTML = html;
  ui._resBusca = ordenados;
}

function abrirResultado(i){
  var res = ui._resBusca || [];
  var it = res[i];
  if(!it) return;
  fecharBusca();
  var a = it.acao || {};
  ui.view = a.view || "inicio";
  if(a.ramo){ ui.ramoAberto = a.ramo; ui.openAcc["com-"+a.ramo] = true; }
  if(a.script){ var sc = scriptById(a.script); if(sc){ ui.scriptCat = sc.cat; ui.openAcc["sc-"+a.script] = true; } }
  if(a.objecao){ ui.scriptCat = "Objeções"; ui.openAcc["ob-"+a.objecao] = true; }
  render();
  setTimeout(function(){
    var alvo = a.ramo ? document.querySelector('[data-ramo-anchor="'+a.ramo+'"]')
             : a.script ? document.querySelector('[data-acc-key="sc-'+a.script+'"]')
             : a.objecao ? document.querySelector('[data-acc-key="ob-'+a.objecao+'"]') : null;
    if(alvo) alvo.scrollIntoView({behavior:"smooth", block:"center"});
  }, 60);
}

function navBusca(delta){
  var res = ui._resBusca || [];
  if(!res.length) return;
  ui.buscaSel = (ui.buscaSel + delta + res.length) % res.length;
  renderBusca();
  var el = document.querySelector(".search-item.sel");
  if(el) el.scrollIntoView({block:"nearest"});
}

// Logo do parceiro, com recuo para a inicial quando não há imagem — ou
// quando ela falha em carregar, o que acontece se o balde não existir.
function logoParceiro(pc, tam){
  tam = tam || 52;
  var estilo = 'width:'+tam+'px;height:'+tam+'px;';
  if(pc.logo){
    return '<span class="pc-logo" style="'+estilo+'">'+
      '<img src="'+esc(pc.logo)+'" alt="'+esc(pc.nome)+'" loading="lazy" '+
      'onerror="this.parentNode.innerHTML=\''+esc(iniciaisDe(pc.nome))+'\';this.parentNode.classList.add(\'pc-logo-vazia\');"></span>';
  }
  return '<span class="pc-logo pc-logo-vazia" style="'+estilo+'">'+esc(iniciaisDe(pc.nome))+"</span>";
}
function iniciaisDe(nome){
  var partes = String(nome||"?").trim().split(/\s+/);
  return ((partes[0]||"")[0] || "?").toUpperCase() +
         (partes.length>1 ? (partes[partes.length-1][0]||"").toUpperCase() : "");
}

function cardParceiro(pc, comRamos){
  var ramos = (pc.ramos||[]).map(ramoById).filter(Boolean);
  return '<div class="pc-card">'+
    '<div class="pc-topo">'+logoParceiro(pc)+
      '<div class="pc-nome-bloco"><div class="pc-nome">'+esc(pc.nome)+"</div>"+
      (pc.categoria? '<div class="pc-cat">'+esc(pc.categoria)+"</div>":"")+
      "</div></div>"+
    (pc.resumo? '<p class="muted" style="font-size:13.2px;margin:0;">'+esc(pc.resumo)+"</p>":"")+
    ((pc.destaques||[]).length? '<div class="diff-list">'+pc.destaques.map(function(d){
        return '<span class="diff-chip">'+esc(d)+"</span>"; }).join("")+"</div>":"")+
    (pc.observacao? '<p class="faint" style="margin:0;">'+esc(pc.observacao)+"</p>":"")+
    '<div class="row-between" style="margin-top:auto;padding-top:4px;flex-wrap:wrap;gap:8px;">'+
      (comRamos && ramos.length
        ? '<div class="row" style="gap:6px;flex-wrap:wrap;">'+ramos.map(function(r){
            return '<button class="pc-tag" data-action="abrir-ramo" data-id="'+r.id+'">'+
              ico(r.icone,12)+esc(r.nome)+"</button>"; }).join("")+"</div>"

      (pc.site? '<a class="btn btn-sm btn-ghost" href="'+esc(pc.site)+'" target="_blank" rel="noopener noreferrer">Site ↗</a>':"")+
    "</div></div>";

// Lê o que está na tela de volta para o ramo. Chamada antes de qualquer
// operação que redesenhe o modal, para não perder o que foi digitado.
function lerDetalhesDoForm(r){
  var atual = ramoById(r.id); if(!atual) return;
  var copia = clonar(atual);
  var blocos = document.querySelectorAll("[data-det]");
  if(!blocos.length) return;
  var novos = [];
  Array.prototype.forEach.call(blocos, function(b){
    var i = b.dataset.det;
    var t = document.getElementById("det_t_"+i), x = document.getElementById("det_x_"+i);
    novos.push({titulo: t? t.value.trim() : "", texto: x? x.value.trim() : "", icone:"livro"});
  });
  copia.detalhes = novos.filter(function(d){ return d.titulo || d.texto; });
  db.upsertItem("ramos", copia);
}

   ========================================================================= */
function CALC_PRODUTOS(){ return db.get("calcProdutos"); }
function QUALIFICACAO(){ return db.get("qualificacao"); }
function PERGUNTAS_DIAGNOSTICO(){ return db.get("perguntas"); }
function RECOMENDACOES(){ return db.get("recomendacoes"); }
function calcProd(id){ var L=CALC_PRODUTOS(); for(var i=0;i<L.length;i++) if(L[i].id===id) return L[i]; return null; }

function brl(v){ if(!isFinite(v)) v=0; return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:2}); }
function numOf(id){
  var el=document.getElementById(id); if(!el) return 0;
  var raw=String(el.value||"").replace(/\./g,"").replace(",",".").replace(/[^\d.]/g,"");
  var n=parseFloat(raw); return isFinite(n)?n:0;
}
function faixa(min,max){
  if(Math.abs(max-min)<0.005) return brl(max);
  if(min<0.005) return "até "+brl(max);
  return brl(min)+" a "+brl(max);
}
function calcular(prod,v){
  var qtd = v.qtd>0? v.qtd : 1, r={aVistaMin:0,aVistaMax:0,mensalMin:0,mensalMax:0};
  if(prod.tipo==="percent"){ r.aVistaMin=v.base*qtd*(prod.min/100); r.aVistaMax=v.base*qtd*(prod.max/100); }
  else if(prod.tipo==="mensal"){
    var tot=v.base*qtd;
    r.aVistaMin=r.aVistaMax=tot*(prod.agenc/100);
    r.mensalMin=tot*(prod.recMin/100); r.mensalMax=tot*(prod.recMax/100);
  }
  else if(prod.tipo==="volume"){ r.mensalMin=v.base*(prod.min/100); r.mensalMax=v.base*(prod.max/100); }
  else if(prod.tipo==="margem"){ r.mensalMin=r.mensalMax=Math.max(0,(v.preco-v.base))*qtd; }
  var roy=(v.roy||0)/100;
  r.lvMin=r.aVistaMin*(1-roy); r.lvMax=r.aVistaMax*(1-roy);
  r.lmMin=r.mensalMin*(1-roy); r.lmMax=r.mensalMax*(1-roy);
  return r;
}
function calcVals(){
  if(!document.getElementById("calcBase")){
    return {base:parseFloat(String(ui.calc.base||"0").replace(",","."))||0,
            preco:parseFloat(String(ui.calc.preco||"0").replace(",","."))||0,
            qtd:parseFloat(String(ui.calc.qtd||"1").replace(",","."))||1,
            roy:ui.calc.roy||25};
  }
  return {base:numOf("calcBase"), preco:numOf("calcPreco"), qtd:numOf("calcQtd")||1, roy:numOf("calcRoy")||0};
}
function calcResultado(prod){
  var v=calcVals(), r=calcular(prod,v), out='<div class="calc-out">';
  if(r.aVistaMax>0){
    out += '<div class="calc-box"><div class="calc-label">'+ico("raio",14)+"Comissão à vista</div>"+
      '<div class="calc-big">'+faixa(r.aVistaMin,r.aVistaMax)+"</div>"+
      '<div class="calc-sub">Já com royalties de '+v.roy+"%: <b>"+faixa(r.lvMin,r.lvMax)+"</b></div></div>";
  }
  if(r.mensalMax>0){
    out += '<div class="calc-box"><div class="calc-label">'+ico("ciclo",14)+"Renda recorrente</div>"+
      '<div class="calc-big">'+faixa(r.mensalMin,r.mensalMax)+'<span class="calc-unit">/mês</span></div>'+
      '<div class="calc-sub">Já com royalties: <b>'+faixa(r.lmMin,r.lmMax)+"/mês</b> · 12 meses: "+faixa(r.lmMin*12,r.lmMax*12)+"</div></div>";
  }
  if(!r.aVistaMax && !r.mensalMax) out += '<div class="empty" style="padding:22px;">Preencha os valores para ver a estimativa.</div>';
  return out+"</div>";
}
function atualizarCalc(){
  var p=calcProd(ui.calc.produto); if(!p) return;
  ui.calc.base=(document.getElementById("calcBase")||{}).value||"";
  ui.calc.preco=(document.getElementById("calcPreco")||{}).value||"";
  ui.calc.qtd=(document.getElementById("calcQtd")||{}).value||"1";
  ui.calc.roy=numOf("calcRoy")||25;
  var b=document.getElementById("calcResultado"); if(b) b.innerHTML=calcResultado(p);
}
function renderCalcWidget(){
  if(!ui.calc.produto) ui.calc.produto = (CALC_PRODUTOS()[0]||{}).id;
  if(ui.calc.roy==null){
    var l=activeLead(), m=l&&l.modeloRecomendado? modeloById(l.modeloRecomendado):null;

  }
  var prod=calcProd(ui.calc.produto)||CALC_PRODUTOS()[0];
  var cats=[]; CALC_PRODUTOS().forEach(function(p){ if(cats.indexOf(p.cat)<0) cats.push(p.cat); });
  var opts=cats.map(function(c){
    return '<optgroup label="'+esc(c)+'">'+CALC_PRODUTOS().filter(function(p){return p.cat===c;}).map(function(p){
      return '<option value="'+esc(p.id)+'"'+(p.id===prod.id?" selected":"")+">"+esc(p.nome)+"</option>"; }).join("")+"</optgroup>";
  }).join("");

  var campos='<label class="field">'+esc(prod.base)+'<input type="text" inputmode="decimal" id="calcBase" value="'+esc(ui.calc.base||"")+'" placeholder="0,00" data-calc="1"></label>';
  if(prod.tipo==="margem") campos+='<label class="field">'+esc(prod.preco)+'<input type="text" inputmode="decimal" id="calcPreco" value="'+esc(ui.calc.preco||"")+'" placeholder="0,00" data-calc="1"></label>';
  if(prod.tipo!=="volume") campos+='<label class="field">'+esc(prod.qtd||"Quantidade de vendas")+'<input type="text" inputmode="numeric" id="calcQtd" value="'+esc(ui.calc.qtd||"1")+'" placeholder="1" data-calc="1"></label>';
  campos+='<label class="field">Seu royalty<select id="calcRoy" data-calc="1">'+MODELOS().map(function(m){
    return '<option value="'+m.royaltyPct+'"'+(Number(ui.calc.roy)===m.royaltyPct?" selected":"")+">"+esc(m.nome)+" — "+m.royaltyPct+"%</option>"; }).join("")+"</select></label>";

  var dica = prod.tipo==="mensal" ? "Agenciamento de "+prod.agenc+"% da mensalidade (à vista) + recorrência de até "+prod.recMax+"% todo mês, enquanto o contrato durar."
    : prod.tipo==="volume" ? "Rebate de "+String(prod.min).replace(".",",")+"% a "+String(prod.max).replace(".",",")+"% sobre o volume transacionado por mês."
    : prod.tipo==="margem" ? "Você paga o custo base e define o preço. Custos disponíveis: "+prod.custos.map(brl).join(" · ")+"."
    : "Comissão de "+String(prod.min).replace(".",",")+"% a "+String(prod.max).replace(".",",")+"% sobre o valor, paga à vista.";

  return '<div class="calc-wrap" id="calcWrap">'+
    '<div class="form-grid" style="margin-bottom:4px;">'+
    '<label class="field">Produto<select id="calcProduto" data-action="calc-produto">'+opts+"</select></label>"+campos+"</div>"+
    '<p class="faint" style="margin:2px 0 14px;">'+esc(dica)+"</p>"+
    '<div id="calcResultado">'+calcResultado(prod)+"</div>"+
    '<div class="row" style="justify-content:flex-end;margin-top:12px;"><button class="btn btn-sm" data-action="copiar-simulacao">'+ico("balao",14)+"Copiar simulação</button></div>"+
    callout("warn","aviso","Estimativa com base nas comissões da tabela. <b>Não é promessa de faturamento ou lucro</b> — o resultado depende de produção, mix, carteira e execução.")+
  "</div>";
}
function textoSimulacao(){
  var p=calcProd(ui.calc.produto); if(!p) return "";
  var v=calcVals(), r=calcular(p,v), L=["Simulação — "+p.nome+" ("+p.cat+")", p.base+": "+brl(v.base)];
  if(p.tipo==="margem") L.push(p.preco+": "+brl(v.preco));
  if(p.tipo!=="volume") L.push((p.qtd||"Quantidade")+": "+v.qtd);
  if(r.aVistaMax>0){ L.push(""); L.push("Comissão à vista: "+faixa(r.aVistaMin,r.aVistaMax)); L.push("Já com royalties ("+v.roy+"%): "+faixa(r.lvMin,r.lvMax)); }
  if(r.mensalMax>0){ L.push(""); L.push("Renda recorrente: "+faixa(r.mensalMin,r.mensalMax)+"/mês"); L.push("Já com royalties: "+faixa(r.lmMin,r.lmMax)+"/mês · 12 meses: "+faixa(r.lmMin*12,r.lmMax*12)); }
  L.push(""); L.push("Estimativa com base nas comissões da tabela. Não é promessa de faturamento ou lucro.");
  return L.join("\n");
}

      '<div class="row-between" style="margin-bottom:10px;flex-wrap:wrap;gap:10px;">'+

      '<button class="btn btn-ghost btn-sm" data-action="editar-lead" data-id="'+l.id+'">Editar</button>'+

      '<div class="progress-track"><div class="progress-fill" id="progressFill" style="width:'+pct+'%;"></div></div>'+

      '<span class="faint">Nota: <b class="mono">'+(l.nota!==""?l.nota:"—")+"</b>/10</span></div></div>";

    h += ETAPAS.map(function(m){
      var done=etapaFeita(l,m.n), open=!!ui.openEtapas[m.n], atual=(m.n===prox);
      return '<div class="etapa'+(done?" done":"")+(open?" open":"")+(atual&&!done?" atual":"")+'" data-etapa="'+m.n+'">'+
        '<div class="etapa-head" data-action="toggle-etapa-aberta" data-n="'+m.n+'">'+

/* =========================================================================
   FORMULÁRIOS DO CRUD
   Um formulário genérico: recebe a lista de campos e devolve um objeto.
   ========================================================================= */
function fmCampo(c, valor){
  var v = valor==null? "" : valor;
  if(c.tipo==="textarea")
    return '<label class="field">'+esc(c.rot)+(c.dica?'<span class="hint">'+esc(c.dica)+"</span>":"")+
      '<textarea id="fm_'+c.id+'" placeholder="'+esc(c.ph||"")+'" style="min-height:'+(c.alt||90)+'px;">'+esc(v)+"</textarea></label>";
  if(c.tipo==="select")
    return '<label class="field">'+esc(c.rot)+'<select id="fm_'+c.id+'">'+
      (c.vazio? '<option value="">'+esc(c.vazio)+"</option>":"")+
      c.opcoes.map(function(o){
        var ov = typeof o==="object"? o.v : o, ol = typeof o==="object"? o.l : o;
        return '<option value="'+esc(ov)+'"'+(String(v)===String(ov)?" selected":"")+">"+esc(ol)+"</option>";
      }).join("")+"</select></label>";
  if(c.tipo==="marcas"){
    // várias opções ao mesmo tempo — um parceiro pode servir a mais de um segmento
    var sel = Array.isArray(v)? v : [];
    return '<div class="field">'+esc(c.rot)+(c.dica?'<span class="hint">'+esc(c.dica)+"</span>":"")+
      '<div class="tag-row" id="fm_'+c.id+'" style="margin-top:2px;">'+
      c.opcoes.map(function(o){
        var on = sel.indexOf(o.v) > -1;
        return '<button type="button" class="tag-btn'+(on?" active":"")+'" data-action="fm-marca" '+
          'data-v="'+esc(o.v)+'" aria-pressed="'+on+'">'+
          (o.ic? ico(o.ic,14):"")+esc(o.l)+"</button>";
      }).join("")+"</div></div>";
  }
  if(c.tipo==="imagem"){
    return '<div class="field">'+esc(c.rot)+(c.dica?'<span class="hint">'+esc(c.dica)+"</span>":"")+
      '<div class="logo-preview" id="fm_'+c.id+'_box" data-url="'+esc(v)+'">'+
        previewLogo(v)+
        '<label class="btn btn-sm" style="cursor:pointer;">Escolher imagem'+
        '<input type="file" accept="image/*" style="display:none;" data-action-change="enviar-logo" data-campo="'+c.id+'"></label>'+
        '<button type="button" class="btn btn-sm btn-ghost btn-danger" data-action="remover-logo" data-campo="'+c.id+'"'+(v?"":' hidden')+'>Remover</button>'+
      "</div></div>";
  }
  return '<label class="field">'+esc(c.rot)+(c.dica?'<span class="hint">'+esc(c.dica)+"</span>":"")+
    '<input type="text" id="fm_'+c.id+'" value="'+esc(v)+'" placeholder="'+esc(c.ph||"")+'"></label>';
}

function previewLogo(url){
  return url
    ? '<span class="pc-logo" style="width:56px;height:56px;"><img src="'+esc(url)+'" alt=""></span>'
    : '<span class="pc-logo pc-logo-vazia" style="width:56px;height:56px;font-size:11px;line-height:1.2;">sem logo</span>';
}

    .map(function(b){ return b.dataset.v; });

function abrirForm(titulo, campos, valores, acaoSalvar, attrs){
  valores = valores || {};
  var html = campos.map(function(c){
    return c.largo ? fmCampo(c, valores[c.id]) : '<div class="fm-col">'+fmCampo(c, valores[c.id])+"</div>";
  }).join("");
  // campos estreitos vão em grade de duas colunas; os largos ocupam a linha
  html = '<div class="form-grid">'+campos.filter(function(c){return !c.largo;}).map(function(c){
      return fmCampo(c, valores[c.id]); }).join("")+"</div>"+
    campos.filter(function(c){return c.largo;}).map(function(c){ return fmCampo(c, valores[c.id]); }).join("");
  html += '<div class="row" style="justify-content:flex-end;margin-top:16px;">'+
    '<button class="btn" data-action="close-modal">Cancelar</button>'+
    '<button class="btn btn-primary" data-action="'+acaoSalvar+'" '+(attrs||"")+'>Salvar</button></div>';
  openModal(titulo, html);
  setTimeout(function(){ var f=document.getElementById("fm_"+campos[0].id); if(f) f.focus(); },20);
}
function fmVal(id){ var e=document.getElementById("fm_"+id); return e? e.value.trim() : ""; }

/* =========================================================================
   ACOMPANHAMENTO DE EQUIPE
   Reúne os atendimentos deste navegador com os relatórios que os
   vendedores enviaram. Cada vendedor exporta o seu; o gestor importa.
   ========================================================================= */
function metricasDe(leads){
  var total = leads.length;
  var fechados  = leads.filter(function(l){ return l.status==="Fechado"; }).length;
  var perdidos  = leads.filter(function(l){ return l.status==="Perdido"; }).length;
  var ativos    = total - fechados - perdidos;
  var etapas    = leads.reduce(function(a,l){ return a + totalEtapas(l); }, 0);
  var notas     = leads.map(function(l){ return parseFloat(l.nota); }).filter(function(n){ return isFinite(n); });
  var ultima    = leads.reduce(function(a,l){ return (l.atualizadoEm||"") > a ? l.atualizadoEm : a; }, "");
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var atrasados = leads.filter(function(l){
    return l.proximaData && !l.proximaFeita && new Date(l.proximaData+"T00:00:00") <= hoje;
  }).length;
  var semProximo = leads.filter(function(l){
    return l.status!=="Fechado" && l.status!=="Perdido" && !l.proximaData;
  }).length;
  return {
    total:total, fechados:fechados, perdidos:perdidos, ativos:ativos,
    conversao: total? Math.round(fechados/total*100) : 0,
    etapasMedia: total? (etapas/total).toFixed(1) : "0",
    notaMedia: notas.length? (notas.reduce(function(a,n){return a+n;},0)/notas.length).toFixed(1) : null,
    ultima:ultima, atrasados:atrasados, semProximo:semProximo
  };
}

// Uma linha por pessoa: os usuários deste navegador + os relatórios importados
function equipeConsolidada(){
  var linhas = [];
  (state.usuarios||[]).forEach(function(u){
    linhas.push({id:u.id, nome:u.nome, papel:u.papel, ativo:u.ativo, origem:"local",
                 leads: state.leads.filter(function(l){ return l.donoId===u.id; }),
                 atualizadoEm:u.ultimoAcesso});
  });
  var orfaos = state.leads.filter(function(l){ return !l.donoId; });
  if(orfaos.length) linhas.push({id:"__sem_dono", nome:"Sem responsável", papel:"vendedor", ativo:true,
                                 origem:"local", leads:orfaos, atualizadoEm:null});
  (state.equipe||[]).forEach(function(r){
    var jaTem = linhas.filter(function(x){ return x.id===r.usuarioId; })[0];
    if(jaTem){
      // mesma pessoa: nunca duplica a linha. Os atendimentos deste navegador
      // mandam; só usa os do relatório se aqui não houver nenhum.
      jaTem.importado = r;
      if(!jaTem.leads.length){ jaTem.leads = r.leads||[]; jaTem.origem = "importado"; jaTem.atualizadoEm = r.enviadoEm; }
      return;
    }
    linhas.push({id:r.usuarioId, nome:r.nome, papel:r.papel||"vendedor", ativo:true,
                 origem:"importado", leads:r.leads||[], atualizadoEm:r.enviadoEm, importado:r});
  });
  return linhas.filter(function(x){ return x.leads.length || x.papel==="vendedor" || x.origem==="importado"; });
}

function objecoesMaisComuns(leads){
  var cont = {};
  leads.forEach(function(l){ (l.objecoes||[]).forEach(function(o){ cont[o.t] = (cont[o.t]||0)+1; }); });
  return Object.keys(cont).map(function(k){ return {t:k, n:cont[k]}; })
    .sort(function(a,b){ return b.n-a.n; }).slice(0,5);
}
function ramosMaisIndicados(leads){
  var cont = {};
  leads.forEach(function(l){
    Object.keys(l.ramosInteresse||{}).forEach(function(k){
      if(l.ramosInteresse[k]) cont[k] = (cont[k]||0)+1;
    });
  });
  return Object.keys(cont).map(function(k){ var r=ramoById(k); return {nome:r?r.nome:k, ico:r?r.icone:"grade", n:cont[k]}; })
    .sort(function(a,b){ return b.n-a.n; }).slice(0,5);
}

    if(geral.atrasados) alertas.push("<b>"+geral.atrasados+"</b> follow-up(s) atrasado(s)");
    if(geral.semProximo) alertas.push("<b>"+geral.semProximo+"</b> atendimento(s) em aberto sem próximo passo definido");
    h += callout("warn","aviso", alertas.join(" e ")+". A regra de ouro nº11 diz que toda conversa termina com próximo passo e data.");

    });
    h += '<div class="stack">'+ordenadas.map(function(x){
      var m = metricasDe(x.leads);
      var pp = PAPEIS[x.papel] || PAPEIS.vendedor;
      var iniciais = (x.nome||"?").trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();
      return '<div class="card" style="padding:15px 17px;">'+
        '<div class="row-between" style="flex-wrap:wrap;gap:10px;margin-bottom:12px;">'+

            (x.ativo===false? ' <span class="pill pill-danger">inativo</span>':"")+"</div>"+
            '<div class="faint">'+(m.ultima? "última atividade em "+fmtDate(m.ultima) : "sem atividade registrada")+"</div></div>"+
          "</div>"+
          '<div class="row">'+
        (x.importado? '<button class="btn btn-sm btn-ghost btn-danger" data-action="remover-relatorio" data-id="'+esc(x.id)+'">Remover relatório</button>':"")+
        '<button class="btn btn-sm" data-action="detalhe-consultor" data-id="'+esc(x.id)+'">Ver detalhe</button></div>'+
        "</div>"+

          '<div class="stat" style="padding:10px 12px;"><div class="stat-num" style="font-size:19px;">'+m.total+'</div><div class="stat-label">Candidatos</div></div>'+
          '<div class="stat" style="padding:10px 12px;"><div class="stat-num" style="font-size:19px;">'+m.ativos+'</div><div class="stat-label">Em andamento</div></div>'+
          '<div class="stat" style="padding:10px 12px;"><div class="stat-num" style="font-size:19px;">'+m.fechados+'</div><div class="stat-label">Fechados</div></div>'+
          '<div class="stat" style="padding:10px 12px;"><div class="stat-num" style="font-size:19px;">'+m.conversao+'%</div><div class="stat-label">Conversão</div></div>'+
        "</div>"+
        '<div class="row" style="gap:14px;margin-top:10px;flex-wrap:wrap;">'+
          '<span class="faint">Etapas concluídas por atendimento: <b>'+m.etapasMedia+"</b>/12</span>"+

          (m.atrasados? '<span class="pill pill-warning">'+m.atrasados+" follow-up atrasado</span>":"")+
          (m.semProximo? '<span class="pill pill-danger">'+m.semProximo+" sem próximo passo</span>":"")+
        "</div>"+
      "</div>";
    }).join("")+"</div>";
  }
  h += "</div>";

  if(todos.length){
    var max = Math.max.apply(null, STATUS_LIST.map(function(st){
      return todos.filter(function(l){ return l.status===st.key; }).length; }).concat([1]));
    h += '<div class="section"><div class="section-head"><h2>'+ico("escala",17)+"Funil da equipe</h2></div><div class=\"card\">";

        '<span class="mono" style="text-align:right;">'+c+"</span></div>";
    });
    h += "</div></div>";

    var objs = objecoesMaisComuns(todos), rams = ramosMaisIndicados(todos);
    h += '<div class="grid grid-2">';
    h += '<div><div class="section-head"><h2>'+ico("balao",17)+"Objeções mais ouvidas</h2></div><div class=\"card\">"+
      (objs.length? objs.map(function(o){
        return '<div class="followup-row"><span>“'+esc(o.t)+'”</span><span class="pill pill-warning">'+o.n+"×</span></div>";

    h += "</div>";

function submeterAcesso(e){
  e.preventDefault();
  if(naNuvem()) return submeterAcessoNuvem();
  var setup = precisaSetup();
  var user = (document.getElementById("acUser").value||"").trim();
  var senha = document.getElementById("acSenha").value||"";
  if(setup){
    var nome = (document.getElementById("acNome").value||"").trim();
    var s2 = document.getElementById("acSenha2").value||"";
    if(!nome) return erroAcesso("Informe seu nome.");
    if(user.length<3) return erroAcesso("O nome de usuário precisa de pelo menos 3 letras.");
    if(senha.length<6) return erroAcesso("A senha precisa de pelo menos 6 caracteres.");
    if(senha!==s2) return erroAcesso("As senhas não conferem.");
    var admin = {id:uid(), nome:nome, usuario:user.toLowerCase(), senha:hashSenha(user,senha),
                 papel:"admin", ativo:true, criadoEm:nowISO(), ultimoAcesso:nowISO()};
    state.usuarios = [admin];
    state.sessaoId = admin.id;
    if(!state.consultorNome) state.consultorNome = nome;
    saveStateNow(); entrarApp();
    toast("Administrador criado. Bem-vindo!");
    return;
  }
  var u = (state.usuarios||[]).filter(function(x){ return x.usuario===user.toLowerCase(); })[0];
  if(!u || u.senha!==hashSenha(user,senha)) return erroAcesso("Usuário ou senha incorretos.");
  if(!u.ativo) return erroAcesso("Este usuário está desativado. Fale com o administrador.");
  u.ultimoAcesso = nowISO();
  state.sessaoId = u.id;
  if(!state.consultorNome) state.consultorNome = u.nome;
  saveStateNow(); entrarApp();
  toast("Olá, "+u.nome.split(" ")[0]+".");
}
// Login e cadastro pelo Supabase. Traduz cada erro do servidor para uma
// frase que diga o que fazer, não o que o servidor achou.
function submeterAcessoNuvem(){
  var criar = ui.acessoModo === "criar";
  var email = (document.getElementById("acEmail").value||"").trim().toLowerCase();
  var senha = document.getElementById("acSenha").value||"";
  var btn = document.getElementById("acessoBtn");
  if(!/.+@.+\..+/.test(email)) return erroAcesso("Informe um e-mail válido.");
  if(senha.length<6) return erroAcesso("A senha precisa de pelo menos 6 caracteres.");

  var nome = "";
  if(criar){
    nome = (document.getElementById("acNome").value||"").trim();
    var s2 = document.getElementById("acSenha2").value||"";
    if(!nome) return erroAcesso("Informe seu nome completo.");
    if(senha!==s2) return erroAcesso("As senhas não conferem.");
  }

  btn.disabled = true;
  document.getElementById("acessoErro").hidden = true;
  var txtOriginal = btn.textContent;
  btn.textContent = criar? "Criando…" : "Entrando…";

  var passo = criar ? nuvem.criarConta(nome, email, senha) : nuvem.entrar(email, senha);
  passo.then(function(r){
    if(r.error) throw r.error;
    var sessao = r.data && r.data.session;
    if(!sessao){
      // acontece quando a confirmação de e-mail está ligada no projeto
      throw new Error("confirme-email");
    }
    nuvem.guardarParaMigrar();
    return nuvem.abrirSessao(sessao).then(function(){
      saveStateNow();
      entrarApp();
      toast("Olá, "+String(nuvem.perfil.nome).split(" ")[0]+".");
    });
  }).catch(function(err){
    btn.disabled = false; btn.textContent = txtOriginal;
    var m = String((err && err.message) || "");
    if(m === "confirme-email")
      return erroAcesso("Conta criada. Confirme o e-mail que você recebeu e depois entre por aqui.");
    if(m === "sem-perfil")
      return erroAcesso("Sua conta existe, mas ainda não tem perfil na equipe. Peça ao administrador para liberar.");
    if(m === "inativo")
      return erroAcesso("Sua conta está desativada. Fale com o administrador de expansão.");
    if(/Invalid login/i.test(m))
      return erroAcesso("E-mail ou senha incorretos.");
    if(/already registered|already been registered/i.test(m))
      return erroAcesso("Já existe uma conta com esse e-mail. Use “Já tenho conta — entrar”.");
    if(/Email .*invalid|invalid format/i.test(m))
      return erroAcesso("Este e-mail não foi aceito pelo servidor. Confira se está escrito certo.");
    if(/rate limit|too many/i.test(m))
      return erroAcesso("Muitas tentativas seguidas. Espere um minuto e tente de novo.");
    erroAcesso(m || "Não consegui falar com o servidor. Confira sua conexão.");
  });
}

function sair(){
  if(naNuvem()){
    nuvem.sairDaConta().then(function(){
      nuvem.perfil = null; nuvem.perfis = []; nuvem.espelho = {};
      state.leads = []; state.usuarios = []; state.sessaoId = null; state.activeLeadId = null;
      state.ultimaSessaoNuvem = null;
      saveStateNow();
      ui.acessoModo = "entrar";
      mostrarAcesso();
    });
    return;
  }
  state.sessaoId = null; saveStateNow(); mostrarAcesso();
}

function aplicarTema(){
  var r = document.documentElement;
  if(ui.tema==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", ui.tema);
  document.querySelectorAll(".theme-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.tema===ui.tema); });
}
var NOMES_VIEW = {inicio:"Início", atendimento:"Atendimento", grupo:"O Grupo É", franquias:"Franquias",
  ramos:"Ramos e segmentos", parceiros:"Parceiros", comissoes:"Comissões", calculadora:"Calculadora",
  scripts:"Scripts e objeções", equipe:"Equipe", adm:"Administração", config:"Configurações"};

function render(){
  document.querySelectorAll(".nav-btn").forEach(function(b){
    b.classList.toggle("active", b.dataset.view===ui.view);
    if(b.dataset.ic && !b.querySelector(".ico-svg")) b.insertAdjacentHTML("afterbegin", ico(b.dataset.ic,17));
