/* ---- importação de indicadores ---- */
var COL_MUNICIPIO = ["municipio","cidade","nome do municipio","municipios","nm_mun"];
var COL_UF_IND    = ["uf","estado","sigla","sg_uf"];
var COL_CODIGO    = ["codigo ibge","cod ibge","codigo do municipio","cod municipio","codigo","ibge","cd_mun"];

function importarIndicadores(linhas){
  if(!linhas.length) throw new Error("planilha-vazia");
  var cab = linhas[0];
  var iMun = -1, iUf = -1, iCod = -1;
  cab.forEach(function(t, i){
    var k = chaveColuna(t);
    if(iCod < 0 && COL_CODIGO.some(function(a){ return k === chaveColuna(a); })) iCod = i;
    if(iMun < 0 && COL_MUNICIPIO.some(function(a){ return k === chaveColuna(a); })) iMun = i;
    if(iUf  < 0 && COL_UF_IND.some(function(a){ return k === chaveColuna(a); })) iUf = i;
  });
  if(iCod < 0 && iMun < 0) throw new Error("sem-municipio");

  // toda coluna que não é identificação e tem número vira indicador
  var numericas = [];
  cab.forEach(function(t, i){
    if(i === iMun || i === iUf || i === iCod) return;
    var titulo = String(t || "").trim();
    if(!titulo) return;
    var achouNumero = linhas.slice(1, 40).some(function(l){ return lerNumero(l[i]) != null; });
    if(achouNumero) numericas.push({i: i, id: idCanonico(titulo), nome: titulo});
  });
  if(!numericas.length) throw new Error("sem-numeros");

  var base = clonar(INDICADORES());
  base.porMunicipio = base.porMunicipio || {};
  base.campos = base.campos || [];
  numericas.forEach(function(c){
    if(!base.campos.some(function(x){ return x.id === c.id; })){
      base.campos.push({id:c.id, nome:c.nome, fonte:"", data:""});
    }
  });

  var casados = 0, perdidos = [];
  linhas.slice(1).forEach(function(l){
    var m = null;
    if(iCod >= 0){
      var cod = String(l[iCod] || "").replace(/\D/g,"");
      if(cod.length === 7) m = municipioPorCodigo(cod);
    }
    if(!m && iMun >= 0){
      m = acharMunicipio(String(l[iMun] || ""), iUf >= 0 ? String(l[iUf] || "").toUpperCase().slice(0,2) : null);
    }
    if(!m){
      var q = iMun >= 0 ? String(l[iMun] || "").trim() : "";
      if(q && perdidos.length < 12 && perdidos.indexOf(q) < 0) perdidos.push(q);
      return;
    }
    casados++;
    var reg = base.porMunicipio[m.cod] || (base.porMunicipio[m.cod] = {});
    numericas.forEach(function(c){
      var v = lerNumero(l[c.i]);
      if(v != null) reg[c.id] = v;
    });
  });
  if(!casados) throw new Error("nenhum-casou");
  return {base: base, casados: casados, campos: numericas, perdidos: perdidos};
}

// As regras de aderência procuram por "frota", "populacao" e "idosos".
// Sem isto, uma coluna chamada "TOTAL DE VEÍCULOS" viraria o indicador
// "total-de-veiculos" e nenhum sinal dispararia — o número apareceria na
// tabela e não serviria para nada.
var APELIDOS_INDICADOR = {
  frota:     ["frota","total de veiculos","veiculos","total frota","frota total","frota de veiculos"],
  populacao: ["populacao","habitantes","pop","populacao estimada","populacao residente"],
  idosos:    ["idosos","pessoas 60 anos ou mais","60 anos ou mais","populacao 60","idosa","60+"],
  domicilios:["domicilios","total de domicilios"],
  empresas:  ["empresas","estabelecimentos","unidades locais"]
};
function idCanonico(titulo){
  var k = chaveColuna(titulo);
  var achou = null;
  Object.keys(APELIDOS_INDICADOR).forEach(function(canon){
    if(achou) return;
    if(APELIDOS_INDICADOR[canon].some(function(a){
      var ac = chaveColuna(a);
      return k === ac || k.indexOf(ac) === 0;
    })) achou = canon;
  });
  return achou || slug(titulo);
}

// Número em planilha brasileira. O caso perigoso é o ponto sozinho:
// "719.126" é setecentos mil, não setecentos e dezenove vírgula cento e
// vinte e seis. Só dá para distinguir pelo formato — grupos de exatamente
// três dígitos depois de cada ponto são separador de milhar.
function lerNumero(v){
  if(v == null || v === "") return null;
  if(typeof v === "number") return isFinite(v) ? v : null;
  var s = String(v).trim().replace(/\s|\u00a0/g,"");
  if(!s || !/\d/.test(s)) return null;
  var negativo = /^-/.test(s) || /^\(.*\)$/.test(s);
  s = s.replace(/[^0-9.,]/g,"");
  if(!s) return null;

  var temPonto = s.indexOf(".") > -1, temVirgula = s.indexOf(",") > -1;
  if(temPonto && temVirgula){
    // o último separador é o decimal
    s = (s.lastIndexOf(",") > s.lastIndexOf("."))
      ? s.replace(/\./g,"").replace(",", ".")
      : s.replace(/,/g,"");
  } else if(temVirgula){
    s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,"") : s.replace(",", ".");
  } else if(temPonto){
    s = /^\d{1,3}(\.\d{3})+$/.test(s) ? s.replace(/\./g,"") : s;
  }
  var n = parseFloat(s);
  if(!isFinite(n)) return null;
  return negativo ? -Math.abs(n) : n;
}

/* ---------------------------------------------------------------------
   IBGE ao vivo — complemento, nunca dependência
   --------------------------------------------------------------------- */
var IBGE_POP = "https://servicodados.ibge.gov.br/api/v3/agregados/6579/periodos/-1/variaveis/9324?localidades=N6[{cod}]";

// Cache da consulta ao vivo. Fica só neste navegador, de propósito:
// consulta a portal público não é conteúdo da empresa. Se fosse para a
// tabela `conteudo`, cada vendedor reescreveria a coleção inteira ao
// abrir uma cidade — e o RLS recusaria a escrita de quem não é
// administrador, deixando um erro silencioso na tela de todo mundo.
var IBGE_CHAVE = "bussola_ibge_v1";
var _ibge = null;
function ibgeCache(){
  if(_ibge) return _ibge;
  try{ _ibge = JSON.parse(localStorage.getItem(IBGE_CHAVE) || "{}") || {}; }
  catch(e){ _ibge = {}; }
  return _ibge;
}
function guardarIbge(cod, valores, campos){
  var c = ibgeCache();
  c[cod] = {valores: valores, campos: campos, em: nowISO()};
  try{ localStorage.setItem(IBGE_CHAVE, JSON.stringify(c)); }catch(e){}
}

// Chama o IBGE em segundo plano. Se responder, o número entra como um
// indicador normal, com fonte e ano. Se não, ninguém fica sabendo — a
// tela já estava útil sem ele.
function tentarIbge(cod){
  var m = municipioPorCodigo(cod);
  if(!m) return;
  if(ibgeCache()[cod]) return;               // já perguntamos por esta cidade
  var salvo = (INDICADORES().porMunicipio || {})[cod] || {};
  if(salvo.populacao != null) return;        // o importado manda; não incomoda o IBGE
  buscarIbge(m).then(function(r){
    guardarIbge(cod, {populacao: r.populacao},
      [{id:"populacao", nome:"População", fonte:"IBGE — consulta ao vivo", data:r.ano}]);
    if(ui.view === "geo" && ui.geoCidade === cod) render();
  }).catch(function(err){
    // guarda o motivo para o diagnóstico do administrador
    ui.ibgeErro = String((err && err.message) || "erro");
  });
}

function buscarIbge(m){
  if(!window.fetch) return Promise.reject(new Error("sem-fetch"));
  var url = IBGE_POP.replace("{cod}", m.cod);
  var corta = new Promise(function(_, falha){ setTimeout(function(){ falha(new Error("tempo")); }, 8000); });
  return Promise.race([fetch(url, {mode:"cors"}), corta])
    .then(function(r){
      if(!r.ok) throw new Error("http-"+r.status);
      return r.json();
    })
    .then(function(j){
      var serie = j && j[0] && j[0].resultados && j[0].resultados[0] &&
                  j[0].resultados[0].series && j[0].resultados[0].series[0];
      if(!serie || !serie.serie) throw new Error("formato");
      var anos = Object.keys(serie.serie).sort();
      var ano = anos[anos.length-1];
      var valor = lerNumero(serie.serie[ano]);
      if(valor == null) throw new Error("vazio");
      return {populacao: valor, ano: ano};
    });
}


/* ---------------------------------------------------------------------
   IMPORTAR DO IBGE — os 5.570 municípios de uma vez

   Isto é diferente da consulta ao vivo acima. Lá é uma cidade, em
   segundo plano, guardada só neste navegador. Aqui é uma ação
   deliberada de quem administra: baixa o país inteiro e grava na
   coleção compartilhada, com fonte e ano, para o time todo.

   Os endereços e os formatos abaixo foram conferidos contra a API real
   do IBGE em 26/08/2026 — não são chute. O que foi visto lá:

   · o CORS é aberto (access-control-allow-origin: *), então dá para
     chamar direto do navegador, sem servidor no meio;
   · localidades=N6[all] devolve os 5.570 municípios numa resposta só;
   · 9514 (idade) com as 9 faixas de uma vez para o país inteiro
     devolve erro 500 — por isso vai uma faixa por vez;
   · e o mais importante: os números vêm com PONTO DECIMAL, no formato
     americano. A área de Curitiba chega como "434.892" e são 434,892
     km², não 434 mil. Por isso existe numeroIbge() em vez de reusar
     lerNumero(), que é o leitor de planilha brasileira.
   --------------------------------------------------------------------- */

var IBGE_API = "https://servicodados.ibge.gov.br/api/v3/agregados/";

// Número como a API do IBGE escreve: ponto é decimal, sempre.
// Reusar lerNumero() aqui leria 434.892 como quatrocentos e trinta e
// quatro mil. Não é o mesmo problema da planilha, e não tem o mesmo leitor.
function numeroIbge(v){
  if(v == null || v === "" || v === "-" || v === "..." || v === "..") return null;
  var n = parseFloat(String(v).replace(/\s/g,""));
  return isFinite(n)? n : null;
}

// Percorre a resposta do agregado e devolve {codigo: valor} + o ano.
// Percorre a resposta e devolve {codigo: valor} + o ano de fato usado.
//
// O ano mais recente nem sempre tem número: o IBGE já publica o período
// com "..." antes de ter o dado. O PIB de 2023 está lá, mas o valor
// adicionado por setor ainda não — vem "..." em todo município. Por isso
// aqui se pede uma faixa de anos e se recua até achar valor de verdade,
// em vez de pegar o último e desistir.
function lerSeries(json, acumular){
  var mapa = {}, ano = "";
  (json || []).forEach(function(v){
    (v.resultados || []).forEach(function(bloco){
      (bloco.series || []).forEach(function(s){
        var anos = Object.keys(s.serie || {}).sort();
        for(var i = anos.length - 1; i >= 0; i--){
          var n = numeroIbge(s.serie[anos[i]]);
          if(n == null) continue;                 // "...", "-", vazio: tenta o anterior
          if(anos[i] > ano) ano = anos[i];
          var cod = s.localidade.id;
          mapa[cod] = acumular ? (mapa[cod] || 0) + n : n;
          break;
        }
      });
    });
  });
  return {valores: mapa, ano: ano};
}

function pegarIbge(caminho){
  var corta = new Promise(function(_, falha){
    setTimeout(function(){ falha(new Error("o IBGE demorou demais")); }, 45000);
  });
  return Promise.race([fetch(IBGE_API + caminho, {mode:"cors"}), corta])
    .then(function(r){
      if(!r.ok) throw new Error("o IBGE respondeu " + r.status);
      return r.json();
    });
}

/* ---------------------------------------------------------------------
   A OUTRA API DO IBGE — "Cidades"

   O que está em /api/v3/agregados são as pesquisas do próprio IBGE. A
   frota de veículos NÃO está lá: ela mora em /api/v1/pesquisas, que é o
   que alimenta o IBGE Cidades, e a origem é o SENATRAN. Levei um tempo
   para achar porque procurei no lugar errado primeiro.

   Duas diferenças em relação à outra API, e as duas mordem:
   · o código do município volta com 6 dígitos (410690), sem o dígito
     verificador — enquanto o resto do app usa 7 (4106902);
   · não aceita "todos os municípios": acima de ~1.000 códigos por URL o
     servidor responde HTML de erro. Vai em lotes de 500.
   --------------------------------------------------------------------- */

var CIDADES_API = "https://servicodados.ibge.gov.br/api/v1/pesquisas/";
var LOTE_CIDADES = 500;

function pegarCidades(caminho){
  var corta = new Promise(function(_, falha){
    setTimeout(function(){ falha(new Error("o IBGE demorou demais")); }, 45000);
  });
  return Promise.race([fetch(CIDADES_API + caminho, {mode:"cors"}), corta])
    .then(function(r){
      if(!r.ok) throw new Error("o IBGE respondeu " + r.status);
      return r.json();
    });
}

/* Busca indicadores da API Cidades para todos os municípios, em lotes.
   `indicadores` é {idDoIndicador: idDoCampoNoApp}. */
function buscarCidades(pesquisa, periodo, indicadores, aviso){
  var ids = Object.keys(indicadores);
  var codigos = todosOsCodigos();
  var lotes = [];
  for(var i = 0; i < codigos.length; i += LOTE_CIDADES) lotes.push(codigos.slice(i, i + LOTE_CIDADES));

  var porCampo = {}, ano = String(periodo);
  ids.forEach(function(id){ porCampo[indicadores[id]] = {}; });

  return lotes.reduce(function(fila, lote, i){
    return fila.then(function(){
      if(aviso) aviso(i, lotes.length);
      return pegarCidades(pesquisa + "/periodos/" + periodo + "/indicadores/" +
                          ids.join("|") + "/resultados/" + lote.join("|"))
        .then(function(j){
          (j || []).forEach(function(bloco){
            var campo = indicadores[String(bloco.id)];
            if(!campo) return;
            (bloco.res || []).forEach(function(x){
              var anos = Object.keys(x.res || {}).sort();
              for(var k = anos.length - 1; k >= 0; k--){
                var n = numeroIbge(x.res[anos[k]]);
                if(n == null) continue;
                // 6 dígitos → o código de 7 que o resto do app usa
                var cod = completarCodigo(String(x.localidade));
                if(cod) porCampo[campo][cod] = n;
                break;
              }
            });
          });
        });
    });
  }, Promise.resolve()).then(function(){ return {porCampo: porCampo, ano: ano}; });
}

// Lista dos 5.565 códigos que o app já traz embutidos — não precisa
// perguntar ao IBGE quais municípios existem.
var _codigos = null;
function todosOsCodigos(){
  if(_codigos) return _codigos;
  _codigos = municipios().map(function(m){ return m.cod; });
  return _codigos;
}
// De 410690 para 4106902: o app indexa por código completo.
var _por6 = null;
function completarCodigo(seis){
  if(seis.length === 7) return seis;
  if(!_por6){
    _por6 = {};
    todosOsCodigos().forEach(function(c){ _por6[c.slice(0,6)] = c; });
  }
  return _por6[seis] || null;
}

// As nove faixas de cinco anos que somam "60 anos ou mais". Não existe
// uma categoria pronta para isso no Censo — tem que somar.
var FAIXAS_60 = ["93095","93096","93097","93098","49108","49109","60040","60041","6653"];

// A API Cidades exige o período na URL — não aceita "o mais recente".
// Se o IBGE publicar um ano novo, é aqui que se troca.
var ANO_FROTA   = 2025;
var ANO_ESCOLAR = 2024;
var ANO_IDEB    = 2023;

// Uma resposta de agregado com várias variáveis, repartida por campo.
function porVariavel(json, mapa){
  var porCampo = {}, anoPorCampo = {}, ano = "";
  Object.keys(mapa).forEach(function(v){ porCampo[mapa[v]] = {}; });
  (json || []).forEach(function(v){
    var campo = mapa[String(v.id)];
    if(!campo) return;
    var r = lerSeries([v], false);
    porCampo[campo] = r.valores;
    anoPorCampo[campo] = r.ano;      // o PIB tem 2023, o setorial parou em 2021
    if(r.ano > ano) ano = r.ano;
  });
  return {porCampo: porCampo, anoPorCampo: anoPorCampo, ano: ano};
}

// Nome de cada indicador na tela. Sem isto o cabeçalho da tabela do
// IBGE viraria o rótulo, e "vabAgro" não diz nada a ninguém.

/* Baixa os blocos escolhidos e grava na coleção `indicadores`.
   Nada é gravado antes de tudo terminar: se o quinto pedido falhar,
   a base fica como estava, em vez de meio atualizada. */
function importarDoIbge(ids, aoAndar){
  var base = clonar(INDICADORES());
  base.campos = base.campos || [];
  base.porMunicipio = base.porMunicipio || {};
  var colhido = [], erros = [];

  var fila = ids.reduce(function(p, id){
    return p.then(function(){
      var b = blocoIbge(id);
      if(!b) return;
      if(aoAndar) aoAndar(id, "andando", "");
      return b.buscar(function(i, n){
        if(aoAndar) aoAndar(id, "andando", "parte " + (i+1) + " de " + n);
      }).then(function(r){
        // dois formatos: um campo só ({valores}) ou vários ({porCampo})
        var porCampo = r.porCampo || {};
        if(r.valores) porCampo[b.id] = r.valores;
        var quantos = 0;
        Object.keys(porCampo).forEach(function(k){
          quantos = Math.max(quantos, Object.keys(porCampo[k]).length);
        });
        if(!quantos) throw new Error("veio vazio");
        colhido.push({bloco: b, porCampo: porCampo, ano: r.ano, anoPorCampo: r.anoPorCampo || {}});
        if(aoAndar) aoAndar(id, "ok", fmtNum(quantos) + " municípios · " + r.ano);
      }).catch(function(e){
        erros.push(b.nome + ": " + (e.message || "falhou"));
        if(aoAndar) aoAndar(id, "erro", e.message || "falhou");
      });
    });
  }, Promise.resolve());

  return fila.then(function(){
    if(!colhido.length) throw new Error(erros.join(" · ") || "nada foi baixado");
    colhido.forEach(function(c){
      var b = c.bloco;
      Object.keys(c.porCampo).forEach(function(fid){
        var valores = c.porCampo[fid];
        if(!Object.keys(valores).length) return;
        var campo = null;
        for(var i=0;i<base.campos.length;i++) if(base.campos[i].id === fid) campo = base.campos[i];
        if(!campo){ campo = {id: fid}; base.campos.push(campo); }
        campo.nome  = campo.nome || NOMES_CAMPO_IBGE[fid] || b.nome;
        campo.fonte = b.fonte;
        campo.data  = (c.anoPorCampo && c.anoPorCampo[fid]) || c.ano;
        // Mil reais é a unidade do IBGE para PIB, salários e valor de
        // lavoura. Guardar em reais evita que alguém leia o número da
        // tela como se fosse a moeda inteira e erre por mil vezes.
        var emReais = (b.moeda || []).indexOf(fid) > -1;
        if(emReais) campo.formato = "moeda";
        Object.keys(valores).forEach(function(cod){
          (base.porMunicipio[cod] = base.porMunicipio[cod] || {})[fid] =
            emReais ? valores[cod] * 1000 : valores[cod];
        });
      });
    });
    base.ibgeEm = nowISO();
    db.set("indicadores", base);
    // o que veio do IBGE agora vale mais que a consulta avulsa guardada antes
    _ibge = {};
    try{ localStorage.removeItem(IBGE_CHAVE); }catch(e){}
    return {blocos: colhido.length, erros: erros};
  });
}

   NUVEM — Supabase
   O app funciona em dois modos e sabe em qual está:

   · modo nuvem  — usuários, conteúdo e atendimentos ficam no Supabase e
                   valem para o time inteiro, em qualquer computador.
   · modo local  — se a biblioteca do Supabase não carregar (prévia do

var CDNS = [

];

function uuid4(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  var b = new Uint8Array(16);
  try{ crypto.getRandomValues(b); }
  catch(e){ for(var k=0;k<16;k++) b[k] = Math.floor(Math.random()*256); }
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  var h = []; for(var i=0;i<16;i++) h.push(("0"+b[i].toString(16)).slice(-2));
  return h.slice(0,4).join("")+"-"+h.slice(4,6).join("")+"-"+h.slice(6,8).join("")+
         "-"+h.slice(8,10).join("")+"-"+h.slice(10,16).join("");
}
function ehUuid(v){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(v||"")); }

function carregarScript(src){
  return new Promise(function(ok, falha){
    var s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = function(){ ok(); };
    s.onerror = function(){ falha(new Error("cdn")); };
    document.head.appendChild(s);
    setTimeout(function(){ falha(new Error("timeout")); }, 9000);
  });
}

  /* ---------- logos dos parceiros ---------- */

  enviarLogo: function(arquivo){

  /* ---------- atendimentos ---------- */
  paraLinha: function(l){

  daLinha: function(row){
    var l = row.dados || {};
    l.id = row.id; l.donoId = row.dono;
    if(row.status) l.status = row.status;
    if(row.atualizado_em) l.atualizadoEm = row.atualizado_em;
    return l;
  },

  // Junta o que veio do banco com o que está neste navegador, em vez de
  // simplesmente sobrescrever: se alguém trabalhou sem conexão, o que ele
  // fez continua valendo e sobe na próxima sincronização.
  carregarLeads: function(){
    return nuvem.sb.from("leads").select("*").order("atualizado_em",{ascending:false})
      .then(function(r){
        if(r.error) throw r.error;
        var doBanco = (r.data||[]).map(nuvem.daLinha);
        var porIdBanco = {};
        doBanco.forEach(function(l){ porIdBanco[l.id] = l; });

        var meuId = nuvem.perfil ? nuvem.perfil.id : null;
        var locais = (state.leads||[]).filter(function(l){ return l.id && ehUuid(l.id); });
        var final = doBanco.slice();

        locais.forEach(function(loc){
          var srv = porIdBanco[loc.id];
          if(!srv){
            // só existe aqui: mantém se for meu (foi criado sem conexão)
            if(loc.donoId === meuId) final.push(loc);
            return;
          }
          // existe nos dois: fica a versão mais recente
          if((loc.atualizadoEm||"") > (srv.atualizadoEm||"")){
            final[final.indexOf(srv)] = loc;
          }
        });

        // completa o nome do dono a partir dos perfis já carregados
        final.forEach(function(l){
          var p = nuvem.perfis.filter(function(u){ return u.id===l.donoId; })[0];
          if(p) l.donoNome = p.nome;
        });
        final.sort(function(a,b){ return (b.atualizadoEm||"").localeCompare(a.atualizadoEm||""); });

        state.leads = final;
        // o espelho guarda só o que o banco já tem: assim o que veio de local
        // é detectado como mudança e sobe sozinho
        nuvem.espelho = {};
        doBanco.forEach(function(l){
          if(porIdBanco[l.id] === l && final.indexOf(l) > -1) nuvem.espelho[l.id] = JSON.stringify(l);
        });
        if(state.activeLeadId && !findLead(state.activeLeadId)) state.activeLeadId = null;
        return final;
      });
  },

  // Chamado por saveStateNow(): compara o que está na tela com o que já foi
  // gravado e manda ao banco só o que mudou de verdade.
  agendarSincLeads: function(){
    if(!nuvem.ativo || !nuvem.perfil) return;
    if(nuvem.timerLeads) clearTimeout(nuvem.timerLeads);
    nuvem.timerLeads = setTimeout(nuvem.sincLeads, 700);
  },

  sincLeads: function(){
    if(!nuvem.ativo || !nuvem.perfil || nuvem.sincronizando) return;
    var novos = [], atuais = {};
    (state.leads||[]).forEach(function(l){
      if(!l.id || !ehUuid(l.id)) return;      // leads antigos só sobem na migração
      var s = JSON.stringify(l);
      atuais[l.id] = s;
      if(nuvem.espelho[l.id] !== s) novos.push(l);
    });
    var apagados = Object.keys(nuvem.espelho).filter(function(id){ return !atuais[id]; });
    if(!novos.length && !apagados.length) return;

    nuvem.sincronizando = true;
    var trabalhos = [];
    if(novos.length){
      trabalhos.push(nuvem.sb.from("leads").upsert(novos.map(nuvem.paraLinha), {onConflict:"id"}));
    }
    apagados.forEach(function(id){
      trabalhos.push(nuvem.sb.from("leads").delete().eq("id", id));
    });
    Promise.all(trabalhos).then(function(res){
      var erro = res.filter(function(r){ return r && r.error; })[0];
      if(erro) throw erro.error;
      novos.forEach(function(l){ nuvem.espelho[l.id] = atuais[l.id]; });
      apagados.forEach(function(id){ delete nuvem.espelho[id]; });
    }).catch(function(err){
      toast("Não consegui sincronizar: "+((err&&err.message)||"erro de rede"));
    }).then(function(){
      nuvem.sincronizando = false;
      atualizarSelo();
    });
    atualizarSelo(true);
  },

  /* ---------- carga completa depois do login ---------- */
  abrirSessao: function(session){
    var uid_ = session.user.id;
    return nuvem.carregarPerfis(uid_).then(function(perfil){
      if(!perfil) throw new Error("sem-perfil");
      if(perfil.ativo === false) throw new Error("inativo");
      perfil.email = session.user.email || perfil.email;
      if(!state.consultorNome) state.consultorNome = perfil.nome;
      return Promise.all([nuvem.carregarConteudo(), nuvem.carregarLeads()]);
    });
  },

  /* ---------- migração do que já existe neste navegador ---------- */
  temPendente: function(){
    var m = state.migrar;
    return !!(m && ((m.leads && m.leads.length) || (m.conteudo && Object.keys(m.conteudo).length)));
  },

  guardarParaMigrar: function(){
    // roda uma única vez, no primeiro login com a nuvem ligada
    if(state.migrouEm || state.migrar) return;
    var leads = (state.leads||[]).slice();
    var conteudo = state.conteudo && Object.keys(state.conteudo).length ? clonar(state.conteudo) : null;
    if(!leads.length && !conteudo){ state.migrouEm = nowISO(); return; }
    state.migrar = {leads:leads, conteudo:conteudo, guardadoEm:nowISO()};
  },

  migrar: function(){
    var m = state.migrar || {};
    var meus = (m.leads||[]).map(function(l){
      var c = clonar(l);
      c.id = uuid4();                       // ids antigos não são uuid
      c.donoId = nuvem.perfil.id;
      c.donoNome = nuvem.perfil.nome;
      c.atualizadoEm = c.atualizadoEm || nowISO();
      return c;
    });
    var passos = [];
    if(meus.length) passos.push(nuvem.sb.from("leads").insert(meus.map(nuvem.paraLinha)));
    if(m.conteudo && podeEditar()){
      Object.keys(m.conteudo).forEach(function(k){
        if(!COLECOES[k]) return;
        passos.push(nuvem.sb.from("conteudo").upsert({
          colecao:k, dados:m.conteudo[k], atualizado_em:nowISO(), atualizado_por:nuvem.perfil.id
        }, {onConflict:"colecao"}));
      });
    }
    return Promise.all(passos).then(function(res){
      var erro = res.filter(function(r){ return r && r.error; })[0];
      if(erro) throw erro.error;
      delete state.migrar;
      state.migrouEm = nowISO();
      saveStateNow();
      return Promise.all([nuvem.carregarConteudo(), nuvem.carregarLeads()]);
    });
  }
};

// Selo de estado no canto da barra lateral: sincronizado, salvando, ou local.
function atualizarSelo(salvando){
  var el = document.getElementById("selo");
  if(!el) return;
  if(!nuvem.ativo){
    el.className = "selo selo-local";
    el.innerHTML = ico("aviso",13)+"<span>Só neste navegador</span>";
    el.title = "A nuvem não está acessível agora. Tudo continua salvo aqui no computador.";
    return;
  }
  el.className = "selo selo-nuvem" + (salvando? " selo-ativo" : "");
  el.innerHTML = ico(salvando?"ciclo":"escudo",13)+"<span>"+(salvando? "Salvando…" : "Sincronizado")+"</span>";
  el.title = "Conectado ao banco da equipe. O que você faz aqui aparece para o gestor.";
}

/* =========================================================================
   INIT
   ========================================================================= */
var downloadsCap = null;
function init(){
  state = loadState();
  try{ ui.tema = localStorage.getItem("bussola_tema") || "dark"; }catch(e){ ui.tema = "dark"; }
  aplicarTema();
  // nada de tela pela metade enquanto o app decide entre nuvem e modo local
  document.getElementById("app").hidden = true;
  document.getElementById("acesso").hidden = true;
  if(window.claude && typeof window.claude.use==="function"){
    window.claude.use("downloads").then(function(d){ downloadsCap = d; }).catch(function(){ downloadsCap = null; });
  }
  // Tenta a nuvem primeiro. Se ela não responder, o app abre em modo local —
  // ninguém fica parado esperando servidor.
  nuvem.iniciar().then(function(ok){
    if(!ok) return null;
    return nuvem.sessao();
  }).then(function(sessao){
    if(!sessao) return null;
    return nuvem.abrirSessao(sessao).catch(function(err){
      // sessão válida mas sem perfil ou desativada: volta para a tela de acesso
      nuvem.perfil = null;
      return nuvem.sairDaConta().then(function(){ return null; });
    });
  }).then(function(carregou){
    if(naNuvem() && nuvem.perfil){
      nuvem.guardarParaMigrar();
      saveStateNow();
      document.getElementById("acesso").hidden = true;
      entrarApp();
      return;
    }
    if(precisaSetup() || !usuarioAtual()) mostrarAcesso();
    else { document.getElementById("acesso").hidden = true; entrarApp(); }
  }).catch(function(){
    if(precisaSetup() || !usuarioAtual()) mostrarAcesso();
    else { document.getElementById("acesso").hidden = true; entrarApp(); }
  });
}
document.getElementById("acessoForm").addEventListener("submit", submeterAcesso);
init();

})();
