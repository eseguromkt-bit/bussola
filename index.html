/* =========================================================================
   ACOMPANHAMENTO DE EQUIPE
   Reúne os atendimentos deste navegador com os relatórios que os
   vendedores enviaram. Cada vendedor exporta o seu; o gestor importa.
   ========================================================================= */
function metricasDe(leads){
  var total = leads.length;
  var fechados  = leads.filter(function(l){ return l.status==="Fechado"; }).length;
  var perdidos  = leads.filter(function(l){ return l.status==="Perdido"; }).length;
  var ativos    = total - fechados - perdidos;
  var etapas    = leads.reduce(function(a,l){ return a + totalEtapas(l); }, 0);
  var notas     = leads.map(function(l){ return parseFloat(l.nota); }).filter(function(n){ return isFinite(n); });
  var ultima    = leads.reduce(function(a,l){ return (l.atualizadoEm||"") > a ? l.atualizadoEm : a; }, "");
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var atrasados = leads.filter(function(l){
    return l.proximaData && !l.proximaFeita && new Date(l.proximaData+"T00:00:00") <= hoje;
  }).length;
  var semProximo = leads.filter(function(l){
    return l.status!=="Fechado" && l.status!=="Perdido" && !l.proximaData;
  }).length;
  return {
    total:total, fechados:fechados, perdidos:perdidos, ativos:ativos,
    conversao: total? Math.round(fechados/total*100) : 0,
    etapasMedia: total? (etapas/total).toFixed(1) : "0",
    notaMedia: notas.length? (notas.reduce(function(a,n){return a+n;},0)/notas.length).toFixed(1) : null,
    ultima:ultima, atrasados:atrasados, semProximo:semProximo
  };
}

// Uma linha por pessoa: os usuários deste navegador + os relatórios importados
function equipeConsolidada(){
  var linhas = [];
  (state.usuarios||[]).forEach(function(u){
    linhas.push({id:u.id, nome:u.nome, papel:u.papel, ativo:u.ativo, origem:"local",
                 leads: state.leads.filter(function(l){ return l.donoId===u.id; }),
                 atualizadoEm:u.ultimoAcesso});
  });
  var orfaos = state.leads.filter(function(l){ return !l.donoId; });
  if(orfaos.length) linhas.push({id:"__sem_dono", nome:"Sem responsável", papel:"vendedor", ativo:true,
                                 origem:"local", leads:orfaos, atualizadoEm:null});
  (state.equipe||[]).forEach(function(r){
    var jaTem = linhas.filter(function(x){ return x.id===r.usuarioId; })[0];
    if(jaTem){
      // mesma pessoa: nunca duplica a linha. Os atendimentos deste navegador
      // mandam; só usa os do relatório se aqui não houver nenhum.
      jaTem.importado = r;
      if(!jaTem.leads.length){ jaTem.leads = r.leads||[]; jaTem.origem = "importado"; jaTem.atualizadoEm = r.enviadoEm; }
      return;
    }
    linhas.push({id:r.usuarioId, nome:r.nome, papel:r.papel||"vendedor", ativo:true,
                 origem:"importado", leads:r.leads||[], atualizadoEm:r.enviadoEm, importado:r});
  });
  return linhas.filter(function(x){ return x.leads.length || x.papel==="vendedor" || x.origem==="importado"; });
}

function objecoesMaisComuns(leads){
  var cont = {};
  leads.forEach(function(l){ (l.objecoes||[]).forEach(function(o){ cont[o.t] = (cont[o.t]||0)+1; }); });
  return Object.keys(cont).map(function(k){ return {t:k, n:cont[k]}; })
    .sort(function(a,b){ return b.n-a.n; }).slice(0,5);
}
function ramosMaisIndicados(leads){
  var cont = {};
  leads.forEach(function(l){
    Object.keys(l.ramosInteresse||{}).forEach(function(k){
      if(l.ramosInteresse[k]) cont[k] = (cont[k]||0)+1;
    });
  });
  return Object.keys(cont).map(function(k){ var r=ramoById(k); return {nome:r?r.nome:k, ico:r?r.icone:"grade", n:cont[k]}; })
    .sort(function(a,b){ return b.n-a.n; }).slice(0,5);
}

          '<div class="stat" style="padding:10px 12px;"><div class="stat-num" style="font-size:19px;">'+m.ativos+'</div><div class="stat-label">Em andamento</div></div>'+

function linhaItem(titulo, sub, acoes, extra){
  return '<div class="linha-item"><div class="linha-main"><div class="linha-tit">'+titulo+
    (extra||"")+'</div><div class="linha-sub">'+sub+"</div></div>"+
    '<div class="linha-acoes">'+acoes+"</div></div>";
}
function btnEditar(acao, attrs){ return '<button class="btn btn-sm" data-action="'+acao+'" '+(attrs||"")+'>Editar</button>'; }
function btnExcluir(acao, attrs){ return '<button class="btn btn-sm btn-ghost btn-danger" data-action="'+acao+'" '+(attrs||"")+'>Excluir</button>'; }

function avisoRestaurar(colecao, rotulo){
  if(!db.editado(colecao)) return "";
  // Na nuvem, o conteúdo de verdade mora no banco — o "original" que existe
  // no código é só o dado de exemplo. Oferecer "voltar ao original" ali
  // seria oferecer apagar tudo. Para repor, roda-se o seed-conteudo.sql.
  if(naNuvem()) return "";
  return '<div class="callout callout-info">'+ico("aviso",16)+
    "<span>Você editou "+esc(rotulo)+". <button class=\"btn btn-sm\" data-action=\"restaurar-colecao\" data-c=\""+
    colecao+"\" style=\"margin-left:8px;\">Voltar ao original</button></span></div>";
}

function renderAdm(){
  if(!podeEditar()){
    document.getElementById("appMain").innerHTML =
      '<div class="topline"><div><div class="eyebrow">Administração</div>'+
      '<h1 class="page-title">Acesso restrito</h1>'+
      '<p class="page-sub">Editar o conteúdo é do Administrador e do Editor. Fale com quem administra a base.</p></div></div>'+
      '<div class="empty">Seu perfil é de vendedor.</div>';
    return;
  }
  // O Editor não tem a aba de usuários; se ela estava selecionada
  // (ou se o papel dele mudou agora há pouco), cai numa aba que ele tem.
  var abas = ADM_ABAS.filter(function(t){ return t.so!=="admin" || ehAdmin(); });
  var aba = ui.admAba || abas[0].k;
  if(!abas.some(function(t){ return t.k===aba; })) aba = abas[0].k;
  var h = '<div class="topline"><div><div class="eyebrow">Administração</div>'+
    '<h1 class="page-title">Gerenciar conteúdo</h1>'+
    '<p class="page-sub">'+(naNuvem()
      ? "O que você editar aqui vale para o time inteiro, na hora, em qualquer aparelho."
      : "Sem conexão com o banco, a edição vale só neste navegador — e sobe quando a internet voltar.")+"</p></div>"+
    '<button class="btn" data-action="abrir-busca">'+ico("lupa",15)+"Buscar</button></div>";

  h += '<div class="adm-tabs">'+abas.map(function(t){
    return '<button class="tag-btn'+(aba===t.k?" active":"")+'" data-action="adm-aba" data-k="'+t.k+'">'+
      ico(t.ic,14)+esc(t.n)+"</button>";
  }).join("")+"</div>";

  if(aba==="usuarios")       h += ehAdmin()? admUsuarios() : "";
  else if(aba==="empresa")   h += admEmpresa();
  else if(aba==="franquias") h += admFranquias();
  else if(aba==="ramos")     h += admRamos();
  else if(aba==="parceiros") h += admParceiros();
  else if(aba==="rede")      h += admRede();
  else if(aba==="geo")       h += admGeo();
  else if(aba==="comissoes") h += admComissoes();
  else if(aba==="scripts")   h += admScripts();
  else if(aba==="objecoes")  h += admObjecoes();

  document.getElementById("appMain").innerHTML = h;
}

function campo(id, rotulo, tipo, ph, auto){

function mostrarAcesso(){
  var el = document.getElementById("acesso");
  var nuv = naNuvem();
  var criar = nuv && ui.acessoModo === "criar";
  var setup = !nuv && precisaSetup();
  var extra = document.getElementById("acessoExtra");
  var rodape = document.getElementById("acessoRodape");

  if(nuv){
    document.getElementById("acessoTitulo").textContent = criar? "Criar sua conta" : "Entrar";
    document.getElementById("acessoSub").textContent = criar
      ? "Sua conta vale em qualquer computador ou celular. A primeira conta criada vira a de administrador."
      : "Use o e-mail e a senha da sua conta do Grupo É.";
    document.getElementById("acessoBtn").textContent = criar? "Criar conta" : "Entrar";
    document.getElementById("acessoCampos").innerHTML = criar
      ? campo("acNome","Seu nome completo","text","Ex.: Ana Souza")+
        campo("acEmail","E-mail","email","voce@grupoe.com.br","email")+
        campo("acSenha","Senha","password","pelo menos 6 caracteres","new-password")+
        campo("acSenha2","Repita a senha","password","","new-password")
      : campo("acEmail","E-mail","email","voce@grupoe.com.br","email")+
        campo("acSenha","Senha","password","","current-password");
    if(rodape){
      rodape.hidden = false;
      rodape.innerHTML = criar
        ? '<button type="button" class="btn btn-block btn-ghost" data-action="acesso-modo" data-m="entrar">Já tenho conta — entrar</button>'
        : '<button type="button" class="btn btn-block btn-ghost" data-action="acesso-modo" data-m="criar">Ainda não tenho conta — criar</button>';
    }
    if(extra) extra.hidden = true;   // convite por arquivo não faz sentido na nuvem
  } else {
    document.getElementById("acessoTitulo").textContent = setup? "Primeiro acesso" : "Entrar";
    document.getElementById("acessoSub").textContent = setup
      ? "Crie o usuário administrador. Ele poderá editar comissões, dados da empresa e cadastrar o resto da equipe."
      : "Use seu usuário e senha da equipe de expansão.";
    document.getElementById("acessoBtn").textContent = setup? "Criar administrador" : "Entrar";
    document.getElementById("acessoCampos").innerHTML = setup
      ? campo("acNome","Seu nome","text","Ex.: Ana Souza")+
        campo("acUser","Nome de usuário","text","ana")+
        campo("acSenha","Senha","password","","new-password")+
        campo("acSenha2","Repita a senha","password","","new-password")
      : campo("acUser","Usuário","text","","username")+
        campo("acSenha","Senha","password","","current-password");
    if(rodape){ rodape.hidden = true; rodape.innerHTML = ""; }
    if(extra) extra.hidden = false;
  }

  // Sem conexão, mas com uma sessão da nuvem já usada aqui: dá para continuar
  // trabalhando com a última cópia salva neste navegador.
  var offline = null;
  var idOff = state.sessaoId || state.ultimaSessaoNuvem;
  if(!nuv && idOff){
    var u0 = (state.usuarios||[]).filter(function(x){ return x.id===idOff; })[0];
    if(u0 && !u0.senha) offline = u0;
  }
  if(offline && rodape){
    rodape.hidden = false;
    rodape.innerHTML = '<button type="button" class="btn btn-primary btn-block" data-action="continuar-offline">'+
      "Continuar sem conexão como "+esc(String(offline.nome).split(" ")[0])+"</button>";
    document.getElementById("acessoCampos").innerHTML = "";
    document.getElementById("acessoBtn").style.display = "none";
    document.getElementById("acessoTitulo").textContent = "Sem conexão";
    document.getElementById("acessoSub").textContent =
      "Não consegui falar com o banco da equipe. Você pode seguir com a última cópia salva aqui — o que fizer sobe quando a conexão voltar.";
    if(extra) extra.hidden = true;
  } else {
    document.getElementById("acessoBtn").style.display = "";
  }

  var aviso = document.getElementById("acessoAviso");
  if(aviso){
    aviso.hidden = nuv || !!offline;
    aviso.textContent = (nuv || offline) ? "" :

function submeterAcesso(e){
  e.preventDefault();
  if(naNuvem()) return submeterAcessoNuvem();
  var setup = precisaSetup();
  var user = (document.getElementById("acUser").value||"").trim();
  var senha = document.getElementById("acSenha").value||"";
  if(setup){
    var nome = (document.getElementById("acNome").value||"").trim();
    var s2 = document.getElementById("acSenha2").value||"";
    if(!nome) return erroAcesso("Informe seu nome.");
    if(user.length<3) return erroAcesso("O nome de usuário precisa de pelo menos 3 letras.");
    if(senha.length<6) return erroAcesso("A senha precisa de pelo menos 6 caracteres.");
    if(senha!==s2) return erroAcesso("As senhas não conferem.");
    var admin = {id:uid(), nome:nome, usuario:user.toLowerCase(), senha:hashSenha(user,senha),
                 papel:"admin", ativo:true, criadoEm:nowISO(), ultimoAcesso:nowISO()};
    state.usuarios = [admin];
    state.sessaoId = admin.id;
    if(!state.consultorNome) state.consultorNome = nome;
    saveStateNow(); entrarApp();
    toast("Administrador criado. Bem-vindo!");
    return;
  }
  var u = (state.usuarios||[]).filter(function(x){ return x.usuario===user.toLowerCase(); })[0];
  if(!u || u.senha!==hashSenha(user,senha)) return erroAcesso("Usuário ou senha incorretos.");
  if(!u.ativo) return erroAcesso("Este usuário está desativado. Fale com o administrador.");
  u.ultimoAcesso = nowISO();
  state.sessaoId = u.id;
  if(!state.consultorNome) state.consultorNome = u.nome;
  saveStateNow(); entrarApp();
  toast("Olá, "+u.nome.split(" ")[0]+".");
}
// Login e cadastro pelo Supabase. Traduz cada erro do servidor para uma
// frase que diga o que fazer, não o que o servidor achou.
function submeterAcessoNuvem(){
  var criar = ui.acessoModo === "criar";
  var email = (document.getElementById("acEmail").value||"").trim().toLowerCase();
  var senha = document.getElementById("acSenha").value||"";
  var btn = document.getElementById("acessoBtn");
  if(!/.+@.+\..+/.test(email)) return erroAcesso("Informe um e-mail válido.");
  if(senha.length<6) return erroAcesso("A senha precisa de pelo menos 6 caracteres.");

  var nome = "";
  if(criar){
    nome = (document.getElementById("acNome").value||"").trim();
    var s2 = document.getElementById("acSenha2").value||"";
    if(!nome) return erroAcesso("Informe seu nome completo.");
    if(senha!==s2) return erroAcesso("As senhas não conferem.");
  }

  btn.disabled = true;
  document.getElementById("acessoErro").hidden = true;
  var txtOriginal = btn.textContent;
  btn.textContent = criar? "Criando…" : "Entrando…";

  var passo = criar ? nuvem.criarConta(nome, email, senha) : nuvem.entrar(email, senha);
  passo.then(function(r){
    if(r.error) throw r.error;
    var sessao = r.data && r.data.session;
    if(!sessao){
      // acontece quando a confirmação de e-mail está ligada no projeto
      throw new Error("confirme-email");
    }
    nuvem.guardarParaMigrar();
    return nuvem.abrirSessao(sessao).then(function(){
      saveStateNow();
      entrarApp();
      toast("Olá, "+String(nuvem.perfil.nome).split(" ")[0]+".");
    });
  }).catch(function(err){
    btn.disabled = false; btn.textContent = txtOriginal;
    var m = String((err && err.message) || "");
    if(m === "confirme-email")
      return erroAcesso("Conta criada. Confirme o e-mail que você recebeu e depois entre por aqui.");
    if(m === "sem-perfil")
      return erroAcesso("Sua conta existe, mas ainda não tem perfil na equipe. Peça ao administrador para liberar.");
    if(m === "inativo")
      return erroAcesso("Sua conta está desativada. Fale com o administrador de expansão.");
    if(/Invalid login/i.test(m))
      return erroAcesso("E-mail ou senha incorretos.");
    if(/already registered|already been registered/i.test(m))
      return erroAcesso("Já existe uma conta com esse e-mail. Use “Já tenho conta — entrar”.");
    if(/Email .*invalid|invalid format/i.test(m))
      return erroAcesso("Este e-mail não foi aceito pelo servidor. Confira se está escrito certo.");
    if(/rate limit|too many/i.test(m))
      return erroAcesso("Muitas tentativas seguidas. Espere um minuto e tente de novo.");
    erroAcesso(m || "Não consegui falar com o servidor. Confira sua conexão.");
  });
}

function sair(){
  if(naNuvem()){
    nuvem.sairDaConta().then(function(){
      nuvem.perfil = null; nuvem.perfis = []; nuvem.espelho = {};
      state.leads = []; state.usuarios = []; state.sessaoId = null; state.activeLeadId = null;
      state.ultimaSessaoNuvem = null;
      saveStateNow();
      ui.acessoModo = "entrar";
      mostrarAcesso();
    });
    return;
  }
  state.sessaoId = null; saveStateNow(); mostrarAcesso();
}

       '<button class="btn btn-sm btn-ghost" data-action="sair" title="Sair">'+ico("proibido",14)+"</button></div>")
    : "Seus dados ficam salvos neste navegador.";
  if(eu) document.getElementById("sidebarFoot").insertAdjacentHTML("beforeend", '<div class="selo" id="selo"></div>');
  atualizarSelo();

// Ações que só o Administrador dispara. O Editor nem vê estes botões,
// mas esconder botão não é permissão: a trava fica aqui, antes do switch,
// e a de verdade fica no RLS do banco (papeis-editor.sql).
var ACOES_SO_ADMIN = {
  "novo-usuario":1, "editar-usuario":1, "salvar-usuario":1,
  "excluir-usuario":1, "gerar-convite":1
};

function handle(action, el){
  var l;
  if(ACOES_SO_ADMIN[action] && !ehAdmin()){
    toast("Só o Administrador mexe em usuários.");
    return;
  }
  switch(action){
    case "ir":
      fecharMais();
      // sair da área de ramos fecha o subsegmento aberto, senão ele
      // reaparece quando a pessoa volta
      if(el.dataset.view !== "ramos"){ ui.produtoAberto = null; }
      ui.view = el.dataset.view;
      if(el.dataset.view === "parceiros" && el.dataset.id) ui.pcRamo = el.dataset.id;
      if(el.dataset.aba) ui.admAba = el.dataset.aba;
      render(); break;
    case "tema":
      ui.tema = el.dataset.tema;
      try{ localStorage.setItem("bussola_tema", ui.tema); }catch(e){}
      aplicarTema(); break;

    case "abrir-busca": fecharMais(); abrirBusca(""); break;
    case "abrir-mais": document.getElementById("sheetOverlay").hidden = false; break;
    case "fechar-mais": fecharMais(); break;
    case "busca-sugestao": abrirBusca(el.dataset.q); break;
    case "busca-abrir": abrirResultado(parseInt(el.dataset.i,10)); break;

    case "novo-lead": leadModal(null); break;
    case "editar-lead": leadModal(findLead(el.dataset.id)); break;
    case "salvar-lead": {
      var id = el.dataset.id, dados = {
        nome: (document.getElementById("mNome").value||"").trim()||"Novo candidato",
        telefone: document.getElementById("mTel").value.trim(),
        cidade: document.getElementById("mCidade").value.trim(),
        estado: document.getElementById("mUF").value.trim().toUpperCase(),
        origem: document.getElementById("mOrigem").value.trim()
      };
      if(id){ l = findLead(id); if(l){ Object.assign(l, dados); l.atualizadoEm = nowISO(); } }
      else {
        l = novoLead(dados.nome); Object.assign(l, dados);
        state.leads.push(l); state.activeLeadId = l.id;
        ui.view = "atendimento"; ui.openEtapas = {1:true};
      }
      saveStateNow(); closeModal(); render();
      toast(id? "Candidato atualizado." : "Atendimento criado.");
      break;
    }
    case "abrir-lead": {
      state.activeLeadId = el.dataset.id;
      ui.view = "atendimento"; ui.openEtapas = {}; ui.calc.roy = null;
      var al = findLead(el.dataset.id), pe = al? proximaEtapaPendente(al) : null;
      if(pe) ui.openEtapas[pe] = true;
      saveStateNow(); render(); break;
    }
    case "excluir-lead":
      if(window.confirm("Excluir este atendimento? Não dá para desfazer.")){
        state.leads = state.leads.filter(function(x){ return x.id!==el.dataset.id; });
        if(state.activeLeadId===el.dataset.id) state.activeLeadId = null;
        saveStateNow(); render();
      }
      break;
    case "mudar-status":
      l = findLead(el.dataset.id);
      if(l){ l.status = el.value; l.atualizadoEm = nowISO(); saveStateNow(); render(); }
      break;
    case "marcar-feito":
      l = findLead(el.dataset.id);
      if(l){ l.proximaFeita = true; l.atualizadoEm = nowISO(); saveStateNow(); render(); }
      break;

    case "toggle-etapa-aberta": {
      var n = el.dataset.n;
      ui.openEtapas[n] = !ui.openEtapas[n];
      var c = document.querySelector('[data-etapa="'+n+'"]');
      if(c) c.classList.toggle("open", !!ui.openEtapas[n]);
      break;
    }
    case "toggle-etapa": {
      l = activeLead(); if(!l) return;
      var nn = el.dataset.n;
      l.etapas[nn] = !l.etapas[nn]; l.atualizadoEm = nowISO();
      saveStateNow(); render(); break;
    }
    case "concluir-etapa": {
      l = activeLead(); if(!l) return;
      var ne = parseInt(el.dataset.n,10);
      if(l.etapas[ne]){ l.etapas[ne] = false; }
      else {
        l.etapas[ne] = true;
        ui.openEtapas = {};
        var seg = proximaEtapaPendente(l);
        if(seg) ui.openEtapas[seg] = true;
        if(ne>=3 && l.status==="Novo lead") l.status = "Qualificação";
        if(ne>=5 && (l.status==="Novo lead"||l.status==="Contato iniciado"||l.status==="Qualificação")) l.status = "Apresentação";
        if(ne>=9 && ["Apresentação"].indexOf(l.status)>-1) l.status = "Análise";
        if(ne>=11 && ["Análise","Apresentação"].indexOf(l.status)>-1) l.status = "Proposta";
      }
      l.atualizadoEm = nowISO(); saveStateNow(); render();
      setTimeout(function(){
        var pe = proximaEtapaPendente(l);
        var alvo = pe? document.querySelector('[data-etapa="'+pe+'"]') : null;
        if(alvo) alvo.scrollIntoView({behavior:"smooth", block:"center"});
      },60);
      break;
    }
    case "set-qualificacao":
      l = activeLead(); if(!l) return;
      l.qualificacao = (l.qualificacao===el.dataset.q)? "" : el.dataset.q;
      l.atualizadoEm = nowISO(); saveStateNow(); render(); break;
    case "toggle-ramo-lead":
      l = activeLead(); if(!l) return;
      l.ramosInteresse[el.dataset.id] = !l.ramosInteresse[el.dataset.id];
      l.atualizadoEm = nowISO(); saveStateNow(); render(); break;
    case "set-modelo":
      l = activeLead(); if(!l) return;
      l.modeloRecomendado = (l.modeloRecomendado===el.dataset.id)? "" : el.dataset.id;
      ui.calc.roy = null; l.atualizadoEm = nowISO(); saveStateNow(); render(); break;
    case "set-nota":
      l = activeLead(); if(!l) return;
      l.nota = (String(l.nota)===el.dataset.n)? "" : el.dataset.n;
      l.atualizadoEm = nowISO(); saveStateNow(); render(); break;

    case "abrir-ramo":
      ui.ramoAberto = el.dataset.id; ui.view = "ramos"; render();
      setTimeout(function(){
        var a = document.querySelector('[data-ramo-anchor="'+el.dataset.id+'"]');
        if(a) a.scrollIntoView({behavior:"smooth", block:"start"});
      },60);
      break;
    case "fechar-ramo": ui.ramoAberto = null; ui.produtoAberto = null; render(); break;

    case "script-cat": ui.scriptCat = el.dataset.cat; render(); break;
    case "ver-script": {
      var s = scriptById(el.dataset.id);
      if(s) openTexto(s.titulo, preencher(s.texto));
      break;
    }
    case "ver-objecao": {
      var o = OBJECOES().filter(function(x){ return x.ch===el.dataset.ch; })[0];
      if(o) openTexto("Objeção — "+o.t, o.r+"\n\nPergunta de retorno:\n"+o.q);
      break;
    }
    case "registrar-objecao": {
      l = activeLead();
      if(!l){ toast("Abra um atendimento primeiro."); return; }
      var ch = el.dataset.ch;
      if(l.objecoes.some(function(x){ return x.ch===ch; })) toast("Já estava registrada.");
      else {
        var ob = OBJECOES().filter(function(x){ return x.ch===ch; })[0];
        l.objecoes.push({ch:ch, t:ob.t, quando:nowISO()});
        toast("Objeção registrada.");
      }
      l.atualizadoEm = nowISO(); saveStateNow(); render(); break;
    }

    case "toggle-acc": {
      var k = el.dataset.key;
      ui.openAcc[k] = !ui.openAcc[k];
      var acc = el.closest(".acc");
      if(acc) acc.classList.toggle("open", !!ui.openAcc[k]);
      break;
    }
    case "copiar-texto": tryCopy(el.dataset.txt); break;
    case "copy-preview": { var ta=document.getElementById("previewText"); if(ta) tryCopy(ta.value); break; }
    case "close-modal": closeModal(); break;

    case "calc-produto": {
      ui.calc.produto = el.value; ui.calc.base=""; ui.calc.preco=""; ui.calc.qtd="1";
      var w = el.closest(".calc-wrap");
      if(w) w.outerHTML = renderCalcWidget();
      break;
    }
    case "copiar-simulacao": tryCopy(textoSimulacao()); break;

    case "exportar": {
      var payload = {tipo:"bussola-grupo-e", versao:3, exportadoEm:new Date().toISOString(),
                     consultorNome:state.consultorNome, leads:state.leads};
      var txt = JSON.stringify(payload,null,2);
      if(downloadsCap){
        downloadsCap.save({filename:"bussola-backup.json", data:txt}).then(function(){ toast("Backup salvo."); })
          .catch(function(err){ if(!err||err.code!=="declined") openTexto("Backup (copie e salve)", txt); });
      } else openTexto("Backup — copie e salve num arquivo .json", txt);
      break;
    }
    /* ---------- Administração ---------- */
    case "adm-aba": ui.admAba = el.dataset.k; render(); break;
    case "adm-ramo": ui.admRamo = el.dataset.id; render(); break;
    case "restaurar-colecao":
      if(naNuvem()){
        openModal("Repor o conteúdo original",
          '<p class="muted" style="margin:0 0 12px;">Com o banco ligado, o conteúdo de verdade vive lá — o que existe no código do site é apenas dado de exemplo. Apagar aqui deixaria a equipe sem conteúdo nenhum.</p>'+
          '<p class="muted" style="margin:0;">Para repor a versão original, rode de novo o arquivo <b>seed-conteudo.sql</b> no SQL Editor do Supabase. Ele sobrescreve o que foi editado e devolve o conteúdo como veio dos documentos oficiais.</p>');
        return;
      }
      if(window.confirm("Descartar suas edições e voltar ao conteúdo original?")){
        db.restaurar(el.dataset.c); render(); toast("Conteúdo original restaurado.");
      }
      break;
    case "sair": if(window.confirm("Sair da sua conta?")) sair(); break;

// Reduz a imagem no próprio navegador antes de enviar: uma logo de banco
// não precisa de mais que 400px, e assim o arquivo sai de megabytes para
// poucos kilobytes. WebP quando o navegador sabe gerar; PNG quando não.
function reduzirImagem(arquivo, ladoMax){
  ladoMax = ladoMax || 400;
  return new Promise(function(ok, falha){
    if(!arquivo || !/^image\//.test(arquivo.type||"")) return falha(new Error("nao-imagem"));
    if(arquivo.size > 8*1024*1024) return falha(new Error("grande-demais"));
    var leitor = new FileReader();
    leitor.onerror = function(){ falha(new Error("leitura")); };
    leitor.onload = function(){
      var img = new Image();
      img.onerror = function(){ falha(new Error("formato")); };
      img.onload = function(){
        var e = Math.min(1, ladoMax/Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width*e)), a = Math.max(1, Math.round(img.height*e));
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = a;
        var ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, w, a);
        var mime = "image/webp";
        var dataUrl = cv.toDataURL(mime, .9);
        if(dataUrl.indexOf("data:image/webp") !== 0){   // navegador sem WebP
          mime = "image/png"; dataUrl = cv.toDataURL(mime);
        }
        var ext = mime === "image/webp" ? "webp" : "png";
        cv.toBlob(function(blob){
          if(!blob) return falha(new Error("conversao"));
          ok({blob:blob, dataUrl:dataUrl, mime:mime, ext:ext, largura:w, altura:a});
        }, mime, .9);
      };
      img.src = String(leitor.result);
    };
    leitor.readAsDataURL(arquivo);
  });
}

function lerJson(input, aoLer){
  var f = input.files && input.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{ aoLer(JSON.parse(String(rd.result))); }
    catch(err){ toast("Arquivo inválido."); }
  };
  rd.readAsText(f); input.value = "";
}

      if(m === "nenhum-casou")   return toast("Nenhum município da planilha bateu com a base. Confira se há coluna de UF.");
      if(m === "planilha-vazia") return toast("A planilha está vazia.");
      if(m === "sem-xlsx")       return toast("Não consegui carregar o leitor de .xlsx. Salve como CSV e tente de novo.");
      toast("Não consegui ler: "+(m || "erro"));
    });
    return;
  }

  // importação da planilha da rede
  var elRede = e.target.closest('[data-action-change="importar-rede"]');
  if(elRede){
    var arq = elRede.files && elRede.files[0];
    elRede.value = "";
    if(!arq) return;
    toast("Lendo a planilha…");
    lerPlanilha(arq).then(function(lista){
      var antes = FRANQUIAS().length;
      var ufs = Object.keys(contarPorUF(lista)).length;
      if(!window.confirm(
        "A planilha tem "+lista.length+" franquias em "+ufs+" estados.\n\n"+
        "Isso SUBSTITUI a lista atual"+(antes? " ("+antes+" registros)" : "")+". Continuar?"
      )) return;
      db.set("franquias", lista);
      ui.admRedeLimite = 40; ui.admRedeBusca = "";
      render();
      toast(lista.length+" franquias importadas.");
    }).catch(function(err){
      var m = String((err && err.message) || "");
      if(m === "colunas")
        return toast("Não achei as colunas de nome, estado e cidade. Confira o cabeçalho da planilha.");
      if(m === "planilha-vazia" || m === "sem-linhas")
        return toast("A planilha não tem linhas de franquia.");
      if(m === "sem-xlsx")
        return toast("Não consegui carregar o leitor de .xlsx. Salve a planilha como CSV e tente de novo.");
      toast("Não consegui ler a planilha: "+(m || "erro"));
    });
    return;
  }

  // envio da logo do parceiro
  var elL = e.target.closest('[data-action-change="enviar-logo"]');
  if(elL){
    var arq = elL.files && elL.files[0];
    elL.value = "";
    if(!arq) return;
    var campo = elL.dataset.campo || "logo";
    var box = document.getElementById("fm_"+campo+"_box");
    if(!box) return;
    var botao = elL.closest("label");
    if(botao) botao.style.opacity = ".5";
    toast("Preparando a imagem…");
    nuvem.enviarLogo(arq).then(function(url){
      box.dataset.url = url;
      var atual = box.querySelector(".pc-logo");
      if(atual) atual.outerHTML = previewLogo(url);
      var rem = box.querySelector('[data-action="remover-logo"]');
      if(rem) rem.hidden = false;
      toast(naNuvem()? "Logo enviada." : "Logo carregada (fica só neste navegador).");
    }).catch(function(err){
      var m = String((err && err.message) || "");
      if(m === "nao-imagem")      return toast("Escolha um arquivo de imagem (PNG, JPG, SVG…).");
      if(m === "grande-demais")   return toast("Imagem acima de 8 MB. Escolha uma menor.");
      if(m === "formato")         return toast("Não consegui abrir essa imagem. Tente um PNG ou JPG.");
      if(/bucket|not found|404/i.test(m))
        return toast("O armazenamento ainda não foi criado no Supabase. Veja o passo do balde “parceiros”.");
      toast("Não consegui enviar: "+(m || "erro"));
    }).then(function(){
      if(botao) botao.style.opacity = "";
    });
    return;
  }

  var elR = e.target.closest('[data-action-change="importar-equipe"]');
  if(elR) return lerJson(elR, function(d){
    if(d.tipo!=="bussola-relatorio" || !d.usuarioId) return toast("Este arquivo não é um relatório de consultor.");
    state.equipe = (state.equipe||[]).filter(function(r){ return r.usuarioId!==d.usuarioId; });
    state.equipe.push({usuarioId:d.usuarioId, nome:d.nome, papel:d.papel, enviadoEm:d.enviadoEm, leads:d.leads||[]});
    saveStateNow(); render();
    toast("Relatório de "+d.nome+" importado ("+(d.leads||[]).length+" atendimentos).");
  });

  var elC = e.target.closest('[data-action-change="importar-convite"]');
  if(elC) return lerJson(elC, function(d){
    if(d.tipo!=="bussola-convite" || !d.usuario) return toast("Este arquivo não é um convite.");
    state.usuarios = (state.usuarios||[]).filter(function(u){ return u.id!==d.usuario.id && u.usuario!==d.usuario.usuario; });
    state.usuarios.push(d.usuario);
    if(d.conteudo && Object.keys(d.conteudo).length) state.conteudo = d.conteudo;
    state.sessaoId = null;
    saveStateNow(); INDICE = null;
    toast("Convite aceito. Entre com o usuário "+d.usuario.usuario+".");
    mostrarAcesso();
  });

  var el = e.target.closest('[data-action-change="importar"]');
  if(!el) return;
  var f = el.files && el.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(String(rd.result));
      if(Array.isArray(d.leads)){
        if(naNuvem()){
          // na nuvem, o backup entra como atendimentos novos seus — com id
          // novo, para não sobrescrever nada que já esteja no banco
          var eu2 = usuarioAtual();
          d.leads.forEach(function(l){
            var c = clonar(l);
            c.id = uuid4(); c.donoId = eu2.id; c.donoNome = eu2.nome;
            c.atualizadoEm = nowISO();
            state.leads.push(c);
          });
        } else state.leads = d.leads;
      }
      if(typeof d.consultorNome==="string") state.consultorNome = d.consultorNome;
      saveStateNow(); render(); toast(naNuvem()? "Backup importado para a nuvem." : "Backup importado.");
    }catch(err){ toast("Arquivo inválido."); }
  };
  rd.readAsText(f); el.value = "";
});

function FRANQUIAS(){ return db.get("franquias"); }

// ---- filtros ----
function opcoesRede(){
  var negs = {}, mods = {};
  FRANQUIAS().forEach(function(f){
    (f.negocios||[]).forEach(function(n){ negs[n] = (negs[n]||0)+1; });
    if(f.modalidade) mods[f.modalidade] = (mods[f.modalidade]||0)+1;
  });
  function ordenar(o){
    return Object.keys(o).map(function(k){ return {v:k, n:o[k]}; })
      .sort(function(a,b){ return b.n-a.n || a.v.localeCompare(b.v); });
  }
  return {negocios:ordenar(negs), modalidades:ordenar(mods)};
}

function filtroRede(){
  return ui.rede || (ui.rede = {situacao:"Ativo", negocio:"", modalidade:"", busca:"", uf:null});
}

function franquiasFiltradas(){
  var f = filtroRede();
  var termo = normalizar(f.busca||"").trim();
  return FRANQUIAS().filter(function(x){
    if(f.situacao && x.situacao !== f.situacao) return false;
    if(f.modalidade && x.modalidade !== f.modalidade) return false;
    if(f.negocio && (x.negocios||[]).indexOf(f.negocio) < 0) return false;
    if(termo && normalizar(x.cidade+" "+x.nome+" "+x.uf).indexOf(termo) < 0) return false;
    return true;
  });
}

function contarPorUF(lista){
  var c = {};
  lista.forEach(function(x){ if(x.uf) c[x.uf] = (c[x.uf]||0)+1; });
  return c;
}
function contarPorCidade(lista, uf){
  var c = {};
  lista.forEach(function(x){
    if(uf && x.uf !== uf) return;
    var k = x.cidade + "|" + x.uf;
    c[k] = (c[k]||0)+1;
  });
  return Object.keys(c).map(function(k){
    var p = k.split("|");
    return {cidade:p[0], uf:p[1], n:c[k]};
  }).sort(function(a,b){ return b.n-a.n || a.cidade.localeCompare(b.cidade); });
}

// ---- o desenho ----
// area proporcional ao número, não o raio: é assim que a bolha não mente
function raioBolha(n, maior, escala){
  if(!n) return 0;
  var min = 7*escala, max = 30*escala;
  return min + (max-min) * Math.sqrt(n/Math.max(1,maior));
}

function svgMapa(contagem, opt){
  opt = opt || {};
  var escala = opt.escala || 1;
  var sel = filtroRede().uf;
  var maior = 0;
  Object.keys(contagem).forEach(function(uf){ if(contagem[uf] > maior) maior = contagem[uf]; });

  var bolhas = Object.keys(UFS).map(function(uf){
    var n = contagem[uf] || 0;
    var u = UFS[uf], r = raioBolha(n, maior, escala);
    var ativo = sel === uf;
    if(!n){
      // estado sem franquia continua no mapa, apagado: mostra onde falta
      return '<g class="mapa-uf mapa-uf-zero" data-action="mapa-uf" data-uf="'+uf+'" tabindex="0" role="button" aria-label="'+esc(u.n)+': nenhuma franquia">'+
        '<circle cx="'+u.x+'" cy="'+u.y+'" r="'+(5*escala)+'"></circle>'+
        '<title>'+esc(u.n)+' — nenhuma franquia</title></g>';
    }
    return '<g class="mapa-uf'+(ativo?" ativo":"")+'" data-action="mapa-uf" data-uf="'+uf+'" tabindex="0" role="button" aria-label="'+esc(u.n)+': '+n+' franquias">'+
      '<circle class="mapa-halo" cx="'+u.x+'" cy="'+u.y+'" r="'+(r+7*escala).toFixed(1)+'"></circle>'+
      '<circle class="mapa-bolha" cx="'+u.x+'" cy="'+u.y+'" r="'+r.toFixed(1)+'"></circle>'+
      (r > 17*escala ? '<text class="mapa-num" x="'+u.x+'" y="'+u.y+'">'+n+"</text>" : "")+
      '<title>'+esc(u.n)+" — "+n+(n===1?" franquia":" franquias")+"</title></g>";
  }).join("");

  // A sigla aparece sempre: uma bolha grande sem nome não diz nada. O
  // número entra dentro só quando cabe.
  var rotulos = opt.rotulos === false ? "" : Object.keys(UFS).map(function(uf){
    var n = contagem[uf]||0;
    var u = UFS[uf];
    var r = raioBolha(n, maior, escala);
    var dentro = r > 17*escala;
    return '<text class="mapa-sigla'+(dentro?" forte":"")+'" x="'+u.x+'" y="'+
      (u.y + r + 16*escala).toFixed(1)+'">'+uf+(dentro? "" : (n? " "+n : ""))+"</text>";
  }).join("");

  // fios das chamadas laterais do Nordeste
  var fios = Object.keys(UFS).filter(function(uf){ return UFS[uf].ax != null; }).map(function(uf){
    var u = UFS[uf];
    if(!(contagem[uf]||0)) return "";
    return '<line class="mapa-fio" x1="'+u.ax+'" y1="'+u.ay+'" x2="'+(u.x-16)+'" y2="'+u.y+'"></line>'+
           '<circle class="mapa-ponto" cx="'+u.ax+'" cy="'+u.ay+'" r="'+(3*escala)+'"></circle>';
  }).join("");

  return '<svg class="mapa-svg" viewBox="-10 0 1200 '+MAPA_H+'" role="img" '+
    'aria-label="Mapa do Brasil com a distribuição das franquias por estado" preserveAspectRatio="xMidYMid meet">'+
    '<path class="mapa-br" d="'+MAPA_PATH+'"></path>'+
    fios + rotulos + bolhas +
    "</svg>";
}

// ---- tela cheia da rede ----
function renderRede(){
  var f = filtroRede();
  var todas = FRANQUIAS();
  var lista = franquiasFiltradas();
  var porUF = contarPorUF(lista);
  var ops = opcoesRede();
  var ufs = Object.keys(porUF).length;
  var cidades = contarPorCidade(lista);

  var h = '<div class="topline"><div><div class="eyebrow">Onde já estamos</div>'+
    '<h1 class="page-title">Mapa da rede</h1>'+
    '<p class="page-sub">A malha de franquias hoje. Serve para mostrar densidade ao candidato e para você enxergar onde a rede ainda é rala.</p></div>'+
    '<div class="row"><button class="btn" data-action="abrir-busca">'+ico("lupa",15)+'Buscar</button>'+
    '<button class="btn btn-primary" data-action="ir" data-view="adm" data-aba="rede" data-admin="1">'+ico("chave",15)+'Gerenciar rede</button></div></div>';

  if(!todas.length){
    h += '<div class="empty">Nenhuma franquia cadastrada ainda.'+
      (podeEditar()? '<br><button class="btn btn-primary" data-action="ir" data-view="adm" data-aba="rede">Importar a planilha</button>':"")+"</div>";
    document.getElementById("appMain").innerHTML = h;
    return;
  }

  h += '<div class="section"><div class="grid grid-stats">'+
    kpi(lista.length,"Franquias","loja")+
    kpi(ufs+"/27","Estados","grade")+
    kpi(cidades.length,"Cidades","predio")+
    kpi(porUF[maiorUF(porUF)]||0,(maiorUF(porUF)||"—")+" — maior praça","alvo")+
    "</div></div>";

  h += '<div class="section">'+filtrosRede(ops, todas.length, lista.length)+"</div>";

  h += '<div class="mapa-caixa"><div class="mapa-wrap">'+svgMapa(porUF)+"</div>"+
    legendaMapa(porUF)+"</div>";

  // painel do estado escolhido
  if(f.uf){
    var doUF = lista.filter(function(x){ return x.uf === f.uf; });
    var cidUF = contarPorCidade(lista, f.uf);
    h += '<div class="section" style="margin-top:26px;"><div class="section-head">'+
      '<h2>'+ico("predio",17)+esc((UFS[f.uf]||{}).n || f.uf)+
      ' <span class="pill">'+doUF.length+(doUF.length===1?" franquia":" franquias")+"</span></h2>"+
      '<button class="btn btn-sm btn-ghost" data-action="mapa-uf" data-uf="'+f.uf+'">Limpar seleção</button></div>';
    h += cidUF.length
      ? '<div class="cid-grade">'+cidUF.map(function(c){
          return botaoCidade(c, false);
        }).join("")+"</div>"
      : '<div class="empty">Nenhuma franquia neste estado com os filtros atuais.</div>';
    h += "</div>";
  } else {
    h += '<div class="section" style="margin-top:26px;"><div class="section-head"><h2>'+
      ico("escala",17)+"Maiores praças</h2>"+
      '<span class="faint">toque num estado do mapa para abrir</span></div>'+
      '<div class="cid-grade">'+cidades.slice(0,18).map(function(c){
        return botaoCidade(c, true);
      }).join("")+"</div></div>";
  }

  document.getElementById("appMain").innerHTML = h;
}

function botaoCidade(c, comUF){
  return '<button class="cid-item" data-action="abrir-cidade" data-c="'+esc(c.cidade)+'" data-u="'+esc(c.uf)+'">'+
    '<span class="cid-nome">'+esc(c.cidade)+
      (comUF? ' <span class="faint">'+esc(c.uf)+"</span>" : "")+"</span>"+
    '<span class="cid-num">'+c.n+"</span></button>";
}

// Quem são as franquias daquela cidade. Abre em modal para não perder o
// mapa de vista, e mostra tudo o que a planilha traz de cada uma.
function modalCidade(cidade, uf){
  var lista = franquiasFiltradas().filter(function(x){
    return x.cidade === cidade && x.uf === uf;
  });
  var titulo = cidade + " · " + uf;
  if(!lista.length){
    openModal(titulo, '<div class="empty">Nenhuma franquia aqui com os filtros atuais.</div>');
    return;
  }
  var ativas = lista.filter(function(x){ return x.situacao === "Ativo"; }).length;
  var corpo = '<p class="muted" style="margin:0 0 16px;font-size:13.5px;">'+
    "<b>"+lista.length+(lista.length===1? " franquia" : " franquias")+"</b>"+
    (ativas !== lista.length? " · "+ativas+" ativa"+(ativas===1?"":"s") : "")+
    " nesta cidade.</p>";
  corpo += '<div class="stack">'+lista.map(fichaFranquia).join("")+"</div>";
  openModal(titulo, corpo);
}

function fichaFranquia(f){
  var linhas = [];
  if(f.bairro)     linhas.push(["Bairro", f.bairro]);
  if(f.cep)        linhas.push(["CEP", f.cep]);
  if(f.modalidade) linhas.push(["Modalidade", f.modalidade]);

function maiorUF(porUF){
  var melhor = null;
  Object.keys(porUF).forEach(function(uf){ if(!melhor || porUF[uf] > porUF[melhor]) melhor = uf; });
  return melhor;
}

function legendaMapa(porUF){
  var maior = porUF[maiorUF(porUF)] || 0;
  if(!maior) return "";
  var marcos = [1, Math.max(2,Math.round(maior/4)), Math.max(3,Math.round(maior/2)), maior];
  var vistos = {}, itens = [];
  marcos.forEach(function(n){
    if(vistos[n]) return; vistos[n] = 1;
    var r = raioBolha(n, maior, 1) * 0.42;
    itens.push('<span class="lg-item"><svg width="'+(r*2+4)+'" height="'+(r*2+4)+'" aria-hidden="true">'+
      '<circle class="mapa-bolha" cx="'+(r+2)+'" cy="'+(r+2)+'" r="'+r.toFixed(1)+'"></circle></svg>'+
      "<span>"+n+"</span></span>");
  });
  return '<div class="mapa-legenda"><span class="faint">Tamanho da bolha = franquias no estado</span>'+
    '<span class="lg-escala">'+itens.join("")+"</span></div>";
}

/* ---- importação ---- */
// Divide uma linha de CSV respeitando aspas — nomes de empresa vêm cheios
// de vírgula, e sem isso a planilha entra toda torta.
function csvLinha(linha, sep){
  var out = [], atual = "", aspas = false;
  for(var i=0;i<linha.length;i++){
    var c = linha[i];
    if(aspas){
      if(c === '"' && linha[i+1] === '"'){ atual += '"'; i++; }
      else if(c === '"') aspas = false;
      else atual += c;
    } else if(c === '"') aspas = true;
    else if(c === sep){ out.push(atual); atual = ""; }
    else atual += c;
  }
  out.push(atual);
  return out;
}
function lerCsv(texto){
  texto = texto.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  var primeira = (texto.split("\n")[0] || "");
  var sep = (primeira.split(";").length > primeira.split(",").length) ? ";" : ",";
  return texto.split("\n").filter(function(l){ return l.trim(); })
              .map(function(l){ return csvLinha(l, sep); });
}

// Reconhece a coluna pelo nome, sem depender da ordem, do acento ou da
// pontuação: "NEGÓCIO(S)", "Negocios" e "negócio" caem todos no mesmo campo.
var COLUNAS_REDE = {
  nome:       ["nome","razao social","nome razao social","franqueado","razao"],
  cep:        ["cep","cep."],
  bairro:     ["bairro","distrito"],
  uf:         ["estado","uf","sigla"],
  cidade:     ["cidade","municipio"],
  data:       ["data de cadastro","data cadastro","data","cadastro"],
  situacao:   ["situacao","status"],
  negocios:   ["negocio s","negocios","negocio","produtos","produto s"],
  modalidade: ["modalidade","formato","tipo"]
};
// mesma limpeza dos dois lados da comparação
function chaveColuna(t){
  return normalizar(String(t||"")).replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
function mapearColunas(cabecalho){
  var mapa = {};
  cabecalho.forEach(function(titulo, i){
    var t = chaveColuna(titulo);
    if(!t) return;
    Object.keys(COLUNAS_REDE).forEach(function(campo){
      if(mapa[campo] != null) return;
      var vale = COLUNAS_REDE[campo].some(function(alias){
        var a = chaveColuna(alias);
        return t === a || t.indexOf(a) === 0;
      });
      if(vale) mapa[campo] = i;
    });
  });
  return mapa;
}

function linhasParaFranquias(linhas){
  if(!linhas.length) throw new Error("planilha-vazia");
  var mapa = mapearColunas(linhas[0]);
  if(mapa.nome == null || mapa.uf == null || mapa.cidade == null) throw new Error("colunas");
  function val(l, i){ return i == null ? "" : String(l[i] == null ? "" : l[i]).trim(); }
  var out = [], n = 0;
  linhas.slice(1).forEach(function(l){
    var nome = val(l, mapa.nome);
    if(!nome) return;
    n++;
    var negs = val(l, mapa.negocios).split(/[,;]/).map(function(s){ return s.trim(); }).filter(Boolean);
    out.push({
      id: "f"+n,
      nome: nome,
      cep: val(l, mapa.cep),
      bairro: val(l, mapa.bairro),
      uf: val(l, mapa.uf).toUpperCase().slice(0,2),
      cidade: val(l, mapa.cidade),
      data: val(l, mapa.data),
      situacao: val(l, mapa.situacao) || "Ativo",
      negocios: negs,
      modalidade: val(l, mapa.modalidade)
    });
  });
  if(!out.length) throw new Error("sem-linhas");
  return out;
}

// O .xlsx é um zip: precisa de biblioteca. Carrega só na hora do uso, e se
// não vier, explica que dá para salvar como CSV.
var CDN_XLSX = ["https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
                "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"];
function carregarXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  var tentativa = Promise.reject();
  CDN_XLSX.forEach(function(u){ tentativa = tentativa.catch(function(){ return carregarScript(u); }); });
  return tentativa.then(function(){
    if(!window.XLSX) throw new Error("sem-xlsx");
    return window.XLSX;
  }).catch(function(){ throw new Error("sem-xlsx"); });
}

// Lê a planilha e devolve as linhas cruas. Quem chama decide o que fazer
// com elas — a rede e os indicadores usam o mesmo leitor.
function lerLinhasPlanilha(arquivo){
  var ext = (arquivo.name||"").toLowerCase().split(".").pop();
  if(ext === "csv" || /text\/csv|text\/plain/.test(arquivo.type||"")){
    return arquivo.text().then(lerCsv);
  }
  return carregarXlsx().then(function(XLSX){
    return arquivo.arrayBuffer().then(function(buf){
      var wb = XLSX.read(buf, {type:"array"});
      var ws = wb.Sheets[wb.SheetNames[0]];
      return XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
    });
  });
}
function lerPlanilha(arquivo){
  return lerLinhasPlanilha(arquivo).then(linhasParaFranquias);
}

// A lista só é expandida quando alguém abre a tela: 5.565 objetos custam
// caro para montar em celular, e a maioria das sessões nunca chega aqui.
var MUNICIPIOS = null;
function municipios(){
  if(MUNICIPIOS) return MUNICIPIOS;
  MUNICIPIOS = [];
  Object.keys(MUNICIPIOS_RAW).forEach(function(uf){
    var pre = COD_UF[uf];
    MUNICIPIOS_RAW[uf].forEach(function(linha){
      var nome = linha.slice(5);
      MUNICIPIOS.push({cod: pre + linha.slice(0,5), nome: nome, uf: uf, busca: normalizar(nome)});
    });
  });
  return MUNICIPIOS;
}
function municipioPorCodigo(cod){
  var l = municipios();
  for(var i=0;i<l.length;i++) if(l[i].cod === cod) return l[i];
  return null;
}
// casa uma cidade da planilha da rede com o município oficial
function acharMunicipio(nome, uf){
  var alvo = normalizar(nome||"").trim();
  if(!alvo) return null;
  var l = municipios();
  for(var i=0;i<l.length;i++){
    if(l[i].busca === alvo && (!uf || l[i].uf === uf)) return l[i];
  }
  return null;
}
function buscarMunicipios(termo, limite){
  var q = normalizar(termo||"").trim();
  if(q.length < 2) return [];
  var l = municipios(), comeca = [], contem = [];
  for(var i=0;i<l.length && comeca.length + contem.length < 200;i++){
    var p = l[i].busca.indexOf(q);
    if(p === 0) comeca.push(l[i]);
    else if(p > 0) contem.push(l[i]);
  }
  // quem já tem franquia sobe: é a praça sobre a qual temos algo a dizer
  function peso(m){ return franquiasDaCidade(m).length ? 0 : 1; }
  return comeca.concat(contem)
    .sort(function(a,b){ return peso(a)-peso(b) || a.nome.localeCompare(b.nome); })
    .slice(0, limite || 8);
}

/* ---------------------------------------------------------------------
   CAMADA 1 — o que a nossa rede prova naquela praça
   --------------------------------------------------------------------- */
function franquiasDaCidade(m){
  if(!m) return [];
  return FRANQUIAS().filter(function(f){
    return f.uf === m.uf && normalizar(f.cidade||"") === m.busca;
  });
}

// A sede distorce a leitura: Umuarama tem produtos-piloto em proporção que
// não se repete em lugar nenhum. Praças marcadas como sede saem da base de
// comparação para não virarem recomendação errada.
function ehSede(m){
  return (db.get("geoConfig").sedes || []).indexOf(m.cod) > -1;
}

function mixNacional(){
  var cont = {}, total = 0;
  FRANQUIAS().forEach(function(f){
    if(f.situacao === "Inativo") return;
    total++;
    (f.negocios||[]).forEach(function(n){ cont[normalizar(n)] = (cont[normalizar(n)]||0)+1; });
  });
  return {cont: cont, total: total};
}

// O mix daquela cidade contra a média do país. Só vira sinal quando há
// base suficiente — com 2 franquias, qualquer porcentagem é ruído.
function mixDaPraca(m){
  var locais = franquiasDaCidade(m).filter(function(f){ return f.situacao !== "Inativo"; });
  var nac = mixNacional();
  if(locais.length < 3 || !nac.total) return {suficiente:false, n:locais.length, itens:[]};
  var cont = {}, rotulo = {};
  locais.forEach(function(f){
    (f.negocios||[]).forEach(function(n){
      var k = normalizar(n);
      cont[k] = (cont[k]||0)+1;
      if(!rotulo[k]) rotulo[k] = n;
    });
  });
  var itens = Object.keys(cont).map(function(k){
    var aqui = cont[k]/locais.length;
    var brasil = (nac.cont[k]||0)/nac.total;
    return {
      chave: k, nome: rotulo[k], qtd: cont[k],
      pctAqui: Math.round(aqui*100),
      pctBrasil: Math.round(brasil*100),
      dif: brasil > 0 ? Math.round((aqui/brasil - 1)*100) : null
    };
  }).sort(function(a,b){ return b.qtd - a.qtd; });
  return {suficiente:true, n:locais.length, itens:itens};
}

function posicaoNoRanking(m){
  var cont = {};
  FRANQUIAS().forEach(function(f){
    var k = f.uf + "|" + normalizar(f.cidade||"");
    cont[k] = (cont[k]||0)+1;
  });
  var lista = Object.keys(cont).map(function(k){ return {k:k, n:cont[k]}; })
    .sort(function(a,b){ return b.n - a.n; });
  var alvo = m.uf + "|" + m.busca;
  for(var i=0;i<lista.length;i++) if(lista[i].k === alvo) return {pos:i+1, de:lista.length};
  return null;
}

/* ---------------------------------------------------------------------
   CAMADA 2 — indicadores importados
   --------------------------------------------------------------------- */
function INDICADORES(){ return db.get("indicadores"); }
function geoConfig(){ return db.get("geoConfig"); }

// O que o IBGE devolveu ao vivo fica só neste navegador — ver
// IBGE_CACHE lá embaixo. É consulta, não conteúdo da empresa: se cada
// vendedor gravasse no banco a coleção inteira ao abrir uma cidade, um
// sobrescreveria o outro, e o RLS recusaria a escrita de quem não é
// administrador. O dado importado sempre vence o dado ao vivo.
function indicadoresDe(m){
  var base = INDICADORES();
  var salvo = (base.porMunicipio && base.porMunicipio[m.cod]) || {};
  var vivo = ibgeCache()[m.cod];
  if(!vivo || !vivo.valores) return salvo;
  var out = {};
  for(var k in vivo.valores) if(salvo[k] == null || salvo[k] === "") out[k] = vivo.valores[k];
  for(var j in salvo) out[j] = salvo[j];
  return out;
}

// Os campos que a tabela de procedência precisa descrever: os importados
// mais os que só existem porque o IBGE respondeu agora.
function camposDaCidade(m){
  var campos = (INDICADORES().campos || []).slice();
  var vivo = ibgeCache()[m.cod];
  ((vivo && vivo.campos) || []).forEach(function(c){
    if(!campos.some(function(x){ return x.id === c.id; })) campos.push(c);
  });
  return campos;
}
function campoIndicador(id){
  var campos = INDICADORES().campos || [];
  for(var i=0;i<campos.length;i++) if(campos[i].id === id) return campos[i];
  return null;
}
// Dinheiro em escala de município: R$ 120 bilhões escrito por extenso
// não cabe na tela nem se lê de relance. Duas casas só quando ajudam.
function fmtDinheiro(v){
  var n = Number(v);
  if(!isFinite(n)) return "—";
  var abs = Math.abs(n);
  if(abs >= 1e9) return "R$ " + (n/1e9).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " bi";
  if(abs >= 1e6) return "R$ " + (n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi";
  if(abs >= 1e3) return "R$ " + (n/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil";
  return "R$ " + n.toLocaleString("pt-BR",{maximumFractionDigits:0});
}
// Formata pelo que o campo é, não pelo tamanho do número.
function fmtCampo(valor, campo){
  return (campo && campo.formato === "moeda") ? fmtDinheiro(valor) : fmtNum(valor);
}
function fmtNum(v){
  if(v == null || v === "") return "—";
  var n = Number(v);
  if(!isFinite(n)) return String(v);
  return n.toLocaleString("pt-BR", {maximumFractionDigits: n < 10 ? 1 : 0});
}

// Estimativas derivadas. Sempre rotuladas como estimativa, com a conta à
// mostra: não existe contagem oficial de pets por município, e fingir que
// existe seria dar ao vendedor um número que ele não pode defender.
function estimativas(m, ind){
  var cfg = geoConfig(), out = [];
  var pop = Number(ind.populacao);
  if(isFinite(pop) && pop > 0){
    if(cfg.taxaPet > 0){
      out.push({
        id:"pets", nome:"Pets (estimativa)",
        valor: Math.round(pop * cfg.taxaPet),
        conta: "população × " + cfg.taxaPet + " pet por habitante",
        fonte: cfg.fontePet || "estimativa de mercado"
      });
    }
    if(cfg.taxaIdoso > 0 && ind.idosos == null){
      out.push({
        id:"idosos", nome:"População 60+ (estimativa)",
        valor: Math.round(pop * cfg.taxaIdoso),
        conta: "população × " + Math.round(cfg.taxaIdoso*100) + "%",
        fonte: cfg.fonteIdoso || "média nacional"
      });
    }
  }
  return out;
}

/* ---------------------------------------------------------------------
   O MOTOR DE ADERÊNCIA

   Cada regra olha um sinal e, quando ele existe, recomenda segmentos com
   o motivo escrito. Regra sem dado simplesmente não dispara — nada de
   inventar aderência a partir de campo vazio.

   A força é deliberadamente grosseira (alta / média): o dado não sustenta
   precisão maior, e um número falsamente preciso convida o vendedor a
   prometer o que não pode.
   --------------------------------------------------------------------- */
var REGRAS_GEO = [
  {
    id:"frota",
    quando: function(c){ return c.ind.frota > 0 && c.pop > 0; },
    avaliar: function(c){
      var porMil = c.ind.frota / c.pop * 1000;
      if(porMil < 250) return null;
      return {
        forca: porMil >= 500 ? "alta" : "média",
        titulo: "Frota grande para o tamanho da cidade",
        evidencia: fmtNum(c.ind.frota) + " veículos — " + Math.round(porMil) +
                   " por mil habitantes" + (porMil >= 500 ? ", acima da média do país" : "") +
                   (c.ind.motos > 0 ? " · " + fmtNum(c.ind.motos) + " são motos" : ""),
        ramos: ["seguros"],
        chaves: ["auto","moto","veic","rastr"],
        fala: "Só de frota, " + c.m.nome + " tem cerca de " + fmtNum(c.ind.frota) +
              " veículos. Seguro auto e moto é onde a maioria dos nossos franqueados começa, porque a necessidade já existe e é renovada todo ano."
      };
    }
  },
  {
    id:"idosos",
    quando: function(c){ return c.idosos > 0 && c.pop > 0; },
    avaliar: function(c){
      var pct = c.idosos / c.pop;
      if(pct < 0.12) return null;
      return {
        forca: pct >= 0.18 ? "alta" : "média",
        titulo: "População madura acima da média",
        evidencia: Math.round(pct*100) + "% da cidade tem 60 anos ou mais (" + fmtNum(c.idosos) + " pessoas)",
        ramos: ["saude","seguros"],
        chaves: ["saude","vida","odont","telemedicina","funeral"],
        fala: "Cerca de " + Math.round(pct*100) + "% de " + c.m.nome +
              " tem 60 anos ou mais. Saúde, telemedicina e vida têm procura natural aí — e são produtos de renovação, não de venda única."
      };
    }
  },
  {
    id:"pets",
    quando: function(c){ return c.pets > 0; },
    avaliar: function(c){
      return {
        forca: "média",
        titulo: "Base de pets relevante",
        evidencia: "cerca de " + fmtNum(c.pets) + " animais (estimativa sobre a população)",
        ramos: ["saude","diversos"],
        chaves: ["pet"],
        fala: "Pela população, " + c.m.nome + " deve ter perto de " + fmtNum(c.pets) +
              " pets. Plano pet é entrada fácil: ticket baixo, decisão rápida e abre a conversa para os outros produtos."
      };
    }
  },
  {
    // Agro: o rebanho e o valor da lavoura dizem se a praça vive da
    // terra. Numa cidade assim o vendedor entra por outra porta — não
    // adianta falar de maquininha para quem tem 100 mil cabeças de gado.
    id:"agro",
    quando: function(c){ return c.ind.bovinos > 0 || c.ind.valorLavoura > 0; },
    avaliar: function(c){
      var bois = Number(c.ind.bovinos) || 0;
      var lavoura = Number(c.ind.valorLavoura) || 0;
      var boisPorHab = c.pop ? bois / c.pop : 0;
      var forte = boisPorHab >= 2 || lavoura >= 500000000;
      if(!forte && boisPorHab < 0.5 && lavoura < 50000000) return null;
      var provas = [];
      if(bois) provas.push(fmtNum(bois) + " cabeças de gado" +
        (boisPorHab >= 1 ? " — " + boisPorHab.toFixed(1) + " por habitante" : ""));
      if(lavoura) provas.push(fmtDinheiro(lavoura) + " em produção agrícola no ano");
      return {
        forca: forte ? "alta" : "média",
        titulo: "Praça do agro",
        evidencia: provas.join(" · "),
        ramos: ["seguros","financeiro","diversos"],
        chaves: ["rural","agro","maquin","consorcio","caminh","imov","vida","patrimon"],
        fala: c.m.nome + " é praça de agro — " + provas[0] + ". Quem produz aí compra máquina, caminhão e terra, "+
              "e o consórcio é a forma como isso é financiado. Seguro rural e de vida entram junto, porque o "+
              "produtor sabe o tamanho do risco dele melhor do que ninguém."
      };
    }
  },
  {
    // Empresas ativas é evidência melhor que população para a linha PJ:
    // cidade-dormitório tem gente e não tem comércio.
    id:"empresas",
    quando: function(c){ return c.ind.empresas > 0 && c.pop > 0; },
    avaliar: function(c){
      var emp = Number(c.ind.empresas);
      var porMil = emp / c.pop * 1000;
      if(porMil < 15) return null;
      var salarios = Number(c.ind.salarios) || 0;
      return {
        forca: porMil >= 30 ? "alta" : "média",
        titulo: "Comércio e serviço com densidade",
        evidencia: fmtNum(emp) + " empresas ativas — " + Math.round(porMil) + " por mil habitantes" +
                   (salarios ? " · " + fmtDinheiro(salarios) + " em salários no ano" : ""),
        ramos: ["pagamentos","financeiro","seguros"],
        chaves: ["empres","pj","maquin","cartao","capital","credito","frota","vida"],
        fala: "São " + fmtNum(emp) + " empresas ativas em " + c.m.nome + ". Cada uma é uma conversa possível de "+
              "maquininha, seguro empresarial e capital de giro — e é uma carteira que se renova sozinha, "+
              "porque empresa não some de um ano para o outro."
      };
    }
  },
  {
    // Só entra quando o dado veio do Censo, não de estimativa: casa é
    // uma apólice por endereço, e o vendedor precisa poder defender o número.
    id:"domicilios",
    quando: function(c){ return c.ind.domicilios > 0; },
    avaliar: function(c){
      var d = c.ind.domicilios;
      if(d < 3000) return null;
      return {
        forca: d >= 50000 ? "alta" : "média",
        titulo: "Base residencial para trabalhar",
        evidencia: fmtNum(d) + " domicílios ocupados" +
                   (c.ind.densidade > 0 ? " · " + fmtNum(c.ind.densidade) + " hab/km²" : ""),
        ramos: ["seguros","financeiro"],
        chaves: ["residencial","resid","casa","imov","consorcio","imobil"],
        fala: "São " + fmtNum(d) + " domicílios em " + c.m.nome +
              ". Seguro residencial e consórcio de imóvel trabalham essa base — é venda de porta em porta que não depende de o cliente ter empresa nem carro."
      };
    }
  },
  {
    id:"porte-grande",
    quando: function(c){ return c.pop >= 200000; },
    avaliar: function(c){
      return {
        forca: c.pop >= 500000 ? "alta" : "média",
        titulo: "Cidade grande, com base empresarial",
        evidencia: fmtNum(c.pop) + " habitantes",
        ramos: ["pagamentos","financeiro","seguros"],
        chaves: ["empres","pj","maquin","cartao","capital","credito"],
        fala: "Com " + fmtNum(c.pop) + " habitantes, " + c.m.nome +
              " tem volume de comércio e serviço para sustentar a linha empresarial — maquininha, seguro empresarial e capital de giro."
      };
    }
  },
  {
    id:"porte-pequeno",
    quando: function(c){ return c.pop > 0 && c.pop < 50000; },
    avaliar: function(c){
      return {
        forca: "média",
        titulo: "Praça pequena, relacionamento vale mais que ponto",
        evidencia: fmtNum(c.pop) + " habitantes",
        ramos: [],
        chaves: [],
        modalidade: "Home Office",
        fala: "Em cidade de " + fmtNum(c.pop) + " habitantes, quem vende é o relacionamento, não a vitrine. " +
              "Home office costuma fazer mais sentido que loja — e o investimento inicial cai."
      };
    }
  },
  {
    id:"rede-vazia",
    quando: function(c){ return c.naCidade === 0; },
    avaliar: function(c){
      var noEstado = c.noEstado;
      return {
        forca: "alta",
        titulo: "Praça ainda sem franqueado",
        evidencia: noEstado > 0
          ? "nenhuma franquia em " + c.m.nome + ", mas " + noEstado + " em " + c.m.uf
          : "nenhuma franquia em " + c.m.uf + " ainda",
        ramos: [],
        chaves: [],
        fala: "Hoje não temos ninguém em " + c.m.nome + "." +
              (noEstado > 0 ? " Em " + c.m.uf + " são " + noEstado + " franqueados, então o modelo já está rodando no estado — ele entraria como o primeiro da cidade, sem disputar carteira com ninguém da rede." : "")
      };
    }
  },
  {
    id:"rede-provada",
    quando: function(c){ return c.naCidade >= 3; },
    avaliar: function(c){
      return {
        forca: "alta",
        titulo: "Praça já provada pela rede",
        evidencia: c.naCidade + " franquias ativas em " + c.m.nome +
                   (c.rank ? " — " + c.rank.pos + "ª maior praça do país" : ""),
        ramos: [],
        chaves: [],
        fala: "Já temos " + c.naCidade + " franqueados em " + c.m.nome +
              ". Ele não vai ser cobaia: o modelo já foi testado nessa cidade, e dá para conversar com quem está lá."
      };
    }
  }
];

function analisarPraca(m){
  var ind = indicadoresDe(m);
  var est = estimativas(m, ind);
  function daEstimativa(id){
    for(var i=0;i<est.length;i++) if(est[i].id === id) return est[i].valor;
    return 0;
  }
  var naCidade = franquiasDaCidade(m).filter(function(f){ return f.situacao !== "Inativo"; }).length;
  var noEstado = FRANQUIAS().filter(function(f){ return f.uf === m.uf && f.situacao !== "Inativo"; }).length;
  var ctx = {
    m: m, ind: ind,
    pop: Number(ind.populacao) || 0,
    idosos: Number(ind.idosos) || daEstimativa("idosos"),
    pets: daEstimativa("pets"),
    naCidade: naCidade, noEstado: noEstado,
    rank: posicaoNoRanking(m),
    mix: mixDaPraca(m),
    estimativas: est
  };

  var sinais = [];
  REGRAS_GEO.forEach(function(r){
    try{
      if(!r.quando(ctx)) return;
      var s = r.avaliar(ctx);
      if(s){ s.id = r.id; sinais.push(s); }
    }catch(e){}
  });
  ctx.sinais = sinais.sort(function(a,b){ return (a.forca==="alta"?0:1) - (b.forca==="alta"?0:1); });
  ctx.produtos = produtosSugeridos(ctx);
  return ctx;
}

// Traduz os sinais em subsegmentos concretos da tabela de comissões, para
// o vendedor sair com o nome do produto e a comissão, não com uma
// categoria abstrata.
function produtosSugeridos(ctx){
  var pontos = {};
  ctx.sinais.forEach(function(s){
    (s.ramos||[]).forEach(function(rid){
      produtosDoRamo(rid).forEach(function(p){
        var casa = !(s.chaves||[]).length || (s.chaves||[]).some(function(k){
          return normalizar(p.p).indexOf(k) > -1;
        });
        if(!casa) return;
        var reg = pontos[p.chave] || (pontos[p.chave] = {prod:p, peso:0, porques:[]});
        reg.peso += (s.forca === "alta" ? 2 : 1);
        if(reg.porques.indexOf(s.titulo) < 0) reg.porques.push(s.titulo);
      });
    });
  });
  // o mix real da praça pesa mais que qualquer inferência
  if(ctx.mix.suficiente){
    ctx.mix.itens.forEach(function(it){
      if(it.dif == null || it.dif < 25) return;
      RAMOS().forEach(function(r){
        produtosDoRamo(r.id).forEach(function(p){
          if(normalizar(p.p).indexOf(it.chave.split(" ")[0]) < 0 &&
             normalizar(r.nome).indexOf(it.chave.split(" ")[0]) < 0) return;
          var reg = pontos[p.chave] || (pontos[p.chave] = {prod:p, peso:0, porques:[]});
          reg.peso += 3;
          var por = "Vende acima da média nesta praça";
          if(reg.porques.indexOf(por) < 0) reg.porques.push(por);
        });
      });
    });
  }
  return Object.keys(pontos).map(function(k){ return pontos[k]; })
    .sort(function(a,b){ return b.peso - a.peso; })
    .slice(0, 8);
}

function painelGeo(a){

    '<button class="btn btn-sm" data-action="copiar-geo" data-c="'+m.cod+'">'+ico("balao",14)+"Copiar resumo</button></div>";

  if(ehSede(m)){
    h += callout("warn","aviso","Esta é uma <b>praça-sede</b>: o mix de produtos daqui não representa o comportamento normal de mercado, porque concentra pilotos e operação própria. Use os números com essa ressalva.");
  }

  // ---- números de cabeçalho
  var ind = a.ind;
  var cartoes = [];

  if(a.pop) cartoes.push(kpi(fmtNum(a.pop), "Habitantes", "usuario"));
  if(a.pop && a.naCidade) cartoes.push(kpi(fmtNum(Math.round(a.pop/a.naCidade)), "Hab. por franquia", "escala"));
  cartoes.push(kpi(a.noEstado, "Franquias em "+m.uf, "grade"));

  // ---- sinais
  h += '<div class="section"><div class="section-head"><h2>'+ico("alvo",17)+"Sinais desta praça</h2></div>";
  if(!a.sinais.length){
    h += '<div class="empty">Ainda não há dados suficientes sobre '+esc(m.nome)+'.'+
      (podeEditar()? '<br><button class="btn btn-sm btn-primary" data-action="ir" data-view="adm" data-aba="geo">Importar indicadores</button>':"")+"</div>";
  } else {
    h += '<div class="grid grid-2">'+a.sinais.map(function(s){
      return '<div class="sinal sinal-'+s.forca+'">'+
        '<div class="row-between" style="gap:10px;align-items:flex-start;">'+
          '<div class="sinal-tit">'+esc(s.titulo)+"</div>"+
          '<span class="pill '+(s.forca==="alta"?"pill-success":"pill-info")+'">'+s.forca+"</span></div>"+
        '<p class="sinal-ev">'+esc(s.evidencia)+"</p>"+
        '<div class="script-block" style="margin:10px 0 8px;font-size:13.3px;">'+esc(s.fala)+"</div>"+
        copiaBtn(s.fala,"Copiar")+"</div>";
    }).join("")+"</div>";
  }
  h += "</div>";

  // ---- o mix que funciona ali
  if(a.mix.suficiente){
    h += '<div class="section"><div class="section-head"><h2>'+ico("escala",17)+"O que vende nesta praça</h2>"+
      '<span class="faint">'+a.mix.n+" franquias ativas</span></div>"+
      '<div class="card"><p class="muted" style="margin:0 0 12px;font-size:13.5px;">Comparado com a média da rede no país. É a evidência mais forte que temos: comportamento real de quem já opera aí.</p>'+
      '<div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>Negócio</th>'+
      '<th style="text-align:right;">Aqui</th><th style="text-align:right;">Brasil</th><th style="text-align:right;">Diferença</th></tr></thead><tbody>'+
      a.mix.itens.map(function(it){
        var cor = it.dif == null ? "" : it.dif >= 25 ? "var(--success)" : it.dif <= -25 ? "var(--danger)" : "var(--ink-faint)";
        return "<tr><td>"+esc(it.nome)+' <span class="faint">'+it.qtd+" de "+a.mix.n+"</span></td>"+
          '<td class="num" style="color:var(--ink);">'+it.pctAqui+"%</td>"+
          '<td class="num" style="color:var(--ink-faint);">'+it.pctBrasil+"%</td>"+
          '<td class="num" style="color:'+cor+';">'+(it.dif==null?"—":(it.dif>0?"+":"")+it.dif+"%")+"</td></tr>";
      }).join("")+"</tbody></table></div></div></div>";
  } else if(a.naCidade > 0){
    h += '<div class="section">'+callout("info","aviso","Só "+a.naCidade+" franquia"+(a.naCidade===1?"":"s")+" em "+esc(m.nome)+". Pouco para comparar mix — com essa base, qualquer porcentagem é ruído.")+"</div>";
  }

  // ---- produtos
  if(a.produtos.length){
    h += '<div class="section"><div class="section-head"><h2>'+ico("dinheiro",17)+"Produtos com maior aderência</h2></div>"+

          comBadge(x.prod.c)+"</button>";
      }).join("")+"</div></div>";
  }

  // ---- indicadores crus, com procedência
  var linhas = [];
  camposDaCidade(m).forEach(function(c){
    if(ind[c.id] == null || ind[c.id] === "") return;
    linhas.push({nome:c.nome, valor:fmtCampo(ind[c.id], c), fonte:c.fonte, data:c.data});
  });
  a.estimativas.forEach(function(e){
    linhas.push({nome:e.nome, valor:fmtNum(e.valor), fonte:e.fonte, data:"", conta:e.conta});
  });
  h += '<div class="section"><div class="section-head"><h2>'+ico("livro",17)+"Números e procedência</h2></div>";
  h += linhas.length
    ? '<div class="card"><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>Indicador</th>'+

          '<td class="num" style="color:var(--ink);">'+l.valor+"</td>"+
          '<td><span class="faint">'+esc(l.fonte||"não informada")+(l.data? " · "+esc(l.data):"")+"</span></td></tr>";
      }).join("")+"</tbody></table></div></div>"
    : '<div class="empty">Nenhum indicador importado ainda para este município.</div>';

  // ---- conformidade, de propósito no fim

  if((conf.naoUsar||[]).length){
    h += '<div class="section">'+callout("danger","proibido",
      "<b>Nada disso é promessa.</b> São sinais de mercado para orientar a conversa — o resultado depende do franqueado, da execução e das condições vigentes. Continua valendo: "+
      esc((conf.naoUsar||[]).slice(0,3).join(" · ")))+"</div>";
  }
  return h;
}

function resumoGeoTexto(cod){
  var m = municipioPorCodigo(cod);
  if(!m) return "";
  var a = analisarPraca(m);
  var L = [m.nome + " (" + m.uf + ")"];
  if(a.pop) L.push("População: " + fmtNum(a.pop));
  L.push("Franquias na cidade: " + a.naCidade + " · no estado: " + a.noEstado);
  if(a.sinais.length){
    L.push("");
    L.push("Sinais:");
    a.sinais.forEach(function(s){ L.push("- " + s.titulo + " — " + s.evidencia); });
  }
  if(a.produtos.length){
    L.push("");
    L.push("Produtos com maior aderência:");
    a.produtos.slice(0,5).forEach(function(x){ L.push("- " + x.prod.p + " (" + x.prod.c + ")"); });
  }
  L.push("");
  L.push("Sinais de mercado, não promessa de resultado.");
  return L.join("\n");
}
